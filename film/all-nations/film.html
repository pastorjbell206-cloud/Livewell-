     family as the promise to Abram reaches them, drawn in (Blauw's "centripetal"), gathered at Pentecost and sent
     home again, and at the end grown into a multitude too large to count. Peoples differ only in where they stand,
     never in colour or shape. Languages are abstract stroke marks, not real scripts; Cyril and Methodius's alphabet
     is invented glyph shapes. The LORD "coming down" is a faint light only (never above 0.12); God is never drawn.
     Pentecost is a few small mustard flame shapes well above the dots, touching none. Jesus is one upright mustard
     bar (the servant, the child, the mountain, the Lamb); there is no throne figure. Jonah's fish is not shown.
     Nothing is drawn across a verse. Words and timing come from script.json and timeline.json.
     Open with ?t=42 to freeze on second 42. -->
