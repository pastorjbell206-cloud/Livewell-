    el("path", { d: "M0 -50 C-30 -64 -70 -64 -100 -52 V52 C-70 40 -30 40 0 54 C30 40 70 40 100 52 V-52 C70 -64 30 -64 0 -50 Z", fill: PAPER, stroke: INK, "stroke-width": 3.2, "stroke-linejoin": "round" }, g); el("line", { x1: 0, x2: 0, y1: -50, y2: 54, stroke: INK, "stroke-width": 3 }, g);

  const vS = verse(SC.start, 640, 132, 26, 60, false);

  return (t) => {
    // ---- strip ----
    const sweep = (i) => fr(T0, T0E, 0.02 + i * 0.07), inStart = span(t, T0 - 0.3, Z0 - 0.3, 0.4, 0.5), mvOn = span(t, L0 - 0.2, LE + 0.2, 0.5, 0.6);

    mvBars.forEach((b, i) => op(b, mvOn * up(t, mvAt[i], 0.6)));

    // ---- the dip-and-rise line (layout line 2, and the close) ----
    const cvL = span(t, L1 - 0.4, H0 - 0.3, 0.5, 0.5), cvZ = up(t, Z0 - 0.4, 0.6) * (1 - up(t, END + 1.0, 0.5)), cv = Math.max(cvL, cvZ); op(gCurve, cv);

      op(labNow, up(t, zz ? Z0 : fr(L1, LE, 0.6), 0.5)); op(labAfter, up(t, zz ? Z0 + 1.0 : fr(L1, LE, 0.78), 0.5)); }

      flags.forEach((f, i) => { op(f, up(t, A0 + 1.8 + i * 0.12, 0.4)); f.setAttribute("transform", `rotate(${(5 * Math.sin(t * 2.2 + i)).toFixed(2)} ${470 + 41 * (i + 1)} 240)`); });

      const ribOut = 1 - up(t, P2 - 0.5, 0.8);

      gather.forEach((g) => { const k = up(t, P0 + 1.0 + g.d, 2.2); set(g.e, { cx: mix(g.x + 260, g.x, k).toFixed(1), cy: g.y }); op(g.e, k); });
