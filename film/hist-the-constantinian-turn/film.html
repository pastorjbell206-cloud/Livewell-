<!doctype html>
<!-- "When Rome became Christian" (church history film, lesson /theology/history/the-constantinian-turn). Ten
     scenes: a scale with a small church and a throne in its pans, and a ring that never closes; the Milvian
     Bridge, the river and Rome, Lactantius's dream and Eusebius's cross of light, the column crossing; Milan's
     edict between Constantine and Licinius, the seized book and the church an emperor builds, its door opening
     on light; the ledger of gains beside the church, the bishops gathering into the hall at Nicaea around a
     throne; the hall become a church with the throne inside it, the price tag, two exiles, the crowd pouring
     in; Priscillian's name and a candle, Martin of Tours breaking with the bishops, the arc from Diocletian to
     Trier; the scale again for the dispute over Constantine, and faith and ambition braided; Julian's temple
     rising and sinking, Thessalonica, the throne, the Lord's table and Ambrose; Rome's fallen skyline, The City
     of God, Hebrews 13:14 and the city to come; the timeline running on with a ring for every generation, the
     thread of favor, and the open ring around the church.
     A timeline from 300 to 430 runs along the bottom from the bridge to the close.
     A death is named, never pictured: a lit candle beside a name is the only sign.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->
<html lang="en"><head><meta charset="utf-8"><title>When Rome became Christian</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, soft, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));
  const CS = (id) => CH[id].start, CE = (id) => CH[id].end;
  const at = (id, k, f = 0) => S(id, k) + f * (E(id, k) - S(id, k));   // a point inside line k, so the picture follows the voice
  const T = (p, cls, x, y, s, size, anchor, fill) => { const e = txt(p, cls, x, y, s, size, fill ? { fill } : undefined); if (anchor) e.setAttribute("style", (e.getAttribute("style") || "") + `text-anchor:${anchor};`); return e; };
  const G = (p) => el("g", {}, p || world);
  const R = rng(312);
  const END = F.VOICE_END;

  // ---------- shared shapes ----------
  const arcD = (cx, cy, r, a0, a1) => { const p = (a) => [(cx + r * Math.cos(a * Math.PI / 180)).toFixed(1), (cy + r * Math.sin(a * Math.PI / 180)).toFixed(1)]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
  const CHURCH = ["M-58 0 V-74 L0 -118 L58 -74 V0 Z", "M0 -118 V-148", "M-11 -137 H11", "M-14 0 V-34 H14 V0"];
  const church = (p, sw = 3) => { const g = G(p); g._ls = CHURCH.map((d) => line(g, d, { "stroke-width": sw })); return g; };
  const drawChurch = (g, k) => { draw(g._ls[0], clamp(k * 1.3)); draw(g._ls[1], clamp(k * 2 - 0.9)); draw(g._ls[2], clamp(k * 2.5 - 1.5)); draw(g._ls[3], clamp(k * 1.6 - 0.5)); };
  const throne = (p, sw = 3) => { const g = G(p); g._fill = el("path", { d: "M-20 -26 V-72 Q0 -86 20 -72 V-26 Z", fill: WARM }, g);
    g._ls = ["M-30 -26 H30", "M-24 -26 V0 M24 -26 V0", "M-20 -26 V-72 Q0 -86 20 -72 V-26"].map((d) => line(g, d, { "stroke-width": sw })); return g; };
  const drawThrone = (g, k) => { g._ls.forEach((l, i) => draw(l, clamp(k * 1.8 - i * 0.4))); op(g._fill, clamp(k * 2 - 1)); };
  const sheet = (p, w, h, rows, seed) => { const g = G(p), r = rng(seed), bh = Math.max(2.4, h * 0.03);
    el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, fill: PAPER, stroke: INK, "stroke-width": 2.2 }, g);
    for (let i = 0; i < rows; i++) { const y = -h / 2 + h * 0.18 + i * (h * 0.6 / Math.max(1, rows - 1)); let x = -w / 2 + w * 0.14; const end = w / 2 - w * 0.14 - (i === rows - 1 ? w * 0.3 : 0);
      while (x < end - 4) { const bw = Math.min(end - x, 5 + r() * w * 0.2); el("rect", { x, y: y - bh / 2, width: bw, height: bh, rx: bh / 2, fill: INK }, g); x += bw + Math.max(3, w * 0.03); } }
    return g; };
  const closedBook = (p, w = 70, h = 92) => { const g = G(p); el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, fill: PAPER, stroke: INK, "stroke-width": 2.2 }, g); el("rect", { x: -w / 2, y: -h / 2, width: 10, height: h, fill: INK }, g); return g; };
  const FLAME = "M0 0 C-6 -3 -7 -11 0 -21 C7 -11 6 -3 0 0 Z";
  const candle = (p, h = 40, w = 14) => { const g = G(p);
    el("rect", { x: -w / 2, y: -h, width: w, height: h, rx: 2, fill: PAPER, stroke: INK, "stroke-width": 2 }, g);
    el("line", { x1: 0, y1: -h, x2: 0, y2: -h - 6, stroke: INK, "stroke-width": 1.8, "stroke-linecap": "round" }, g);
    const glow = el("circle", { cx: 0, cy: -h - 15, r: 19, fill: MUSTARD }, g), fl = G(g); el("path", { d: FLAME, fill: MUSTARD }, fl);
    g._lit = (k, t) => { op(glow, 0.15 * k); op(fl, k); if (k > 0) fl.setAttribute("transform", `translate(0 ${-h - 4}) scale(${(k * (1 + 0.05 * Math.sin(t * 2.7))).toFixed(3)} ${(k * (1 + 0.08 * Math.sin(t * 2.1))).toFixed(3)})`); };
    g._lit(0, 0); return g; };
  // a label in a pill, for the scale's pans
  const chip = (p, s) => { const g = G(p), w = s.length * 10 + 26; el("rect", { x: -w / 2, y: -13, width: w, height: 26, rx: 13, fill: PAPER, stroke: INK, "stroke-width": 1.8 }, g); T(g, "lab", 0, 4.5, s, 11, null, INK); return g; };
  // a balance: pivot at the group's origin; setS(angle, drawn) tilts it (angle < 0 puts the left pan down)
  const mkScale = (p, L, drop, pw) => {
    const g = G(p), post = line(g, `M0 0 V${drop + 120}`, { "stroke-width": 3 }), base = line(g, `M-64 ${drop + 120} H64`, { "stroke-width": 3 });
    const sides = [-1, 1].map((s) => { const str = [0, 1].map(() => el("line", { stroke: STONE, "stroke-width": 1.6 }, g)); const pan = G(g);
      el("path", { d: `M${-pw / 2} 0 Q0 ${pw * 0.24} ${pw / 2} 0 Z`, fill: WARM, stroke: INK, "stroke-width": 2.5, "stroke-linejoin": "round" }, pan); return { s, str, pan }; });
    const beam = el("line", { stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, g), pivot = el("circle", { r: 7, fill: INK }, g);
    const setS = (a, k = 1) => { draw(post, k); draw(base, clamp(k * 1.6 - 0.4)); op(pivot, clamp(k * 3));
      const cx = L * Math.cos(a) * k, cy = L * Math.sin(a) * k; set(beam, { x1: (-cx).toFixed(1), y1: (-cy).toFixed(1), x2: cx.toFixed(1), y2: cy.toFixed(1) });
      sides.forEach((sd) => { const ex = sd.s * L * Math.cos(a), ey = sd.s * L * Math.sin(a), py = ey + drop, pk = clamp(k * 4 - 3);
        move(sd.pan, ex, py); op(sd.pan, pk); set(sd.str[0], { x1: ex.toFixed(1), y1: ey.toFixed(1), x2: (ex - pw / 2).toFixed(1), y2: py.toFixed(1) }); set(sd.str[1], { x1: ex.toFixed(1), y1: ey.toFixed(1), x2: (ex + pw / 2).toFixed(1), y2: py.toFixed(1) }); sd.str.forEach((s) => op(s, pk)); }); };
    return { g, sides, setS };
  };

  // ================= the timeline along the bottom: 300 to 430 =================
  const TLY = 548, YX = (y) => 150 + (y - 300) * (980 / 130);
  const gTL = G();
  const tlLine = line(gTL, `M${YX(300)} ${TLY} H${YX(430)}`, { stroke: STONE, "stroke-width": 2.5 });
  const tlTicks = [300, 325, 350, 375, 400, 425].map((y) => { const g = G(gTL); el("line", { x1: YX(y), x2: YX(y), y1: TLY - 6, y2: TLY + 6, stroke: STONE, "stroke-width": 2 }, g); T(g, "lab", YX(y), TLY + 28, String(y), 12); return g; });
  const dioc = el("circle", { cx: YX(303), cy: TLY, r: 6, fill: BONE, stroke: INK, "stroke-width": 2 }, gTL);
  const EV = [
    [S("bridge", 0) + 0.6, 312, "312 · MILVIAN BRIDGE"],
    [S("milan", 0) + 0.3, 313, "313 · MILAN"],
    [at("gains", 1, 0.6), 321, "321 · SUNDAY"],
    [at("gains", 2, 0.3), 325, "325 · NICAEA"],
    [at("costs", 2, 0.45), 380, "380 · OFFICIAL"],
    [S("trier", 0) + 1.0, 385, "TRIER · THE 380s"],
    [S("held", 0) + 0.8, 361, "361 · JULIAN"],
    [S("held", 1) + 0.2, 390, "390 · THESSALONICA"],
    [S("city", 0) + 0.4, 410, "410 · ROME FALLS"],
  ].map(([t, y, s]) => ({ t, y, s, dot: el("circle", { cx: YX(y), cy: TLY, r: 4.5, fill: INK }, gTL), lab: T(gTL, "lab", YX(y), TLY - 18, s, 13, null, INK) }));
  const trArc = line(gTL, `M${YX(303)} ${TLY - 8} Q${(YX(303) + YX(385)) / 2} ${TLY - 152} ${YX(385)} ${TLY - 8}`, { stroke: MUSTARD, "stroke-width": 2.5 });
  const trArcLab = T(gTL, "lab", (YX(303) + YX(385)) / 2, TLY - 93, "FROM DIOCLETIAN TO TRIER", 13);
  const rareRing = el("circle", { cx: YX(390), cy: TLY, r: 14, fill: "none", stroke: MUSTARD, "stroke-width": 2.5 }, gTL);
  const marker = el("circle", { cy: TLY, r: 8, fill: MUSTARD }, gTL);
  const markX = (t) => { let x = YX(312); for (const e of EV) { if (t < e.t) break; x = mix(x, YX(e.y), up(t, e.t, 1.2)); } return x; };
  // the close: the line runs on past 430, a ring for every generation's own 312
  const gExt = G(), ext = el("line", { x1: 640, y1: 330, x2: 640, y2: 330, stroke: STONE, "stroke-width": 2.5, "stroke-dasharray": "6 8" }, gExt);
  const extRings = [0, 1, 2, 3, 4, 5, 6].map((i) => el("circle", { cx: 690 + i * 70, cy: 330, r: 10, fill: BONE, stroke: MUSTARD, "stroke-width": 2.5 }, gExt));
  const extLab = T(gExt, "lab", 900, 296, "EVERY GENERATION SINCE", 13), extLab2 = T(gExt, "lab", 900, 376, "ITS OWN 312", 13, null, MUSTARD);
  const drawTL = (t) => {
    const v = span(t, S("bridge", 0) - 0.3, S("close", 1) + 0.6, 0.8, 0.8) * (1 - 0.72 * span(t, CS("sincere") + 0.2, CS("held") + 0.3, 0.8, 0.8));
    op(gTL, v);
    if (v > 0) {
      draw(tlLine, up(t, S("bridge", 0) - 0.3, 1.6)); tlTicks.forEach((g, i) => op(g, up(t, S("bridge", 0) + i * 0.15, 0.5)));
      const sh = up(t, CS("close") + 0.2, 1.6);
      gTL.setAttribute("transform", `translate(150 ${mix(TLY, 330, sh).toFixed(1)}) scale(${mix(1, 0.5, sh).toFixed(3)}) translate(-150 ${-TLY})`);
      EV.forEach((e, i) => { const nx = EV[i + 1] ? EV[i + 1].t : CS("close"); op(e.lab, span(t, e.t, nx, 0.5, 0.5) * (e.y === 385 ? 1 - up(t, S("trier", 2), 0.4) : 1)); op(e.dot, up(t, e.t, 0.4)); });
      op(dioc, up(t, at("milan", 1, 0.2), 0.5));
      set(marker, { cx: markX(t).toFixed(1) }); op(marker, up(t, S("bridge", 0) + 0.4, 0.5));
      draw(trArc, up(t, S("trier", 2) + 0.3, 1.8)); op(trArc, span(t, S("trier", 2) + 0.2, CS("sincere") + 0.6, 0.3, 0.6)); op(trArcLab, span(t, S("trier", 2) + 1.6, CS("sincere") + 0.6, 0.6, 0.6));
      op(rareRing, span(t, at("held", 3, 0.6), CS("city") + 0.3, 0.6, 0.6) * (0.6 + 0.4 * Math.sin(t * 2.4))); set(rareRing, { r: (13 + 3 * Math.sin(t * 1.7)).toFixed(1) });
    }
    const ve = span(t, CS("close") + 0.8, S("close", 1) + 0.6, 0.6, 0.8); op(gExt, ve);
    if (ve > 0) { set(ext, { x2: mix(640, 1130, up(t, CS("close") + 1.0, 2.6)).toFixed(1) });
      extRings.forEach((r, i) => { op(r, up(t, CS("close") + 1.4 + i * 0.4, 0.5)); set(r, { r: (9 + 1.5 * Math.sin(t * 1.6 + i)).toFixed(1) }); });
      op(extLab, up(t, S("close", 0) + 1.2, 0.6)); op(extLab2, up(t, at("close", 0, 0.55), 0.6)); }
  };

  // ================= 1. the question: a church and a throne on a scale =================
  const Q0 = S("question", 0), Q1 = S("question", 1);
  const g1 = G(); move(g1, 640, 196);
  const sc1 = mkScale(g1, 210, 150, 150);
  const c1 = church(sc1.sides[0].pan, 5); move(c1, 0, -3, 0.55);
  const th1 = throne(sc1.sides[1].pan, 3.6); move(th1, 0, -3, 0.85);
  const labV = T(g1, "lab", -210, 226, "A GREAT VICTORY?", 15), labW = T(g1, "lab", 210, 226, "SOMETHING GONE WRONG?", 15);
  const ring1 = line(g1, arcD(0, 0, 34, -55, 235), { stroke: MUSTARD, "stroke-width": 3 });
  const draw1 = (t) => {
    const v = span(t, Q0 - 0.2, CS("bridge") + 0.5, 0.6, 0.8); op(g1, v); if (v <= 0) return;
    const k = up(t, Q0 - 0.1, 1.6), sway = Math.sin((t - Q0) * 1.1) * 0.12 * (1 - up(t, Q1 + 0.2, 2.4));
    sc1.setS(sway, k);
    drawChurch(c1, up(t, Q0 + 1.0, 1.4)); drawThrone(th1, up(t, at("question", 0, 0.55), 1.4));
    op(labV, up(t, Q0 + 1.6, 0.6)); op(labW, up(t, at("question", 0, 0.7), 0.6));
    draw(ring1, up(t, at("question", 1, 0.5), 1.8)); op(ring1, up(t, at("question", 1, 0.5), 0.3));
  };

  // ================= 2. the Milvian Bridge, 312 =================
  const B = [0, 1, 2, 3].map((k) => S("bridge", k));
  const g2 = G();
  const ptsL = [], ptsR = [];
  for (let y = 112; y <= 504; y += 6) { ptsL.push([772 + 9 * Math.sin(y / 38), y]); ptsR.push([828 + 9 * Math.sin(y / 38 + 0.7), y]); }
  const pd = (pts) => pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y}`).join(" ");
  const riverFill = el("path", { d: pd(ptsL) + " " + ptsR.slice().reverse().map(([x, y]) => `L${x.toFixed(1)} ${y}`).join(" ") + " Z", fill: MUTED, "fill-opacity": 0.55 }, g2);
  const bankL = line(g2, pd(ptsL), { stroke: LINE, "stroke-width": 2.5 }), bankR = line(g2, pd(ptsR), { stroke: LINE, "stroke-width": 2.5 });
  const deck = el("rect", { x: 734, y: 368, width: 132, height: 24, fill: PAPER }, g2);
  const bridge = ["M734 368 H866", "M734 392 H866", "M744 392 Q770 374 796 392 M804 392 Q830 374 856 392", "M734 368 V392 M866 368 V392"].map((d) => line(g2, d, { "stroke-width": 3 }));
  const brLab = T(g2, "lab", 800, 470, "MILVIAN BRIDGE", 14);
  const rome = G(g2);
  [[985, 44, 62], [1031, 56, 88], [1089, 40, 70], [1131, 50, 96]].forEach(([x, w, h]) => el("rect", { x, y: 440 - h, width: w, height: h, fill: WARM, stroke: INK, "stroke-width": 2 }, rome));
  el("path", { d: "M1035 352 A24 24 0 0 1 1083 352 Z", fill: WARM, stroke: INK, "stroke-width": 2 }, rome); el("line", { x1: 975, x2: 1192, y1: 440, y2: 440, stroke: INK, "stroke-width": 2.5 }, rome);
  [1141, 1156, 1171].forEach((x) => el("line", { x1: x, x2: x, y1: 360, y2: 436, stroke: STONE, "stroke-width": 2 }, rome));
  const romeLab = T(g2, "lab", 1085, 470, "ROME", 14);
  const rDots = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) rDots.push({ g: el("circle", { r: 10, fill: STONE }, g2), x: 886 + c * 32, y: 340 + r * 40, i: rDots.length });
  const rivalLab = T(g2, "lab", 918, 312, "A RIVAL", 13);
  const cDots = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 7; c++) { const g = G(g2), i = cDots.length; el("circle", { r: 11, fill: PAPER, stroke: INK, "stroke-width": 2.4 }, g);
    const m = [line(g, "M0 -6 V6", { stroke: MUSTARD, "stroke-width": 2.6 }), line(g, "M-5 -2 H5", { stroke: MUSTARD, "stroke-width": 2.6 })];
    cDots.push({ g, m, x: 250 + c * 48, y: 340 + r * 40, r, c, i, ex: 886 + (i % 3) * 30, ey: 318 + Math.floor(i / 3) * 20 }); }
  const conLab = T(g2, "lab", 394, 470, "CONSTANTINE", 14);
  const moon = G(g2); el("path", { d: "M0 -24 A24 24 0 1 0 0 24 A12 24 0 0 1 0 -24 Z", fill: WARM, stroke: INK, "stroke-width": 2 }, moon);
  const stars = [[36, -14], [52, 12], [-44, 18]].map(([x, y]) => el("circle", { cx: x, cy: y, r: 2.4, fill: STONE }, moon)); move(moon, 240, 168);
  const lacLab = T(g2, "lab", 240, 236, "LACTANTIUS · A DREAM", 13);
  const crossV = line(g2, "M560 124 V206", { stroke: MUSTARD, "stroke-width": 4.5 }), crossH = line(g2, "M532 150 H588", { stroke: MUSTARD, "stroke-width": 4.5 });
  const rays = [...Array(9)].map((_, i) => { const a = Math.PI + (i + 0.5) * Math.PI / 9; return line(g2, `M${(560 + Math.cos(a) * 48).toFixed(1)} ${(165 + Math.sin(a) * 48).toFixed(1)} L${(560 + Math.cos(a) * 60).toFixed(1)} ${(165 + Math.sin(a) * 60).toFixed(1)}`, { stroke: MUSTARD, "stroke-width": 2 }); });
  const eusLab = T(g2, "lab", 560, 236, "EUSEBIUS · A CROSS OF LIGHT", 13), conquer = T(g2, "ital", 560, 282, "conquer by this", 32);
  const miss = [el("line", { x1: 292, x2: 384, y1: 168, y2: 168, stroke: STONE, "stroke-width": 2, "stroke-dasharray": "5 6" }, g2), el("line", { x1: 416, x2: 508, y1: 168, y2: 168, stroke: STONE, "stroke-width": 2, "stroke-dasharray": "5 6" }, g2)];
  const draw2 = (t) => {
    const v = span(t, CS("bridge") - 0.1, S("milan", 0) - 0.1, 0.7, 0.7); op(g2, v); if (v <= 0) return;
    draw(bankL, up(t, B[0] - 0.4, 1.6)); draw(bankR, up(t, B[0] - 0.2, 1.6)); op(riverFill, up(t, B[0] + 0.4, 1.0));
    bridge.forEach((b, i) => draw(b, up(t, B[0] + 1.0 + i * 0.2, 0.8))); op(deck, up(t, B[0] + 1.0, 0.6)); op(brLab, up(t, B[0] + 1.8, 0.6));
    op(rome, up(t, B[0] + 2.2, 0.8)); move(rome, 0, 6 * (1 - up(t, B[0] + 2.2, 1.0))); op(romeLab, up(t, B[0] + 2.6, 0.6));
    const won = up(t, E("bridge", 0) - 1.0, 0.8), gone = 1 - up(t, B[3], 0.8);
    rDots.forEach((d) => { const k = up(t, B[0] + 1.6 + d.i * 0.08, 0.7); set(d.g, { cx: (d.x + 30 * (1 - k)).toFixed(1), cy: (d.y + 1.5 * Math.sin(t * 1.3 + d.i)).toFixed(1) }); op(d.g, k * (1 - 0.7 * won) * gone); });
    op(rivalLab, up(t, B[0] + 2.4, 0.6) * (1 - 0.7 * won) * gone);
    const cross0 = at("bridge", 3, 0.3);
    cDots.forEach((d) => { const k = up(t, B[0] + 0.6 + d.c * 0.1 + d.r * 0.05, 0.8), m = up(t, cross0 + (6 - d.c) * 0.14 + d.r * 0.06, 2.4), n = 1 - m;
      const x0 = d.x - 30 * (1 - k), x = n * n * n * x0 + 3 * n * n * m * 780 + 3 * n * m * m * 820 + m * m * m * d.ex, y = n * n * n * d.y + 3 * n * n * m * 380 + 3 * n * m * m * 380 + m * m * m * d.ey;
      move(d.g, x, y + 1.5 * Math.sin(t * 1.1 + d.i), mix(1, 0.7, m)); op(d.g, k);
      d.m.forEach((l, j) => draw(l, up(t, at("bridge", 1, 0.45) + d.i * 0.1 + j * 0.15, 0.4))); });
    op(conLab, up(t, B[0] + 1.4, 0.6) * (1 - up(t, cross0, 0.6)));
    const mk = up(t, B[1] - 0.2, 1.0); op(moon, mk); move(moon, 240, 168 + 6 * (1 - mk)); stars.forEach((s, i) => op(s, mk * (0.5 + 0.5 * Math.sin(t * 1.5 + i * 2)))); op(lacLab, up(t, B[1] + 0.4, 0.6));
    draw(crossV, up(t, B[2] + 0.6, 1.0)); draw(crossH, up(t, B[2] + 1.2, 0.8)); rays.forEach((r, i) => { draw(r, up(t, B[2] + 1.6 + i * 0.1, 0.5)); op(r, 0.55 + 0.45 * Math.sin(t * 1.4 + i)); });
    op(eusLab, up(t, B[2] + 0.4, 0.6)); op(conquer, up(t, at("bridge", 2, 0.72), 0.8));
    miss.forEach((m, i) => op(m, up(t, B[3] + 0.2 + i * 0.5, 0.5) * 0.9));
  };

  // ================= 3. Milan, 313: the edict, the seized book, the church whose door opens =================
