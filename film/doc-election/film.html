<!doctype html>
<!-- "Chosen" (doctrine film: election). One continuous picture in ten scenes: a field of people and the four
     the Bible names as chosen; the word election and its three kinds (people for tasks, a people for Himself,
     the Servant), resting on love and always sent out; Abraham, the one for the many, and the choosing that
     moves on to David among the sheep; the great peoples and the fewest, under Deuteronomy 7:7; the mountain
     of the transfiguration, the Twelve sent to bear fruit, and the line of the world's foundation; the long
     debate, drawn as two equal strands; five identical cards, one for each reading in the file's differ
     section, each growing to the centre for the same span, in the same colours, then returning to the row;
     the five lines that meet at common ground; a standing that rests on love while the steps of achievement
     flatten; Romans 11:33 over widening depth, and lines going out to the families of the earth.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
<html lang="en"><head><meta charset="utf-8"><title>Chosen</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));
  const CS = (id) => CH[id].start;
  const Ls = (id) => CH[id].lines.map((_, k) => S(id, k));
  const D = (id, k) => E(id, k) - S(id, k);
  const T = (p, cls, x, y, s, size, anchor, fill) => { const e = txt(p, cls, x, y, s, size, fill ? { fill } : undefined); if (anchor) e.setAttribute("style", (e.getAttribute("style") || "") + `text-anchor:${anchor};`); return e; };
  const G = (p) => el("g", {}, p || world);
  const R = rng(311);
  const dot = (p, r = 8, fill = INK) => el("circle", { r, fill }, p);
  const at = (e, x, y) => set(e, { cx: x.toFixed(1), cy: y.toFixed(1) });
  const ring = (p, r, stroke = INK, w = 2.4, dash) => el("circle", { r, fill: "none", stroke, "stroke-width": w, ...(dash ? { "stroke-dasharray": dash } : {}) }, p);

  const disc = (n, r) => [...Array(n)].map((_, i) => { const rr = r * Math.sqrt((i + 0.5) / n), a = i * 2.39996; return [Math.cos(a) * rr, Math.sin(a) * rr]; });

  const chain = (t, x, y, moves) => { for (const [a, x1, y1, d = 1.2] of moves) { const k = up(t, a, d); x = mix(x, x1, k); y = mix(y, y1, k); } return [x, y]; };
  // the light that stands for the Chosen One (never a figure)
  const light = (p, r = 18) => { const g = G(p); g._halo = el("circle", { r: r * 2.3, fill: WARM }, g); g._core = el("circle", { r, fill: MUSTARD }, g);
    g._rays = [...Array(12)].map((_, i) => { const a = i * Math.PI / 6, c = Math.cos(a), s = Math.sin(a); return line(g, `M${(c * r * 1.4).toFixed(1)} ${(s * r * 1.4).toFixed(1)} L${(c * r * 2).toFixed(1)} ${(s * r * 2).toFixed(1)}`, { stroke: MUSTARD, "stroke-width": 2.2 }); }); return g; };
  const shine = (g, t, a, x, y, s = 1) => { const k = up(t, a, 0.9); move(g, x, y, s); op(g._core, k); set(g._halo, { r: (g._core.getAttribute("r") * (2.1 + 0.25 * Math.sin(t * 1.3))).toFixed(1) }); op(g._halo, k * 0.9);
    g._rays.forEach((r, i) => { draw(r, up(t, a + 0.3 + i * 0.06, 0.5)); op(r, k * (0.55 + 0.45 * Math.sin(t * 1.4 + i))); }); };
  // a quadratic path and a point along it
  const qpt = (x0, y0, cx, cy, x1, y1, k) => [mix(mix(x0, cx, k), mix(cx, x1, k), k), mix(mix(y0, cy, k), mix(cy, y1, k), k)];

  // ================= 1. why them? a field of people, and four the Bible names =================
  const Q = Ls("question"), dQ0 = D("question", 0), dQ1 = D("question", 1);
  const C2 = Ls("confess"), dC1 = D("confess", 1), dC2 = D("confess", 2);
  const A3 = Ls("abraham");
  const g1 = G(), fieldG = G(g1);
  const field = [...Array(58)].map(() => ({ x: 100 + R() * 1080, y: 140 + R() * 430, p: R() * 6.28, d: R(), e: dot(fieldG, 4.5, LINE) }));
  const IX = [300, 640, 980], IY = 390;                        // the three kinds, in scene 2
  const icAt = [C2[1] + dC1 * 0.04, C2[1] + dC1 * 0.36, C2[1] + dC1 * 0.64];
  const nameAt = [0.5, 0.63, 0.75, 0.87].map((f) => Q[0] + dQ0 * f);
  const NAMES = [["ABRAHAM", 250, 300, 1], ["ISRAEL", 500, 440, 12], ["DAVID", 770, 270, 1], ["THE APOSTLES", 1030, 430, 12]];
  const groups = NAMES.map(([name, x, y, n], gi) => {
    const pts = n === 1 ? [[0, 0]] : gi === 3 ? [...Array(12)].map((_, i) => [Math.cos(i * Math.PI / 6) * 30, Math.sin(i * Math.PI / 6) * 30]) : disc(12, 30);
    const f = field[gi * 7 % field.length];
    const dots = pts.map(([dx, dy]) => ({ dx, dy, sx: n === 1 ? f.x : 100 + R() * 1080, sy: n === 1 ? f.y : 140 + R() * 430, e: dot(g1, n === 1 ? 9 : 6, INK) }));
    const rr = n === 1 ? 24 : 50;
    return { name, x, y, n, dots, rr, at: nameAt[gi], ring: ring(g1, rr, STONE, 2, "5 6"), lab: T(g1, "lab", x, n === 1 ? y - rr - 14 : y + rr + 26, name, 14) };
  });
  // where each named group goes afterwards: Abraham and David become "people for tasks", Israel "a people"
  const later = [
    (t) => [[icAt[0] - 0.4, 272, IY], [A3[0] - 0.6, 240, 380, 1.4]],
    (t) => [[icAt[1] - 0.5, IX[1], IY]],
    (t) => [[icAt[0] - 0.2, 328, IY]],

  const why = T(g1, "ital", 640, 170, "why them?", 56);

  const draw1 = (t) => {

    });
    op(why, up(t, Q[1] + dQ1 * 0.18, 0.7) * fade); why.setAttribute("y", (176 - 6 * up(t, Q[1] + dQ1 * 0.18, 2)).toFixed(1));
    const mk = up(t, Q[1] + dQ1 * 0.55, 0.7); at(me, 640, 528 + 2 * Math.sin(t)); op(me, mk * fade); at(meRing, 640, 528); op(meRing, mk * fade * (0.6 + 0.4 * Math.sin(t * 2))); op(meQ, up(t, Q[1] + dQ1 * 0.7, 0.6) * fade);
  };

  // ================= 2. God's free choosing: three kinds, on love, always sent =================
  const g2 = G();
  const elec = T(g2, "disp", 640, 180, "election", 66);
  const icLab = [["PEOPLE FOR TASKS"], ["A PEOPLE FOR HIMSELF"], ["THE SERVANT,", "HIS CHOSEN ONE"]].map((ls, i) => ls.map((s, j) => T(g2, "lab", IX[i], 470 + j * 22, s, 14)));
  const taskArrows = [272, 328].map((x) => line(g2, `M${x} 376 V340 M${x - 7} 348 L${x} 340 L${x + 7} 348`, { "stroke-width": 2.4 }));
  const lt2 = light(g2, 18);
  const base2 = line(g2, "M200 520 H1080", { stroke: STONE, "stroke-width": 2.5 }), baseLab = T(g2, "lab", 640, 556, "RESTS ON GOD'S LOVE, NOT ON MERIT", 14);
  const sent = IX.flatMap((x) => [-1, 0, 1].map((s) => { const x0 = x + s * 14, y0 = 344, x1 = x + s * 50, y1 = s ? 300 : 290;

  const dA0 = D("abraham", 0), dA2 = D("abraham", 2);
  const g3 = G(), AB = [240, 380];
  const FAM = [[520, 200], [720, 168], [930, 210], [1110, 280], [500, 470], [700, 520], [910, 470], [1110, 520], [790, 345]];
  const fams = FAM.map(([x, y], i) => { const g = G(g3); const halo = el("circle", { r: 34, fill: WARM }, g); const ds = disc(5, 15).map(([dx, dy]) => el("circle", { cx: dx, cy: dy, r: 5, fill: INK }, g));
    const cx = (AB[0] + x) / 2, cy = Math.min(AB[1], y) - 60; const ln = line(g3, `M${AB[0]} ${AB[1]} Q${cx} ${cy} ${x} ${y}`, { stroke: LINE, "stroke-width": 2 });
    return { x, y, g, halo, ds, ln, q: [AB[0], AB[1], cx, cy, x, y], tr: dot(g3, 3.5, STONE), d: i / FAM.length }; });
  const abLab = T(g3, "lab", AB[0], 432, "ABRAHAM", 14), famLab = T(g3, "lab", 820, 586, "ALL THE FAMILIES OF THE EARTH", 14);
  const oneMany = T(g3, "ital", 250, 490, "the one, for the many", 34);
  const over = T(g3, "ital", 640, 190, "the overlooked", 44);
  const chooser = ring(g3, 30, INK, 2.4, "6 6");
  const DV = [930, 440], sheep = [[-70, -10], [-40, 32], [50, 26], [78, -16], [22, 52], [-92, 30]].map(([dx, dy]) => { const g = G(g3); el("ellipse", { rx: 15, ry: 10, fill: PAPER, stroke: STONE, "stroke-width": 2 }, g); el("circle", { cx: 14, cy: -3, r: 4.5, fill: STONE }, g); return { g, dx, dy }; });
  const david = dot(g3, 7, INK), dvLab = T(g3, "lab", DV[0], 530, "DAVID, THE YOUNGEST", 14);
  const draw3 = (t) => {
    const v = span(t, CS("abraham") - 0.2, CS("love") + 0.4, 0.6, 0.8); op(g3, v); if (v <= 0) return;
    const web = 1 - up(t, A3[2] - 0.2, 0.9);
    op(abLab, up(t, A3[0] + 0.6, 0.6) * web);
    fams.forEach((f, i) => { const a = A3[0] + 0.8 + f.d * 1.6, k = up(t, a, 0.7); move(f.g, f.x, f.y + 2 * Math.sin(t * 0.8 + i)); op(f.g, k * web);
      const b = A3[0] + dA0 * 0.55 + f.d * 1.4; draw(f.ln, up(t, b, 0.9)); op(f.ln, web); op(f.halo, up(t, b + 0.8, 0.6) * (0.8 + 0.2 * Math.sin(t * 1.5 + i)));
      const ph = ((t - b - 1) * 0.35 + f.d) % 1; const [px, py] = qpt(...f.q, Math.max(0, ph)); at(f.tr, px, py); op(f.tr, up(t, A3[1], 0.6) * web * (1 - ph * 0.5)); });

    const ck = up(t, A3[2] + dA2 * 0.3, 2.2), [cx, cy] = qpt(AB[0], AB[1], 600, 250, DV[0], DV[1], ck);
    at(chooser, cx, cy); op(chooser, up(t, A3[2] + 0.2, 0.6)); set(chooser, { r: (24 + 3 * Math.sin(t * 1.8)).toFixed(1) });
    op(over, up(t, A3[2] + 0.4, 0.7));
    const sk = up(t, A3[2] + 0.1, 0.9);
    sheep.forEach((s, i) => { move(s.g, DV[0] + s.dx + 3 * Math.sin(t * 0.5 + i), DV[1] + s.dy, 1, (i % 2 ? -1 : 1) * 4 * Math.sin(t * 0.4 + i)); op(s.g, sk); });
    at(david, DV[0], DV[1] + 1.5 * Math.sin(t)); op(david, sk); op(dvLab, up(t, A3[2] + dA2 * 0.5, 0.6));

  // ================= 4. not for their size: the great peoples and the fewest, under Deuteronomy 7:7 =================
  const L4 = Ls("love"), dL1 = D("love", 1);

  const PEO = [[200, 455, 22, 46], [420, 470, 26, 50], [860, 470, 24, 48], [1080, 455, 22, 46]];
  const peoples = PEO.map(([x, y, n, r], i) => ({ x, y, ds: disc(n, r).map(([dx, dy]) => ({ dx, dy, e: dot(g4, 5, INK) })), d: i }));
  const fewest = disc(5, 13).map(([dx, dy]) => ({ dx, dy, e: dot(g4, 5, INK) }));
  const FW = [640, 478];
  const loveHalo = el("circle", { cx: FW[0], cy: FW[1], r: 40, fill: WARM }, g4); g4.insertBefore(loveHalo, g4.firstChild);
  const loveRing = line(g4, `M${FW[0]} ${FW[1] - 42} A42 42 0 1 1 ${FW[0] - 0.1} ${FW[1] - 42}`, { stroke: MUSTARD, "stroke-width": 2.6 });
  const othLab = [T(g4, "lab", 310, 552, "THE OTHER PEOPLES", 13), T(g4, "lab", 970, 552, "THE OTHER PEOPLES", 13)], fewLab = T(g4, "lab", 640, 552, "THE FEWEST", 13);
  const loved = T(g4, "lab", 640, 400, "BECAUSE THE LORD LOVED THEM", 14, null, INK);
  const V4 = ["The LORD did not set His affection on you and choose you", "because you were more numerous than the other peoples,", "for you were the fewest of all peoples."].map((s, i) => T(g4, "disp", 640, 168 + i * 44, s, 34));
  const ref4 = T(g4, "lab", 640, 306, "DEUTERONOMY 7:7 · BEREAN STANDARD BIBLE", 13);
  const draw4 = (t) => {
    const v = span(t, CS("love") - 0.2, CS("chosenone") + 0.4, 0.6, 0.8); op(g4, v); if (v <= 0) return;
    peoples.forEach((p) => p.ds.forEach((d, i) => { const k = up(t, L4[0] + 0.2 + p.d * 0.3 + i * 0.02, 0.8); at(d.e, p.x + d.dx * mix(1.6, 1, k) + 1.5 * Math.sin(t * 0.7 + i), p.y + d.dy * mix(1.6, 1, k) + 1.5 * Math.cos(t * 0.6 + i)); op(d.e, k); }));

    othLab.forEach((l, i) => op(l, up(t, L4[1] + dL1 * 0.5 + i * 0.3, 0.6))); op(fewLab, up(t, L4[1] + dL1 * 0.85, 0.6));
    V4.forEach((l, i) => op(l, up(t, L4[1] - 0.2 + i * dL1 * 0.3, 0.8))); op(ref4, up(t, L4[1] + 1.2, 0.7));
    const lk = up(t, L4[2] + 0.2, 1.0); draw(loveRing, up(t, L4[2] + 0.3, 1.4)); op(loveRing, lk); op(loveHalo, lk * (0.85 + 0.15 * Math.sin(t * 1.4))); set(loveHalo, { r: (40 + 3 * Math.sin(t * 1.1)).toFixed(1) });
    op(loved, up(t, L4[2] + 0.9, 0.7));
  };

  // ================= 5. the Chosen One: the mountain, the Twelve sent out, before the foundation of the world =================
  const N5 = Ls("chosenone"), dN0 = D("chosenone", 0), dN1 = D("chosenone", 1), dN2 = D("chosenone", 2);
  const g5 = G();
  const mtn = line(g5, "M330 540 L510 392 L566 420 L640 300 L716 384 L760 362 L950 540", { "stroke-width": 3 });
  const cloud = line(g5, "M566 212 C560 186 596 172 616 190 C628 162 676 160 688 190 C716 176 748 198 732 222 Z", { stroke: LINE, "stroke-width": 2.4 });
  const lt5 = light(g5, 15);
  const trLab = T(g5, "lab", 640, 578, "THE TRANSFIGURATION", 14);
  const twelve = [...Array(12)].map((_, i) => { const a = (-15 + i * 210 / 11) * Math.PI / 180; return { a, ex: 640 + Math.cos(a) * 470, ey: 380 + Math.sin(a) * 175, e: dot(g5, 6, INK),
    fruit: [0.45, 0.7, 0.92].map(() => el("circle", { r: 4, fill: WARM, stroke: STONE, "stroke-width": 1.6 }, g5)), path: line(g5, "M0 0", { stroke: LINE, "stroke-width": 1.6 }) }; });
  twelve.forEach((w) => w.path.setAttribute("d", `M640 352 L${w.ex.toFixed(1)} ${w.ey.toFixed(1)}`));
  const twLab = T(g5, "lab", 640, 134, "THE TWELVE · TO GO AND BEAR FRUIT", 14);
  const fnd = line(g5, "M1090 430 H190", { "stroke-width": 3 }), tick = line(g5, "M820 414 V446", { "stroke-width": 3 });
  const fndLab = T(g5, "lab", 820, 478, "THE FOUNDATION OF THE WORLD", 13);
  const inHim = ring(g5, 54, INK, 2.6), inDots = disc(7, 30).map(([dx, dy]) => ({ dx, dy, e: dot(g5, 5, INK) }));
  const inLab = T(g5, "lab", 400, 350, "CHOSEN IN HIM", 14), holy = line(g5, "M458 404 C600 320 900 320 1050 410", { stroke: STONE, "stroke-width": 2.4 }), holyHead = line(g5, "M1036 396 L1050 410 L1030 414", { stroke: STONE, "stroke-width": 2.4 });
  const holyLab = T(g5, "lab", 1070, 478, "TO BE HOLY", 13);
  const draw5 = (t) => {
    const v = span(t, CS("chosenone") - 0.2, CS("history") + 0.6, 0.6, 0.8); op(g5, v); if (v <= 0) return;
    const m = 1 - up(t, N5[2] - 0.3, 0.9);
    draw(mtn, up(t, N5[0] - 0.2, 1.6)); op(mtn, m); draw(cloud, up(t, N5[0] + dN0 * 0.45, 1.2)); op(cloud, m);
    shine(lt5, t, N5[0] + dN0 * 0.4, 640, 262 + 2 * Math.sin(t * 0.8)); op(lt5, m); op(trLab, up(t, N5[0] + dN0 * 0.5, 0.6) * m);
    const go = up(t, N5[1] + 0.6, Math.max(1.6, dN1 - 0.4));
    twelve.forEach((w, i) => { const gk = up(t, N5[1] - 0.2 + i * 0.06, 0.6), sx = 640 + Math.cos(i * Math.PI / 6) * 26, sy = 352 + Math.sin(i * Math.PI / 6) * 18;
      at(w.e, mix(sx, w.ex, go), mix(sy, w.ey, go)); op(w.e, gk * m); draw(w.path, go); op(w.path, m * 0.9);
      w.fruit.forEach((f, j) => { const fk = up(go, [0.45, 0.7, 0.92][j], 0.08); at(f, mix(640, w.ex, [0.45, 0.7, 0.92][j]), mix(352, w.ey, [0.45, 0.7, 0.92][j])); op(f, fk * m); }); });
    op(twLab, up(t, N5[1] + 0.4, 0.6) * m);
    const tk = up(t, N5[2] - 0.1, 1.4); draw(fnd, tk); draw(tick, up(t, N5[2] + 0.8, 0.5)); op(fndLab, up(t, N5[2] + dN2 * 0.6, 0.6));
    const hk = up(t, N5[2] + dN2 * 0.25, 0.8); at(inHim, 400, 430); op(inHim, hk); set(inHim, { r: (54 + 2 * Math.sin(t * 1.5)).toFixed(1) });
    inDots.forEach((d, i) => { at(d.e, 400 + d.dx, 430 + d.dy + 1.4 * Math.sin(t + i)); op(d.e, up(t, N5[2] + dN2 * 0.3 + i * 0.08, 0.5)); });
    op(inLab, up(t, N5[2] + dN2 * 0.35, 0.6));
    draw(holy, up(t, N5[2] + dN2 * 0.78, 1.2)); draw(holyHead, up(t, N5[2] + dN2 * 0.78 + 1.1, 0.3)); op(holyLab, up(t, N5[2] + dN2 * 0.78 + 1.0, 0.6));
    // the line runs on into the next scene, then gives way
    op(fnd, 1 - up(t, CS("history") + 0.2, 0.6)); op(tick, 1 - up(t, CS("history"), 0.5));
  };

  // ================= 6. one of the longest debates: two strands, drawn the same =================
  const H6 = Ls("history"), dH1 = D("history", 1), dH2 = D("history", 2);
  const g6 = G();
  const trunk = line(g6, "M140 430 H320", { "stroke-width": 3 });
  const strandU = line(g6, "M320 430 C380 430 390 340 460 340 H1140", { "stroke-width": 3 }), strandL = line(g6, "M320 430 C380 430 390 520 460 520 H1140", { "stroke-width": 3 });
  const penU = dot(g6, 6, INK), penL = dot(g6, 6, INK);
  const labU = T(g6, "lab", 800, 314, "MANY GREEK FATHERS · FOREKNOWLEDGE", 14), labL = T(g6, "lab", 800, 562, "AUGUSTINE · FAITH ITSELF IS GOD'S GIFT", 14);
  const debate = T(g6, "ital", 640, 196, "one of the church's longest debates", 42);
  const strandPt = (lower, k) => { const y1 = lower ? 520 : 340; if (k < 0.16) { const kk = k / 0.16; return qpt(320, 430, 390, mix(430, y1, 0.5), 460, y1, kk); } return [mix(460, 1140, (k - 0.16) / 0.84), y1]; };
  const draw6 = (t) => {
    const v = span(t, CS("history") - 0.1, CS("differ") + 0.6, 0.6, 0.8); op(g6, v); if (v <= 0) return;
    draw(trunk, up(t, H6[0] - 0.4, 1.0)); op(debate, up(t, H6[0] + 0.6, 0.8)); debate.setAttribute("y", (202 - 6 * up(t, H6[0] + 0.6, 2.4)).toFixed(1));
    const ku = up(t, H6[1] + 0.2, Math.max(2, dH1 - 0.6)), kl = up(t, H6[2] + 0.2, Math.max(2, dH2 - 0.6));
    draw(strandU, ku); draw(strandL, kl);
    const [ux, uy] = strandPt(false, ku), [lx, ly] = strandPt(true, kl); at(penU, ux, uy); at(penL, lx, ly);
    op(penU, up(t, H6[1], 0.4) * (1 - up(t, CS("differ"), 0.4))); op(penL, up(t, H6[2], 0.4) * (1 - up(t, CS("differ"), 0.4)));
    op(labU, up(t, H6[1] + 1.0, 0.6)); op(labL, up(t, H6[2] + 1.0, 0.6));
  };

  // ================= 7. where Christians differ: five identical cards, each given the same centre and the same time =================
  const K7 = Ls("differ");
  const g7 = G();
  const TX = [172, 406, 640, 874, 1108], TY = 152, TW = 214, TH = 62;
  const BX = 640, BY = 388, BW = 840, BH = 300;
  const VIEWS = [
    { tok: ["AUGUSTINIAN", "AND REFORMED"], head: "Augustinian and Reformed", who: "AUGUSTINE · CALVIN · DORT · WESTMINSTER", p1: "chosen out of sheer grace, not foreseen faith", p2: "so that grace remains grace" },
    { tok: ["ARMINIAN", "AND WESLEYAN"], head: "Arminian and Wesleyan", who: "ARMINIUS · WESLEY · ODEN · OLSON", p1: "elected as God foreknows their faith", p2: "true to God's love for every person" },
    { tok: ["CORPORATE", "ELECTION IN CHRIST"], head: "Corporate election in Christ", who: "SHANK · KLEIN · ABASCIANO", p1: "first, God's choosing of a people", p2: "true to the Bible's own categories" },
    { tok: ["LUTHERAN SINGLE", "PREDESTINATION"], head: "Lutheran single predestination", who: "THE FORMULA OF CONCORD · 1577", p1: "elected in Christ, none predestined to damnation", p2: "no further than God has revealed" },
    { tok: ["CHRIST AS", "THE ELECT ONE"], head: "Christ as the elect one", who: "KARL BARTH · 1942", p1: "Christ, the electing God and the elected human", p2: "election as good news, not fear" },
  ];
  // every view gets exactly the same parts: one card, two token rows, a heading, one mustard rule, one row of names, two phrases, a progress line
  const cards = VIEWS.map((vw, i) => {
    const g = G(g7);
    const rect = el("rect", { rx: 6, fill: PAPER, stroke: STONE, "stroke-width": 2 }, g);
    const tok = vw.tok.map((s, j) => { const e = T(g, "lab", TX[i], TY - 5 + j * 20, s, 12); e.setAttribute("style", e.getAttribute("style") + "letter-spacing:2px;"); return e; });
    const head = T(g, "disp", BX, 296, vw.head, 44), rule = el("rect", { x: BX - 30, y: 316, width: 60, height: 3, fill: MUSTARD }, g);
    const who = T(g, "lab", BX, 356, vw.who, 14), p1 = T(g, "ital", BX, 426, vw.p1, 34), p2 = T(g, "ital", BX, 478, vw.p2, 34);
    const prog = el("line", { x1: BX - 300, x2: BX - 300, y1: 512, y2: 512, stroke: LINE, "stroke-width": 3, "stroke-linecap": "round" }, g);
    return { g, rect, tok, head, rule, who, p1, p2, prog };
  });
  // timing: each card grows as its first line begins and returns as its second line ends
  const win = [];
  VIEWS.forEach((_, i) => { const a = S("differ", 1 + 2 * i), b = E("differ", 2 + 2 * i); const gs = Math.max(a - 0.3, i ? win[i - 1].ss + 0.75 : -1e9); win.push({ a, b, gs, ss: Math.max(gs + 1.5, b - 0.5), mid: S("differ", 2 + 2 * i) }); });
  const tokensIn = (t, i) => up(t, K7[0] - 0.4 + i * 0.3, 0.7);
  const draw7 = (t) => {
    const v = span(t, CS("differ") - 0.2, CS("life") + 0.6, 0.6, 0.8); op(g7, v); if (v <= 0) return;
    const anyBig = win.some((w) => t > w.gs && t < w.ss + 0.75);
    cards.forEach((c, i) => {
      const w = win[i], grow = up(t, w.gs, 0.85) * (1 - up(t, w.ss, 0.75));
      const x = mix(TX[i], BX, grow), y = mix(TY, BY, grow), wd = mix(TW, BW, grow), ht = mix(TH, BH, grow);
      const drop = tokensIn(t, i), ty = (1 - drop) * -40;
      set(c.rect, { x: (x - wd / 2).toFixed(1), y: (y - ht / 2 + ty).toFixed(1), width: wd.toFixed(1), height: ht.toFixed(1) });
      // when small: full before the views begin and after they end, quieter while another card is in the centre
      const quiet = anyBig && grow < 0.01 ? 0.5 : 1;
      op(c.rect, drop * (grow > 0.01 ? 1 : quiet));
      c.tok.forEach((e, j) => { e.setAttribute("y", (TY - 5 + j * 20 + ty).toFixed(1)); op(e, drop * quiet * (1 - clamp(grow * 3))); });
      const inside = clamp((grow - 0.85) / 0.15);
      op(c.head, inside * up(t, w.gs + 0.6, 0.5)); op(c.rule, inside); set(c.rule, { width: (60 * up(t, w.gs + 0.8, 0.6)).toFixed(1), x: (BX - 30 * up(t, w.gs + 0.8, 0.6)).toFixed(1) });
      op(c.who, inside * up(t, w.gs + 1.2, 0.5)); op(c.p1, inside * up(t, w.a + 1.0, 0.6)); op(c.p2, inside * up(t, w.mid + 0.6, 0.6));
      const pk = clamp((t - w.a) / Math.max(1, w.b - w.a)); set(c.prog, { x2: (BX - 300 + 600 * pk).toFixed(1) }); op(c.prog, inside * 0.9);
    });
    // the card in the centre is drawn last, so nothing sits over it
    const active = win.findIndex((w) => t > w.gs && t < w.ss + 0.75); if (active >= 0 && g7.lastChild !== cards[active].g) g7.appendChild(cards[active].g);
  };

  // ================= 8. what they share: five equal lines meet at common ground =================
  const S8 = Ls("share"), dS0 = D("share", 0);
  const g8 = G(), CG = [640, 300];
  const joins = TX.map((x) => line(g8, `M${x} ${TY + TH / 2 + 4} C${x} ${TY + 100} ${CG[0]} ${CG[1] - 90} ${CG[0]} ${CG[1] - 32}`, { stroke: STONE, "stroke-width": 2.2 }));
  const cgHalo = el("circle", { cx: CG[0], cy: CG[1], r: 30, fill: WARM }, g8), cgRing = ring(g8, 30, MUSTARD, 2.8), cgDot = dot(g8, 7, INK);
  const cgLab = T(g8, "lab", CG[0], 356, "COMMON GROUND", 14);
  const shared = ["salvation begins with grace", "God predestines no one to sin", "the gospel offered freely to all"].map((s, i) => T(g8, "ital", 640, 418 + i * 50, s, 34));
  const draw8 = (t) => {
    const v = span(t, CS("share") - 0.2, CS("life") + 0.8, 0.6, 0.8); op(g8, v); if (v <= 0) return;
    const fade = 1 - up(t, CS("life") - 0.1, 0.7);
    joins.forEach((j) => { draw(j, up(t, S8[0] + 0.2, 1.6)); op(j, fade); });
    const ck = up(t, S8[0] + 1.6, 0.8); at(cgRing, CG[0], CG[1]); op(cgRing, ck * fade); op(cgHalo, ck * fade * (0.85 + 0.15 * Math.sin(t * 1.3))); set(cgHalo, { r: (30 + 3 * Math.sin(t * 1.1)).toFixed(1) });
    at(cgDot, CG[0], CG[1]); op(cgDot, ck * fade); op(cgLab, up(t, S8[0] + dS0 * 0.4, 0.6) * fade);
    shared.forEach((s, i) => op(s, up(t, S8[i] + (i ? 0.8 : dS0 * 0.6), 0.7) * fade));
  };

  // ================= 9. for an ordinary day: a standing that rests on love; the steps flatten =================
  const F9 = Ls("life"), dF0 = D("life", 0), dF1 = D("life", 1);
  const g9 = G(), GY = 470;
  const found = el("path", { d: `M330 ${GY} Q640 ${GY + 96} 950 ${GY} Z`, fill: WARM }, g9), foundLine = line(g9, `M330 ${GY} Q640 ${GY + 96} 950 ${GY}`, { stroke: MUSTARD, "stroke-width": 2.4 });
  const ground = line(g9, `M240 ${GY} H1040`, { "stroke-width": 3 });
  const believer = dot(g9, 10, INK), loveLab = T(g9, "lab", 640, GY + 82, "BEGAN IN HIS LOVE", 13);
  const stepsG = G(g9), steps = [0, 1, 2, 3].map((i) => el("rect", { x: 740 + i * 50, y: GY - 30 * (i + 1), width: 200 - i * 50, height: 30 * (i + 1), fill: "none", stroke: STONE, "stroke-width": 2, "stroke-dasharray": "0" }, stepsG));
  const achLab = T(g9, "lab", 840, GY - 146, "ACHIEVEMENT", 13);
  const least = [[400, "THE YOUNGEST"], [640, "THE WEAKEST"], [880, "THE LEAST LIKELY"]].map(([x, s]) => ({ x, e: dot(g9, 8, INK), halo: el("circle", { r: 22, fill: WARM }, g9), lab: T(g9, "lab", x, GY + 40, s, 13) }));
  least.forEach((l) => g9.insertBefore(l.halo, ground));
  const noBoast = T(g9, "ital", 640, 250, "no room for boasting", 44);
  const draw9 = (t) => {
    const v = span(t, CS("life") - 0.2, CS("close") + 0.6, 0.6, 0.8); op(g9, v); if (v <= 0) return;
    draw(ground, up(t, F9[0] - 0.4, 1.2));
    const fk = up(t, F9[0] + 0.6, 1.0), fOut = 1 - up(t, F9[1] - 0.2, 0.8);
    op(found, fk * fOut); draw(foundLine, up(t, F9[0] + 0.8, 1.4)); op(foundLine, fOut); op(loveLab, up(t, F9[0] + dF0 * 0.3, 0.6) * fOut);
    at(believer, 560, GY - 12 + 2 * Math.sin(t * 0.9)); op(believer, up(t, F9[0] - 0.2, 0.6) * (1 - up(t, F9[1] + dF1 * 0.4, 0.6)));
    // the steps are drawn, then fade back while the believer stays where they are; then they flatten to the ground
    const sk = up(t, F9[0] + dF0 * 0.35, 0.9), dim = 1 - 0.65 * up(t, F9[0] + dF0 * 0.6, 1.2), flat = up(t, F9[1] + 0.2, 1.4);
    stepsG.setAttribute("transform", `translate(0 ${GY}) scale(1 ${(1 - flat * 0.97).toFixed(3)}) translate(0 ${-GY})`); op(stepsG, sk * dim * (1 - up(t, F9[1] + 1.4, 0.6)));
    op(achLab, sk * dim * (1 - flat));
    op(noBoast, up(t, F9[1] + 0.3, 0.7));
    least.forEach((l, i) => { const a = F9[1] + dF1 * (0.42 + i * 0.17), k = up(t, a, 0.6); at(l.e, l.x, GY - 10 + 1.5 * Math.sin(t + i)); op(l.e, k); at(l.halo, l.x, GY - 10); op(l.halo, up(t, a + 0.3, 0.8) * (0.8 + 0.2 * Math.sin(t * 1.4 + i))); op(l.lab, up(t, a + 0.2, 0.6)); });
  };

  // ================= 10. Romans 11:33: the debate ends in praise; sent for the sake of the world =================
  const Z = Ls("close"), dZ0 = D("close", 0), END = F.VOICE_END;
  const g10 = G(), BKY = 440;
  const pageD = (s) => `M0 -44 C${-36 * s} -62 ${-96 * s} -62 ${-132 * s} -48 L${-132 * s} 48 C${-96 * s} 36 ${-36 * s} 36 0 54 Z`;
  const book = G(g10); el("path", { d: pageD(1), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, book); el("path", { d: pageD(-1), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, book);
  const bLines = []; [1, -1].forEach((s) => [-24, -6, 12, 30].forEach((dy) => bLines.push(line(book, `M${-18 * s} ${dy - 8} C${-52 * s} ${dy - 18} ${-88 * s} ${dy - 18} ${-116 * s} ${dy - 8}`, { stroke: STONE, "stroke-width": 2 }))));
  const romLab = T(g10, "lab", 640, 540, "ROMANS 9 TO 11", 13);
  const knot = line(g10, "M560 352 C600 300 680 400 700 340 C720 290 620 300 610 350 C600 400 700 380 690 330 C680 290 600 320 640 360", { stroke: STONE, "stroke-width": 2.4 });
  const praise = [-2, -1, 0, 1, 2].map((i) => line(g10, `M${640 + i * 22} 376 C${640 + i * 30} 340 ${640 + i * 46} 320 ${640 + i * 60} ${300 - Math.abs(i) * -8}`, { stroke: MUSTARD, "stroke-width": 2.2 }));
  const depth = [0, 1, 2, 3].map(() => el("ellipse", { cx: 640, cy: BKY, fill: "none", stroke: LINE, "stroke-width": 2 }, g10));
  g10.insertBefore(depth[3], g10.firstChild); g10.insertBefore(depth[2], g10.firstChild); g10.insertBefore(depth[1], g10.firstChild); g10.insertBefore(depth[0], g10.firstChild);
  const V10 = ["O, the depth of the riches of the wisdom and knowledge of God!", "How unsearchable are His judgments, and untraceable His ways!"].map((s, i) => T(g10, "disp", 640, 160 + i * 46, s, 36));
  const ref10 = T(g10, "lab", 640, 250, "ROMANS 11:33 · BEREAN STANDARD BIBLE", 13);
  const WORLD = [[160, 360], [250, 520], [420, 560], [860, 560], [1030, 520], [1120, 360], [330, 330], [950, 330]];
  const out10 = WORLD.map(([x, y], i) => { const sx = 640 + Math.sign(x - 640) * 134, ln = line(g10, `M${sx} ${BKY} Q${(sx + x) / 2} ${Math.min(BKY, y) - 30} ${x} ${y}`, { stroke: LINE, "stroke-width": 2 }); g10.insertBefore(ln, book); const g = G(g10); el("circle", { r: 24, fill: WARM }, g); disc(4, 11).forEach(([dx, dy]) => el("circle", { cx: dx, cy: dy, r: 4.5, fill: INK }, g)); return { x, y, ln, g, d: i / WORLD.length }; });
  const draw10 = (t) => {
    const v = span(t, CS("close") - 0.2, END + 2.5, 0.7, 0.9); op(g10, v); if (v <= 0) return;
    const bk = up(t, Z[0] - 0.2, 0.9); move(book, 640, BKY + 2 * Math.sin(t * 0.8), mix(0.7, 1, bk)); op(book, bk);
    bLines.forEach((l, i) => draw(l, up(t, Z[0] + 0.2 + i * 0.06, 0.6)));
    op(romLab, up(t, Z[0] + 0.8, 0.6) * (1 - up(t, Z[1] - 0.4, 0.6)));
    draw(knot, up(t, Z[0] + 0.6, dZ0 * 0.45)); op(knot, 1 - up(t, Z[0] + dZ0 * 0.62, 0.7));
    praise.forEach((p, i) => { draw(p, up(t, Z[0] + dZ0 * 0.7 + Math.abs(i) * 0.15, 0.9)); op(p, (1 - up(t, Z[1] - 0.3, 0.6)) * (0.7 + 0.3 * Math.sin(t * 1.6 + i))); });
    V10.forEach((l, i) => op(l, up(t, Z[1] - 0.2 + i * 2.6, 0.8))); op(ref10, up(t, Z[1] + 1.6, 0.7));
    depth.forEach((d, i) => { const ph = ((t - Z[1]) * 0.12 + i / 4) % 1, k = up(t, Z[1] + 0.4, 1.0); set(d, { rx: (150 + ph * 330).toFixed(1), ry: (40 + ph * 110).toFixed(1) }); op(d, k * (1 - ph) * 0.9 * (t > Z[1] ? 1 : 0)); });
    out10.forEach((o, i) => { const a = Z[2] + 0.4 + o.d * 2.4; draw(o.ln, up(t, a, 1.0)); const k = up(t, a + 0.8, 0.6); move(o.g, o.x, o.y + 2 * Math.sin(t * 0.8 + i)); op(o.g, k); });
  };

  F.title("Chosen");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.9);
  return (t) => { draw1(t); draw2(t); draw3(t); draw4(t); draw5(t); draw6(t); draw7(t); draw8(t); draw9(t); draw10(t); };
});
