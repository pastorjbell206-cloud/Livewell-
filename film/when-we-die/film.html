<!doctype html>
<!-- "What happens when we die?". Viewers may be grieving: the picture is gentle and holds nothing of a body.
     No bodies, no graves with bodies, no coffins. Lazarus' tomb is only a closed stone at a hillside; Easter's
     tomb is an empty, lit opening with its stone set aside. God is never drawn: only mustard light at 0.12 or less.
     Jesus, where needed, is the one upright bar of mustard. People are plain ink dots, all alike, never in pairs.
     The four views of the time between are equal cards, none highlighted. The house at the close has many
     windows in a grid and its door off to one side, so it cannot read as a face.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->

    const o3 = up(t, G0 - 0.5, 0.6) * (1 - up(t, N0 - 0.6, 0.6)); op(g3, o3);

    scale.setAttribute("transform", `translate(${(-160 * up(t, A0, 2.2)).toFixed(1)} 0)`); beam.setAttribute("transform", `translate(0 300) rotate(${tilt.toFixed(2)} 640 0)`);
    op(sepLab, up(t, I2 + 0.4, 0.8));

    // ----- 6 easter -----
    const o6 = up(t, A0 + 1.7, 1.3) * (1 - up(t, A3 - 0.6, 0.6)); op(g6, o6);
    op(hill6, 1 - up(t, A2 + 0.2, 0.8)); inside.setAttribute("opacity", (0.1 + 0.02 * Math.sin(t * 1.5)).toFixed(3));
    const rh = 92 * up(t, at("easter", 1, 0.62), 1.6); set(risen, { y: (GY - rh).toFixed(1), height: Math.max(0.1, rh).toFixed(1) }); op(risen, rh > 1 ? 1 : 0);

    op(gFruit, up(t, A3 - 0.4, 0.8) * (1 - up(t, B0 + 0.2, 0.9)));

    const o7 = up(t, B0 - 0.2, 0.8) * (1 - up(t, D0 - 0.4, 0.8)); op(g7, o7);
    op(dawn7, 0.8 + 0.2 * Math.sin(t * 1.1)); draw(bracket, up(t, at("between", 0, 0.55), 1.2)); op(brLab, up(t, at("between", 0, 0.6), 0.8));
    op(shelter, up(t, B1 - 0.3, 0.8)); op(restLight, 0.1 * up(t, B2, 1.4)); op(sleepLab, up(t, at("between", 1, 0.08), 0.6)); op(lukeLab, up(t, at("between", 1, 0.4), 0.6));

    traveller.setAttribute("cy", (459 - 3 * Math.abs(Math.sin(t * 4)) * (tr > 0.01 && tr < 0.99 ? 1 : 0)).toFixed(1));
    const jb = up(t, B2 + 0.2, 1.2); set(jesus7, { y: (GY - 92 * jb).toFixed(1), height: Math.max(0.1, 92 * jb).toFixed(1) }); op(jesus7, jb > 0.01 ? 1 : 0);
    op(vBetween, span(t, B2 - 0.3, D0 - 0.4, 0.6));

    const o8 = up(t, D0 - 0.1, 0.6) * (1 - up(t, M0 - 0.6, 0.8)); op(g8, o8);
    const cardAt = [D0 + 0.3, at("differ", 1, 0.02), at("differ", 1, 0.66), D2 + 0.1];

    views.forEach((v, i) => { const k = up(t, cardAt[i], 0.9); op(v, k); v.setAttribute("transform", `translate(0 ${((1 - k) * 18 + 3 * Math.sin(t * 1.1 + i * 1.6) * still8).toFixed(1)})`); });
    op(qDiffer, span(t, D3 + 0.4, M0 - 0.3, 0.9));

    // ----- 9 morning -----
    const o9 = up(t, M0 - 0.3, 1.0) * (1 - up(t, C0 - 0.6, 0.8)); op(g9, o9);
    grass.forEach((g, i) => { op(g, up(t, M0 - 0.2 + i * 0.03, 0.5)); g.setAttribute("transform", `rotate(${(2.5 * Math.sin(t * 0.9 + i * 0.4) * still8).toFixed(2)} ${(40 + i * 23.5).toFixed(1)} 470)`); });
    const rise = up(t, M2 - 0.4, 7);
    sun.setAttribute("transform", `translate(1010 470) scale(${(0.04 + 0.96 * rise).toFixed(3)} ${(0.02 + 0.98 * rise).toFixed(3)})`); op(sun, up(t, M2 - 0.4, 0.8));

    op(lone, up(t, W0 + 0.2, 0.9) * (1 - up(t, C0 - 0.6, 0.8)));

    wins.forEach((w, i) => op(w, 0.9 * up(t, at("close", 1, 0.02 + [0, 4, 1, 6, 3, 7, 2, 5][i] * 0.1), 0.8)));
    op(doorLight, 0.35 + 0.45 * up(t, C1, 2) + 0.04 * Math.sin(t * 1.6)); op(spill, 0.1 + 0.1 * up(t, C1, 2));
    const hw = up(t, C2 - 0.6, 6); homeward.setAttribute("cx", mix(160, 884, hw).toFixed(1)); op(homeward, up(t, C0 + 0.6, 0.8));
    homeward.setAttribute("cy", (459 - 3 * Math.abs(Math.sin(t * 4)) * (hw > 0.01 && hw < 0.99 ? 1 : 0)).toFixed(1));
    op(vClose, span(t, C2 - 0.3, END + 0.5, 0.6));
