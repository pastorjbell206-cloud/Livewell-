    const brk = up(t, vk[2] + 1.0, 1.0); icons9[2][0].setAttribute("transform", `translate(${(-12 * brk).toFixed(1)} ${(6 * brk).toFixed(1)}) rotate(${(-8 * brk).toFixed(1)} ${vc[2] - 56} ${vy + 5})`); icons9[2][1].setAttribute("transform", `translate(${(12 * brk).toFixed(1)} ${(6 * brk).toFixed(1)}) rotate(${(8 * brk).toFixed(1)} ${vc[2] + 56} ${vy + 5})`);
    icons9[3].setAttribute("transform", `translate(0 ${(-3 * Math.sin(t * 1.6)).toFixed(1)})`);
    const nc = atw("differ", 2, "This film"); draw(level9, up(t, nc, 1.2));

    // ----- 10 answer -----
    op(g10a, up(t, A0 - 0.4, 0.6) * (1 - up(t, A1 - 0.6, 0.6)));
    const dd = atw("answer", 0, "C. H."), mm = atw("answer", 0, "Leon"), bo = atw("answer", 0, "Many now");
    draw(arL, up(t, dd - 0.3, 0.8)); op(dodd, up(t, dd, 0.6)); draw(arR, up(t, mm - 0.3, 0.8)); op(morris, up(t, mm, 0.6));
    draw(both, up(t, bo, 1.2)); op(bothLab, up(t, bo + 0.8, 0.6));
    const prov = atw("answer", 0, "God provides");
    op(g10b, up(t, A1 - 0.4, 0.6) * (1 - up(t, at("answer", 1, 0.45), 0.7)));
    const pc = (t - A1 - 0.6) / 3.2, pk = clamp(pc); move(passC, mix(300, 980, pk), 440 - 30 * Math.sin(Math.PI * pk)); op(passC, span(t, A1 + 0.4, A1 + 4.4, 0.4));
    op(strLab, up(t, A1 + 0.8, 0.6)); op(kant10, up(t, A1, 0.6));
    const hd = atw("answer", 1, "It's the act"); op(head, up(t, hd - 0.3, 0.8) * (1 - up(t, A2 - 0.5, 0.6)));
    folk.forEach((f, i) => op(f, up(t, hd + 0.2 + i * 0.1, 0.4))); op(headLab, up(t, atw("answer", 1, "the head"), 0.6));
    op(g10c, up(t, A2 - 0.2, 0.8) * outAll);
    op(light10, (0.06 * span(t, prov - 0.1, A1 - 0.6, 0.8) + 0.11 * up(t, A2 + 0.6, 1.2)) * outAll);
    op(whoQ, up(t, A2 + 0.2, 0.8) * outAll);
    // the closing drop: from above, in the light, down to the altar
    const fall = up(t, A2 + 0.5, 3.6);
    if (t > F0) {
      move(drop, 640, mix(222, 352, fall) + 2 * Math.sin(t * 1.8));
      op(drop, up(t, A2 + 0.3, 0.8) * outAll); op(lifeLab, 0);
    } else op(drop, dOp);
  };
});
