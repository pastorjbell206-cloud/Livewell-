     Sophia and the two excommunications; 1204, the route not taken and the crack; forced union pulling

     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->

Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;

  const G = (p) => el("g", {}, p || world);
  const R = rng(1054);
  const END = F.VOICE_END;
  const ringD = (cx, cy, r) => `M${cx - r} ${cy} A${r} ${r} 0 1 1 ${cx + r} ${cy} A${r} ${r} 0 1 1 ${cx - r} ${cy}`;
  // a plain church: walls, roof, cross, round window, door; parts draw themselves in order
  const church = (p, door = true) => { const g = G(p);
    g._parts = [line(g, "M-92 60 H92"), line(g, "M-70 60 V-24 H70 V60"), line(g, "M-86 -20 L0 -92 L86 -20"), line(g, "M0 -92 V-128 M-13 -115 H13"), line(g, ringD(0, -48, 9), { "stroke-width": 2.4 })];

    g._door = el("path", { d: "M-20 60 V20 Q-20 0 0 0 Q20 0 20 20 V60 Z", fill: STONE }, g); op(g._door, 0); return g; };
  const drawChurch = (c, k) => c._parts.forEach((p, i) => draw(p, clamp(k * c._parts.length - i)));
  const page = (p, w, h, rows, seed) => { const g = G(p), r = rng(seed); el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, fill: PAPER, stroke: INK, "stroke-width": 2 }, g); const bars = [];
    for (let i = 0; i < rows; i++) { const y = -h / 2 + h * 0.16 + i * (h * 0.68 / Math.max(1, rows - 1)); let x = -w / 2 + w * 0.12; const end = w / 2 - w * 0.12; while (x < end - 4) { const bw = Math.min(end - x, 4 + r() * w * 0.2); bars.push(el("rect", { x, y: y - 2, width: bw, height: 4, rx: 2, fill: INK }, g)); x += bw + 4; } }

  const doc = (p) => { const g = G(p); el("rect", { x: -13, y: -17, width: 26, height: 34, rx: 2, fill: PAPER, stroke: INK, "stroke-width": 2 }, g); [-8, -2, 4, 10].forEach((y) => el("line", { x1: -7, x2: 7, y1: y, y2: y, stroke: STONE, "stroke-width": 1.6 }, g)); return g; };

  // ================= 1. the question: two churches that were one; a door slammed, or a slow drift =================
  const draw1 = (() => {
    const Q = Ls("question"), g = G();
    const A = church(g), B = church(g);
    const lA = T(g, "lab", 0, 0, "CATHOLIC", 15), lB = T(g, "lab", 0, 0, "ORTHODOX", 15);
    const one = T(g, "lab", 640, 508, "ONE CHURCH · FOR A THOUSAND YEARS", 15);

    return (t) => {
      const v = span(t, Q[0] - 1.3, CS("language") + 1.0, 0.8, 0.9); op(g, v); if (v <= 0) return;

      const xA = t < sp ? mix(400, 640, m) : mix(640, 330, d), xB = t < sp ? mix(880, 640, m) : mix(640, 950, d), y = 350, ph = ((1 - m) + d) * 1.6;

  })();

  // ================= 2. the first wall: Latin and Greek, a wall, Augustine, and trust thinning =================

    return (t) => {
      const v = span(t, CS("language") - 0.2, CS("empire") + 0.9, 0.8, 0.9); op(g, v); if (v <= 0) return;
      move(pL, 330, 320 + 2 * Math.sin(t * 0.8)); move(pR, 950, 320 + 2 * Math.sin(t * 0.8 + 1.3));
      pL._bars.forEach((b, i) => op(b, up(t, CS("language") + 0.3 + i * 0.03, 0.4))); pR._bars.forEach((b, i) => op(b, up(t, CS("language") + 0.6 + i * 0.03, 0.4)));
      op(hL, up(t, L[0] + 1.2, 0.6)); op(hR, up(t, L[0] + 2.4, 0.6));
      bricks.forEach((b) => { const k = up(t, L[0] + 0.4 + b.r * 0.34, 0.6); op(b.e, k); b.e.setAttribute("transform", `translate(0 ${(-(1 - k) * 16).toFixed(1)})`); });
      draw(aL, up(t, L[1] + 0.3, 1.3)); draw(aR, up(t, L[1] + 0.6, 1.3));
      const ak = up(t, at("language", 1, 0.5), 0.8); move(aug, 462, 392 + 2 * Math.sin(t), mix(0.8, 1, ak), -5); op(aug, ak); op(augL, up(t, at("language", 1, 0.56), 0.6));
      const gk = up(t, at("language", 1, 0.78), 1.0); move(ghost, mix(770, 818, gk), 392, 1, 5); op(ghost, gk * 0.7); op(ghostL, up(t, at("language", 1, 0.84), 0.6));
      draw(arc, up(t, L[2] + 0.1, 1.4)); const fade = up(t, L[2] + 1.8, 2.6);

  // ================= 3. two capitals: the empire as dots; the West falls away; the East still stands =================
  const draw3 = (() => {
    const M = Ls("empire"), g = G(), RO = [400, 345], CO = [880, 335];
    const bound = el("line", { x1: 640, x2: 640, y1: 170, y2: 530, stroke: LINE, "stroke-width": 2, "stroke-dasharray": "6 8" }, g);
    const keep = (x, y) => !(Math.hypot(x - RO[0], y - RO[1]) < 46 || Math.hypot(x - CO[0], y - CO[1]) < 46 || (Math.abs(y - 298) < 21 && (Math.abs(x - 400) < 50 || Math.abs(x - 880) < 132)) || Math.hypot(x - 820, y - 410) < 42 || Math.hypot(x - 950, y - 408) < 34 || Math.abs(x - 640) < 14);

    for (let x = 180; x <= 1100; x += 30) for (let y = 240; y <= 460; y += 28) { const jx = x + (R() - 0.5) * 12, jy = y + (R() - 0.5) * 10 + ((x / 30) % 2) * 6;
      if (((jx - 640) / 480) ** 2 + ((jy - 350) / 112) ** 2 < 1 && keep(jx, jy)) dots.push({ x: jx, y: jy, w: jx < 625, d: R(), e: el("circle", { cx: jx.toFixed(1), cy: jy.toFixed(1), r: 3.6, fill: INK }, g) }); }
    const ringR = line(g, ringD(...RO, 22)), ringC = line(g, ringD(...CO, 22));
    const dotR = el("circle", { cx: RO[0], cy: RO[1], r: 7, fill: INK }, g), dotC = el("circle", { cx: CO[0], cy: CO[1], r: 7, fill: INK }, g);

    const flock = [[10, 120], [55, 95], [100, 130], [145, 105], [190, 125], [225, 100], [320, 115]].map(([deg, rr]) => { const a = deg * Math.PI / 180, x = RO[0] + Math.cos(a) * rr * 1.5, y = RO[1] + Math.sin(a) * rr * 0.75, h = Math.hypot(x - RO[0], y - RO[1]);

    const pat = el("circle", { cx: 950, cy: 408, r: 8, fill: INK }, g);
    const thrL = T(g, "lab", 820, 466, "EMPEROR", 14), patL = T(g, "lab", 950, 466, "PATRIARCH", 14);
    return (t) => {
      const v = span(t, CS("empire") - 0.2, CS("authority") + 0.9, 0.8, 0.9); op(g, v); if (v <= 0) return;
      op(bound, up(t, CS("empire"), 0.8) * 0.9);

  // ================= 4. who has the last word: a hub and a council, set on a level scale =================
  const draw4 = (() => {

      return { x, y, s: line(hub, `M${x.toFixed(1)} ${y.toFixed(1)} L${(Math.cos(a) * 28).toFixed(1)} ${(Math.sin(a) * 28).toFixed(1)}`, { stroke: STONE, "stroke-width": 2 }), e: el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 8, fill: INK }, hub), f: el("circle", { r: 3, fill: STONE }, hub) }; });
    const hubC = el("circle", { r: 22, fill: PAPER, stroke: INK, "stroke-width": 3 }, hub), hubD = el("circle", { r: 7, fill: INK }, hub);
    const rp = [...Array(8)].map((_, i) => { const a = -Math.PI / 8 + (i / 8) * Math.PI * 2; return [Math.cos(a) * 105, Math.sin(a) * 105]; });
    const edges = rp.map((p, i) => line(ring, `M${p[0].toFixed(1)} ${p[1].toFixed(1)} L${rp[(i + 1) % 8][0].toFixed(1)} ${rp[(i + 1) % 8][1].toFixed(1)}`, { stroke: STONE, "stroke-width": 2 }));

    const hTop = T(g, "lab", 0, 0, "THE WEST · CATHOLIC TODAY", 15), rTop = T(g, "lab", 0, 0, "THE EAST · ORTHODOX TODAY", 15);
    const hBot = T(g, "lab", 380, 478, "ROME · SUCCESSOR OF PETER", 15), rBot = T(g, "lab", 900, 478, "ALL THE BISHOPS · IN COUNCIL", 15);
    const why1 = T(g, "lab", 410, 500, "A CENTER WHEN EMPIRES FELL", 13), why2 = T(g, "lab", 870, 492, "A GUARD AGAINST ONE BISHOP", 13), why3 = T(g, "lab", 870, 512, "CLAIMING TOO MUCH", 13);

    return (t) => {
      const v = span(t, CS("authority") - 0.2, CS("creed") + 0.9, 0.8, 0.9); op(g, v); if (v <= 0) return;

      [[postL, panL, -1], [postR, panR, 1]].forEach(([pp, pn, s]) => { const x = ex(s), y = ey(s); set(pp, { x1: x.toFixed(1), y1: y.toFixed(1), x2: x.toFixed(1), y2: (y - 34).toFixed(1) }); set(pn, { x1: (x - 70).toFixed(1), y1: (y - 34).toFixed(1), x2: (x + 70).toFixed(1), y2: (y - 34).toFixed(1) }); });

      rDots.forEach((e, i) => op(e, up(t, A[2] + 0.4 + i * 0.12, 0.5))); edges.forEach((e, i) => draw(e, up(t, A[2] + 1.4 + i * 0.18, 0.5)));
      const ta = t * 0.45; set(token, { cx: (Math.cos(ta) * 105).toFixed(1), cy: (Math.sin(ta) * 105).toFixed(1) }); op(token, up(t, A[2] + 3.0, 0.6));
      const hv = span(t, at("authority", 2, 0.5), A[3] - 0.1, 0.6, 0.5); op(honorRing, hv); op(honor1, hv); op(honor2, hv);
      const tops = span(t, A[1] + 0.3, A[4] - 0.2, 0.6, 0.5); move(hTop, hx, hy - mix(140, 82, k)); move(rTop, rx, ry - mix(140, 82, k)); op(hTop, tops); op(rTop, Math.min(tops, up(t, A[2] + 0.3, 0.6)));

    };
  })();

  // ================= 5. one word in the creed: proceeds from the Father, and the Son =================
