    set(cloth, { x: (420 + 400 * w).toFixed(1), y: (220 + 160 * Math.abs(Math.sin(w * Math.PI * 4))).toFixed(1) }); op(cloth, span(t, t8[1] + 0.3, t8[1] + 3.6, 0.3)); };

  F.title("Lost in translation?");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.9);
  return (t) => { draw1(t); draw2(t); draw3(t); draw4(t); draw5(t); draw6(t); draw7(t); draw8(t); draw9(t); };
});
