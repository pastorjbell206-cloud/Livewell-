<!-- "The Counter-Reformation" (church history film, lesson 11). One continuous picture in ten scenes: a time line
     from Luther to 1648 where two strands, renewal and war, braid into one story; the Alps, Trent, and the
     roads the pope's men and the emperor's men took to reach it; Trent's teaching set beside the reformers' in
     two equal columns with one clear line between; ten dioceses where bishops come home, preach and build
     seminaries while the pardon sellers' stalls fade; a dot map from Pamplona to Asia for Ignatius, Xavier,
     Teresa and Borromeo, lit at the end as holiness; a shelf of books under the Inquisition and the Index,
     and one conviction, a crown bound to an open book, the same on every side, with the Anabaptists apart;
     France, the Low Countries and England marked only with hollow rings; two rings far apart over grace and
     almost one over the sword; Prague, Magdeburg, France's money to Sweden and the German lands; Westphalia,
     where each ruler sets his land's religion and the one house of Christendom comes apart; the two readings
     side by side, rising from one record, both marked by the same water; the watching world, the century on
     the time line, a church built brick by brick, and Matthew 5:9.
     Violence is named in words and marked only by hollow rings and grey washes; nothing is pictured.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->
<html lang="en"><head><meta charset="utf-8"><title>The Counter-Reformation</title></head><body>

  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;

  const memo = (p, x, y, r = 7) => el("circle", { cx: x, cy: y, r, fill: "none", stroke: STONE, "stroke-width": 2 }, p);   // a hollow ring: a life remembered
  const crown = (p, fill = INK) => { const g = G(p); el("path", { d: "M-20 0 L-24 -24 L-11 -12 L0 -28 L11 -12 L24 -24 L20 0 Z", fill, stroke: fill, "stroke-width": 2, "stroke-linejoin": "round" }, g); return g; };
  const pageD = (s) => `M0 -50 C${-40 * s} -70 ${-110 * s} -70 ${-150 * s} -55 L${-150 * s} 55 C${-110 * s} 40 ${-40 * s} 40 0 60 Z`;

  const CAM_T = { fx: 740, fy: 430, z: 1.5 }, CAM_W = { fx: 570, fy: 360, z: 1.6 }, CAM_B = { fx: 650, fy: 345, z: 1.0 };

  }
  const lBish = T(g3, "lab", 640, 172, "BISHOPS LIVE IN THEIR DIOCESES AND PREACH", 14), lSem = T(g3, "lab", 640, 560, "A SEMINARY IN EVERY DIOCESE", 14);
  const lPard = T(g3, "lab", 640, 560, "THE PARDON SELLERS · ABOLISHED", 14), lDec = T(g3, "lab", 640, 548, "IT TOOK DECADES", 13);
