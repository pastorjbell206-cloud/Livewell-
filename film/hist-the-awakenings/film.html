    const eb = up(t, Z2 + 0.2, 0.7), go = up(t, AT("escaped", 2, 0.5), 2.4);
    const [ex, ey] = qpt([560, 400], [B.london[0] - 14, B.london[1] + 6], 20, go);
    move(eqBook, ex, ey + 2 * Math.sin(t), mix(1, 0.55, go)); op(eqBook, eb * (1 - up(t, Z3 + 0.4, 0.6)));
    draw(eqPath, up(t, AT("escaped", 2, 0.5), 2.4)); op(eqPath, up(t, AT("escaped", 2, 0.45), 0.3) * (1 - up(t, Z3 + 0.4, 0.6) * 0.6));
    op(eqLab, up(t, Z2 + 0.1, 0.6) * (1 - 0.5 * up(t, Z3, 0.6))); op(eqLab2, up(t, AT("escaped", 2, 0.55), 0.6) * (1 - 0.5 * up(t, Z3, 0.6)));
    op(wsLab, up(t, Z3 + 0.2, 0.6)); const lt = up(t, AT("escaped", 3, 0.42), 0.6), lf = up(t, AT("escaped", 3, 0.55), 2.2);
    move(letter, mix(560, B.london[0] - 6, lf), mix(410, B.london[1] - 6, lf) - Math.sin(lf * Math.PI) * 50, mix(1, 0.5, lf)); op(letter, lt);
    op(wsLab2, up(t, AT("escaped", 3, 0.45), 0.6)); pinPulse(lnPin, t, up(t, AT("escaped", 2, 0.75), 0.5));
  };

  // ================= 10. Newton; slowly, sight; alive but not yet whole =================
  const K0 = S("close", 0), K1 = S("close", 1), K2 = S("close", 2), K3 = S("close", 3), END = F.VOICE_END;
  const g10 = G(), sea = el("path", { fill: "none", stroke: STONE, "stroke-width": 2.5 }, g10), sea2 = el("path", { fill: "none", stroke: LINE, "stroke-width": 2 }, g10);
  const nShip = ship(g10), lamp = el("circle", { cx: 40, cy: -14, r: 6, fill: MUSTARD }, nShip.g);
  const l10a = lab(g10, 640, 492, "JOHN NEWTON · CONVERTED AT SEA · 1748", 14);
  const yrTicks = [...Array(6)].map((_, i) => el("rect", { x: 530 + i * 44 - 3, y: 510, width: 6, height: 22, rx: 2, fill: INK }, g10)), l10b = lab(g10, 640, 560, "SIX MORE YEARS AT THE TRADE", 13);
  const draw10 = (t) => {
    const v = span(t, CS("close") - 0.2, K1 + 0.5, 0.8, 0.8); op(g10, v); if (v <= 0) return;
    sea.setAttribute("d", waveD(150, 1130, 420, 4, 220, t * 0.6)); sea2.setAttribute("d", waveD(190, 1090, 446, 3, 260, t * 0.5 + 1)); op(sea, up(t, K0 - 0.5, 1.0)); op(sea2, up(t, K0 - 0.3, 1.0));
    nShip.g.setAttribute("transform", `translate(${mix(260, 1000, clamp((t - (K0 - 0.2)) / Math.max(4, E("close", 0) - K0 + 1.6))).toFixed(1)} ${(414 + 2 * Math.sin(t * 1.1)).toFixed(1)}) rotate(${(1.2 * Math.sin(t * 0.9)).toFixed(2)}) scale(0.62)`);
    op(nShip.g, up(t, K0 - 0.4, 0.8)); op(lamp, up(t, K0 + 0.6, 0.8) * (0.75 + 0.25 * Math.sin(t * 2)));
    op(l10a, up(t, K0 + 0.4, 0.7)); yrTicks.forEach((y, i) => op(y, up(t, AT("close", 0, 0.5) + i * 0.32, 0.4))); op(l10b, up(t, AT("close", 0, 0.62), 0.6));
  };
  const g10b = G(), pageAt = (x, seed, notes) => { const g = G(g10b); el("rect", { x: -90, y: -115, width: 180, height: 230, rx: 3, fill: PAPER, stroke: INK, "stroke-width": 2.6 }, g); const r = rng(seed), bars = [];
    for (let i = 0; i < 8; i++) { let bx = -66; const y = -82 + i * 24; while (bx < 56) { const w = 8 + r() * 30; if (bx + w > 66) break; bars.push(el("rect", { x: bx, y: y - 2.5, width: w, height: 5, rx: 2.5, fill: notes && i % 2 === 0 ? MUSTARD : STONE }, g)); bx += w + 7; } }
    g._bars = bars; g._x = x; return g; };
  const hymnPg = pageAt(470, 11, true), confPg = pageAt(810, 12, false);
  const l10c = lab(g10b, 470, 482, "A HYMN ABOUT AMAZING GRACE", 13), l10d = lab(g10b, 810, 482, "1788 · HIS CONFESSION", 13);
  const draw10b = (t) => {
    const v = span(t, K1 - 0.3, K2 + 0.4, 0.7, 0.7); op(g10b, v); if (v <= 0) return;
    [hymnPg, confPg].forEach((p, j) => { const a = j ? AT("close", 1, 0.55) : K1 + 0.1; move(p, p._x, 318 + 2 * Math.sin(t * 0.8 + j), 1, (j ? 2 : -2) * up(t, a, 0.8)); op(p, up(t, a, 0.7)); p._bars.forEach((b, i) => op(b, up(t, a + 0.2 + i * 0.03, 0.3))); });
    op(l10c, up(t, K1 + 0.6, 0.6)); op(l10d, up(t, AT("close", 1, 0.65), 0.6));
  };
  const g10c = G(), dk2 = disc(g10c);
  const live = el("circle", { cx: 640, cy: 330, r: 0, fill: MUSTARD }, g10c), whole = line(g10c, "M640 230 A100 100 0 1 1 639.9 230", { stroke: INK, "stroke-width": 3 });
  const draw10c = (t) => {
    const v = span(t, K2 - 0.3, END + 2.6, 0.8, 0.9); op(g10c, v); if (v <= 0) return;
    const shrink = up(t, K3 - 0.2, 1.8); move(dk2.g, 640, 330, mix(0.9, 0.25, shrink));
    op(dk2.glow, 0.24 * up(t, K2, 0.9) * (1 - shrink)); draw(dk2.rim, up(t, K2 - 0.1, 1.2)); op(dk2.rim, 1 - shrink);
    dk2.rays.forEach((r, i) => { draw(r, up(t, K2 + 0.3 + i * 0.05, 0.5)); op(r, (0.6 + 0.4 * Math.sin(t * 1.4 + i)) * (1 - shrink)); });
    const sight = up(t, AT("close", 2, 0.45), Math.max(3, E("close", 2) - AT("close", 2, 0.45) + 1.2));
    op(dk2.blot, 0.9 * up(t, K2 + 0.2, 0.8) * (1 - shrink)); set(dk2.blot, { rx: (46 * (1 - sight)).toFixed(1), ry: (46 * (1 - sight)).toFixed(1) });
    const lv = up(t, K3, 1.2); set(live, { r: (16 * lv * (1 + 0.08 * Math.sin(t * 2.2))).toFixed(1) }); op(live, lv);
    draw(whole, mix(0, 0.86, up(t, AT("close", 3, 0.25), 2.2)) + 0.07 * up(t, E("close", 3), 3.0)); op(whole, up(t, AT("close", 3, 0.2), 0.5));
  };

  F.title("The Great Awakening");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.9);
  return (t) => { drawMap(t); draw1(t); draw2(t); draw3(t); drawS(t); draw4(t); draw5(t); draw6(t); drawF(t); draw6c(t); draw6d(t); draw7(t); draw8(t); draw8b(t); draw9(t); drawE(t); draw10(t); draw10b(t); draw10c(t); };
});
