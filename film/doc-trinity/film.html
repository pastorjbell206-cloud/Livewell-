     the three rings inside its one circle, light and breath over the waters and a promise coming down; the
     turning points, the opened sky, the descending light and the voice at the Jordan, Matthew 28:19 and one
     name; the line between the Creator and all things made, with Father, Son and Spirit on the Creator's side;
     worship before words, from Pliny's report to the creed of 325 and 381; the old errors struck through;
     three debates as equal pairs on a level beam, none chosen; the shape of prayer, a love older than creation,
     and light reaching people; the blessing of 2 Corinthians 13:14 over the churches.
     God is never drawn: only three equal rings, light, and one circle of unity.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->
<html lang="en"><head><meta charset="utf-8"><title>One God, three persons</title></head><body>

  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;

  const f1 = (v) => (+v).toFixed(1);
  const frac = (x) => x - Math.floor(x);
  // ---------- shapes ----------
  const circ = (r) => `M0 ${-r} A${r} ${r} 0 1 1 0 ${r} A${r} ${r} 0 1 1 0 ${-r}`;
  const arcD = (cx, cy, r, a1, a2) => `M${f1(cx + r * Math.cos(a1))} ${f1(cy + r * Math.sin(a1))} A${r} ${r} 0 0 1 ${f1(cx + r * Math.cos(a2))} ${f1(cy + r * Math.sin(a2))}`;

  const showRing = (g, k, lk = k) => { draw(g._st, k); op(g._fill, k); if (g._lab) op(g._lab, lk); };
  const glow = (p, r, n = 6, o = 0.07) => { const g = G(p); for (let i = n; i >= 1; i--) el("circle", { r: f1(r * i / n), fill: MUSTARD, opacity: o }, g); return g; };
  // three places evenly round a centre, the first at the top (Father, Son, Spirit)
  const tri = (cx, cy, rad) => [0, 1, 2].map((i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 3; return [cx + rad * Math.cos(a), cy + rad * Math.sin(a)]; });

    [-30, -12, 6, 24, 42].forEach((dy, i) => el("rect", { x: s > 0 ? 18 : -98, y: dy - 2, width: 80 - (i % 2) * 18, height: 4, rx: 2, fill: LINE }, bk)); });
  const pat = tri(0, 6, 34).map(([x, y]) => el("circle", { cx: f1(x), cy: f1(y), r: 6, fill: MUSTARD }, bk));
  const bkLab = T(g2, "lab", 215, 520, "A PATTERN IN SCRIPTURE", 14);
  const gp = G(g2), pie = el("circle", { r: 70, fill: "none", stroke: STONE, "stroke-width": 2, "stroke-dasharray": "6 6" }, gp);

  const g3c = G(g3), one3 = line(g3c, circ(96), { "stroke-width": 2.6 }), rings3 = tri(0, 4, 44).map(([x, y]) => { const r = ring(g3c, 25); move(r, x, y); return r; });

    el("circle", { r: 22, fill: PAPER, stroke: INK, "stroke-width": 2.2 }, g); tri(0, 1, 10).forEach(([dx, dy]) => el("circle", { cx: f1(dx), cy: f1(dy), r: 4, fill: INK }, g)); return { x, g, lab: T(g4, "lab", x, 380, s, 13) }; });

  const made = [...Array(110)].map(() => { const x = 345 + R() * 785, y = 462 + R() * 78; return { d: R(), e: el("circle", { cx: f1(x), cy: f1(y), r: f1(1.8 + R() * 2.6), fill: R() < 0.5 ? STONE : LINE }, g5) }; });
