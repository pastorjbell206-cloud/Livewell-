<!-- "Turning around" (doctrine film: repentance). One walker carries the film: the weight it would rather

     house that keeps its crack; Isaiah's scroll; the road home, the son with his speech and the father who
     runs (Luke 15:20); Judas and Peter side by side; the year 250, the open gate and the closed one, the ring
     of the church and the wall that is not a stumble; six equal panels for the views on faith and on
     confession; the gauge that never has to fill, Zacchaeus paying back, the claim handed up, the slow bridge
     and the safe ring; the open door of 1 John 1:9.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
