<!-- "Worship" (doctrine film: worship). One continuous picture in ten scenes: the singing, a quiet prayer and a
     feeling, and the question of who says how; a light above a gathered people, every line running up to it and
     then across to the neighbor; figures who bow down, then serve under a pyramid, then walk to the mountain;
     the mountain of the sign, and the golden calf at its foot; the Psalms as an open book, the scale of the
     prophets, Micah's road; people bowed on both sides of a light, the two mountains of the Samaritan woman,
     John 4:23, and the light that takes the mountains' place; the first table, Pliny's dawn and Justin's Sunday
     on a timeline; four equal panels for the regulative, normative, liturgical and free-church views, joined by
     one line; the cross, the week, four rooms of service and a worshiper warmed by what they face; and Romans
     12:1 over a living offering, then the city with a throne and no temple, filling from every side.
     Christ and God are never drawn: a light, a cross and a throne stand for them.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
<html lang="en"><head><meta charset="utf-8"><title>Worship</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));
  const CS = (id) => CH[id].start;
  const A = (id, k, f) => S(id, k) + (E(id, k) - S(id, k)) * f;          // a moment f of the way through line k
  const T = (p, cls, x, y, s, size, anchor, fill) => { const e = txt(p, cls, x, y, s, size, fill ? { fill } : undefined); if (anchor) e.setAttribute("style", (e.getAttribute("style") || "") + `text-anchor:${anchor};`); return e; };
  const G = (p) => el("g", {}, p || world);
  const R = rng(41);
  const f1 = (v) => v.toFixed(1);
  const dr = (e, k) => { draw(e, k); op(e, k > 0.002 ? 1 : 0); };   // draw a line, hidden until it starts
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const cmix = (a, b, k) => { const P = hex(a), Q = hex(b); return "#" + P.map((v, i) => Math.round(mix(v, Q[i], clamp(k))).toString(16).padStart(2, "0")).join(""); };
  const ring = (r) => `M0 ${-r} A${r} ${r} 0 1 1 -0.01 ${-r}`;

  // a person: legs, a body that can bow, a head. No face.
  const person = (parent) => { const g = G(parent); const body = el("path", { fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round" }, g); const head = el("circle", { r: 6.5, fill: INK }, g); return { g, body, head }; };
  const pose = (p, x, y, b = 0, dir = 1, s = 1, stride = 0) => {
    const a = clamp(b) * 1.3, L = 19 * s, hy = y - L, tx = x + Math.sin(a) * L * dir, ty = hy - Math.cos(a) * L, sp = 6 * s, st = stride * 5 * s;
    p.body.setAttribute("d", `M${f1(x - sp + st)} ${f1(y)} L${f1(x)} ${f1(hy)} L${f1(x + sp - st)} ${f1(y)} M${f1(x)} ${f1(hy)} L${f1(tx)} ${f1(ty)}`);

  };

    return { g, rays }; };

  // a mountain, filled and edged
  const mD = (w, h) => `M${-w / 2} 0 L${-w * 0.1} ${-h} L${w * 0.03} ${-h * 0.8} L${w * 0.15} ${-h * 0.93} L${w / 2} 0`;
  const mountain = (parent, w, h) => { const g = G(parent); const fill = el("path", { d: mD(w, h) + " Z", fill: WARM }, g); const edge = line(g, mD(w, h), { "stroke-width": 3 }); return { g, fill, edge, px: -w * 0.1, py: -h }; };
  // an open book, and a closed one

  const book = (parent) => { const g = G(parent); [1, -1].forEach((s) => el("path", { d: pageD(s), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, g));
    const ls = []; [1, -1].forEach((s) => [-28, -10, 8, 26].forEach((dy) => ls.push(line(g, `M${-22 * s} ${dy - 8} C${-60 * s} ${dy - 20} ${-100 * s} ${dy - 20} ${-132 * s} ${dy - 10}`, { stroke: STONE, "stroke-width": 2.2 })))); g._ls = ls; return g; };
  const tome = (parent, x, y) => { const g = G(parent); el("rect", { x: x - 24, y: y - 32, width: 48, height: 64, rx: 3, fill: PAPER, stroke: INK, "stroke-width": 2.4 }, g); el("line", { x1: x - 15, x2: x - 15, y1: y - 32, y2: y + 32, stroke: INK, "stroke-width": 2 }, g);
    el("line", { x1: x - 6, x2: x + 14, y1: y - 12, y2: y - 12, stroke: STONE, "stroke-width": 2 }, g); el("line", { x1: x - 6, x2: x + 10, y1: y - 2, y2: y - 2, stroke: STONE, "stroke-width": 2 }, g); return g; };

  const notes = [[262, 366], [300, 350], [338, 334], [376, 342], [412, 326]].map(([x, y]) => { const g = G(m1); el("ellipse", { cx: 0, cy: 0, rx: 8, ry: 6, fill: INK, transform: "rotate(-20)" }, g); el("line", { x1: 7, y1: -2, x2: 7, y2: -34, stroke: INK, "stroke-width": 2.4 }, g); return { g, x, y }; });
  const lab1a = T(m1, "lab", 330, 440, "THE SINGING", 15);
  const bowl = el("path", { d: "M596 372 Q640 418 684 372 Z", fill: PAPER, stroke: INK, "stroke-width": 2.6, "stroke-linejoin": "round" }, m1);
  const wisp = line(m1, "M640 366 C622 344 658 328 640 306 C622 284 658 268 640 246", { stroke: STONE, "stroke-width": 2.4 });
  const lab1b = T(m1, "lab", 640, 440, "A QUIET PRAYER", 15);
  const heart = el("circle", { cx: 950, cy: 340, r: 9, fill: INK }, m1);
  const waves = [0, 1, 2].map(() => el("circle", { cx: 950, cy: 340, fill: "none", stroke: STONE, "stroke-width": 2 }, m1));
  const lab1c = T(m1, "lab", 950, 440, "A FEELING", 15);
  const qMark = T(g1, "disp", 640, 552, "?", 92, null, MUSTARD);
  const qRingG = G(), qRing = line(qRingG, ring(48), { stroke: MUSTARD, "stroke-width": 3 });   // rises into the next scene as its light
  const draw1 = (t) => {
    const v = span(t, Q0 - 0.5, CS("confess") + 1.0, 0.6, 0.8); op(g1, v);
    if (v > 0) {
      op(whatIs, up(t, Q0, 0.8) * (1 - 0.55 * up(t, Q1, 0.6))); whatIs.setAttribute("y", f1(190 - 8 * up(t, Q0, 2.4)));
      const a1 = A("question", 0, 0.3), a2 = A("question", 0, 0.58), a3 = A("question", 0, 0.8);
      staff.forEach((l, i) => dr(l, up(t, a1 - 0.7 + i * 0.12, 0.7)));
      notes.forEach((n, i) => { const k = up(t, a1 + i * 0.22, 0.5); op(n.g, k); move(n.g, n.x, n.y - 3 * Math.sin(t * 2 + i) - 8 * (1 - k)); });
      op(lab1a, up(t, a1 + 0.3, 0.6));
      op(bowl, up(t, a2 - 0.4, 0.6)); dr(wisp, up(t, a2 - 0.1, 1.8)); wisp.setAttribute("transform", `translate(${f1(3 * Math.sin(t * 1.3))} 0)`); op(lab1b, up(t, a2 + 0.3, 0.6));
      op(heart, up(t, a3 - 0.3, 0.5)); waves.forEach((w, i) => { const ph = (((t - a3) * 0.5 + i / 3) % 1 + 1) % 1; set(w, { r: f1(12 + ph * 60) }); op(w, (1 - ph) * 0.8 * up(t, a3, 0.6)); }); op(lab1c, up(t, a3 + 0.3, 0.6));
      const sh = up(t, Q1 - 0.2, 1.0); m1.setAttribute("transform", `translate(0 ${f1(-34 * sh)})`); m1.setAttribute("opacity", (Math.max(0, (1 - 0.45 * sh) * (1 - up(t, CS("confess") - 0.7, 0.5)))).toFixed(3));
      op(qMark, up(t, Q1 + 0.6, 0.8) * (1 - up(t, CS("confess") - 0.5, 0.5)));
    }
    const lift = up(t, CS("confess") - 0.3, 1.4);
    move(qRingG, 640, mix(522, 200, lift), mix(1, 0.62, lift)); dr(qRing, up(t, Q1 + 0.9, 1.0)); op(qRingG, 1 - up(t, CS("confess") + 1.1, 0.6));
  };

  // ================= 2. what Christians confess: the light, the people, the lines up and the lines across =================
  const C0 = S("confess", 0), C1 = S("confess", 1);
  const g2 = G(), L2 = light(g2, 30);
  const crowdPos = []; [[13, 462], [12, 508]].forEach(([n, y], row) => { for (let i = 0; i < n; i++) crowdPos.push({ x: 640 + (i - (n - 1) / 2) * 54, y, row, i, d: Math.abs(i - (n - 1) / 2) }); });
  const fans = crowdPos.map((c) => line(g2, `M${f1(c.x)} ${c.y - 12} L${f1(640 + (c.x - 640) * 0.1)} 276`, { stroke: LINE, "stroke-width": 1.6 }));
  const links = [];
  crowdPos.forEach((c, j) => { const nb = crowdPos.find((o) => o.row === c.row && o.i === c.i + 1); if (nb) links.push({ d: c.d, e: line(g2, `M${f1(c.x + 10)} ${c.y} L${f1(nb.x - 10)} ${nb.y}`, { stroke: STONE, "stroke-width": 2 }) });
    if (c.row === 0) [crowdPos.find((o) => o.row === 1 && o.i === c.i), crowdPos.find((o) => o.row === 1 && o.i === c.i - 1)].forEach((o) => { if (o) links.push({ d: c.d + 0.5, e: line(g2, `M${f1(c.x + (o.x > c.x ? 6 : -6))} ${c.y + 7} L${f1(o.x + (o.x > c.x ? -6 : 6))} ${o.y - 7}`, { stroke: STONE, "stroke-width": 2 }) }); }); });
  const crowd = crowdPos.map((c) => ({ ...c, e: el("circle", { r: 7, fill: INK }, g2) }));
  const who = T(g2, "lab", 400, 207, "WHO GOD IS", 15), done = T(g2, "lab", 880, 207, "WHAT HE HAS DONE", 15);
  const alone = T(g2, "lab", 290, 350, "THE TRUE GOD ALONE", 15);
  const whole = T(g2, "lab", 640, 566, "THE WHOLE RESPONSE OF GOD'S PEOPLE", 15), neigh = T(g2, "lab", 640, 566, "AND HOW WE TREAT OUR NEIGHBOR", 15);
  const draw2 = (t) => {
    const v = span(t, CS("confess") + 0.5, CS("words") + 1.3, 0.6, 0.9); op(g2, v); if (v <= 0) return;
    shine(L2, 640, 200 + 3 * Math.sin(t * 0.7), 1, up(t, CS("confess") + 0.9, 0.8), up(t, C0 - 0.2, 1.6), t);
    crowd.forEach((c) => { op(c.e, up(t, C0 + 0.2 + c.d * 0.12 + c.row * 0.3, 0.6)); set(c.e, { cx: f1(c.x), cy: f1(c.y + 2 * Math.sin(t * 0.9 + c.x * 0.02)) }); });
    const col = cmix(LINE, STONE, up(t, C1 + 0.2, 1.2));
    fans.forEach((f, j) => { const c = crowdPos[j]; dr(f, up(t, A("confess", 0, 0.3) + c.d * 0.1 + c.row * 0.2, 1.2)); f.setAttribute("stroke", col); });
    links.forEach((l) => dr(l.e, up(t, A("confess", 1, 0.5) + l.d * 0.08, 0.8)));
    op(who, up(t, A("confess", 0, 0.62), 0.6)); op(done, up(t, A("confess", 0, 0.8), 0.6)); op(alone, up(t, C1 + 0.3, 0.6));
    op(whole, up(t, A("confess", 0, 0.45), 0.6) * (1 - up(t, A("confess", 1, 0.36), 0.4))); op(neigh, up(t, A("confess", 1, 0.5), 0.6));
  };

  // ================= 3 and 4. bowing and serving; the mountain of the sign and the calf at its foot =================
  const W0 = S("words", 0), W1 = S("words", 1), W2 = S("words", 2), X0 = S("exodus", 0), X1 = S("exodus", 1), X2 = S("exodus", 2);
  const g3 = G(), L3 = light(g3, 22);
  const bowW = T(g3, "ital", 640, 322, "to bow down", 46), hish = T(g3, "lab", 640, 524, "HISHTACHAVAH", 15);
  const avad = T(g3, "lab", 640, 168, "AVAD", 15), serveW = T(g3, "ital", 640, 222, "to serve", 46);
  const pyr = line(g3, "M190 446 L330 250 L470 446 Z", { "stroke-width": 3 }), pyrFill = el("path", { d: "M190 446 L330 250 L470 446 Z", fill: WARM }, g3);
  g3.insertBefore(pyrFill, pyr);
  const bricks = [0, 1, 2, 3].map((i) => line(g3, `M${238 + i * 10} ${412 - i * 34} H${422 - i * 10}`, { stroke: LINE, "stroke-width": 2 }));
  const labPh = T(g3, "lab", 330, 530, "SERVICE TO PHARAOH", 15), labLd = T(g3, "lab", 950, 530, "SERVICE TO THE LORD", 15);
  const arc1 = line(g3, "M596 240 C520 250 470 262 430 292", { stroke: STONE, "stroke-width": 1.8 }), arc2 = line(g3, "M684 240 C760 250 810 262 858 300", { stroke: STONE, "stroke-width": 1.8 });
  const road3 = line(g3, "M470 486 C600 500 700 500 800 486", { stroke: STONE, "stroke-width": 2, "stroke-dasharray": "0.012 0.012" });
  const gM = G(), mtn = mountain(gM, 520, 300);
  const g4 = G(), L4 = light(g4, 15, 10);
  const sign1 = T(g4, "lab", 1050, 300, "THE SIGN", 15), sign2 = T(g4, "lab", 1050, 326, "WORSHIP ON THIS MOUNTAIN", 15);
  const calf = G(g4);
  el("rect", { x: -40, y: 0, width: 80, height: 30, rx: 2, fill: WARM, stroke: INK, "stroke-width": 2.2 }, calf);
  const calfBody = G(calf);
  [[-20, -16, -22, 0], [-8, -14, -8, 0], [10, -14, 10, 0], [22, -16, 24, 0]].forEach(([a, b, c, d]) => el("line", { x1: a, y1: b, x2: c, y2: d, stroke: INK, "stroke-width": 2.6, "stroke-linecap": "round" }, calfBody));
  const calfParts = [el("ellipse", { cx: 0, cy: -26, rx: 30, ry: 14, stroke: INK, "stroke-width": 2 }, calfBody), el("path", { d: "M22 -32 L32 -46 L40 -38 Z", stroke: INK, "stroke-width": 2, "stroke-linejoin": "round" }, calfBody), el("circle", { cx: 38, cy: -46, r: 9, stroke: INK, "stroke-width": 2 }, calfBody)];
  el("path", { d: "M33 -53 Q29 -64 36 -63 M43 -53 Q47 -64 52 -58 M-30 -28 Q-40 -26 -38 -12", fill: "none", stroke: INK, "stroke-width": 2, "stroke-linecap": "round" }, calfBody);
  const calfRing = el("ellipse", { cx: 300, cy: 474, rx: 100, ry: 90, fill: "none", stroke: STONE, "stroke-width": 2, "stroke-dasharray": "7 8" }, g4);
  const labCalf = T(g4, "lab", 300, 360, "THE GOLDEN CALF", 15), labForbid = T(g4, "lab", 300, 330, "IN A FORM HE FORBADE", 15);
  const gP = G(), folk = [...Array(7)].map(() => person(gP));
  const draw34 = (t) => {
    // scene 3
    const v3 = span(t, CS("words") + 0.3, CS("exodus") + 1.0, 0.6, 0.8); op(g3, v3);
    if (v3 > 0) {
      shine(L3, 640, 200 + 3 * Math.sin(t * 0.7), 1, span(t, CS("words") + 0.4, W1 + 0.6, 0.6, 0.8), 1, t);
      op(bowW, span(t, A("words", 0, 0.5), W1 + 0.4, 0.7, 0.6)); op(hish, span(t, A("words", 0, 0.62), W1 + 0.6, 0.6, 0.6));
      op(avad, up(t, W1 + 0.4, 0.6) * (1 - up(t, X0 + 0.2, 0.6))); op(serveW, up(t, W1 + 0.1, 0.8) * (1 - up(t, X0 + 0.2, 0.6)));

      bricks.forEach((b, i) => { dr(b, up(t, W1 + 0.8 + i * 0.3, 0.6)); b.setAttribute("opacity", f1(1 - up(t, X0 + 0.2, 0.8))); });

    }

    if (vm > 0) { const g = up(t, X0 - 0.1, 1.9); move(mtn.g, mix(950, 640, g), mix(474, 480, g) + 2 * Math.sin(t * 0.6) * 0, mix(0.577, 1, g)); dr(mtn.edge, up(t, W2 - 0.2, 1.4)); op(mtn.fill, up(t, W2 + 0.5, 0.8)); }
    // scene 4
    const v4 = span(t, X0 - 0.2, CS("prophets") + 1.0, 0.6, 0.9); op(g4, v4);
    if (v4 > 0) {
      const sk = up(t, A("exodus", 0, 0.58), 1.2); shine(L4, 588, 158 + 2 * Math.sin(t), 1, sk, up(t, A("exodus", 0, 0.62), 1.2), t);
      op(sign1, span(t, A("exodus", 0, 0.62), X2 + 0.2, 0.6, 0.6)); op(sign2, span(t, A("exodus", 0, 0.7), X2 + 0.2, 0.6, 0.6));
      const ck = up(t, X1 + 0.2, 1.0); op(calf, ck); move(calf, 300, 505 + 6 * (1 - ck), 1.4);
      const dim = up(t, A("exodus", 2, 0.25), 1.6); const fill = cmix(MUSTARD, MUTED, dim); calfParts.forEach((p) => p.setAttribute("fill", fill));
      op(calfRing, up(t, A("exodus", 2, 0.35), 0.8)); calfRing.setAttribute("stroke-dashoffset", f1(t * 4));
      op(labCalf, up(t, A("exodus", 1, 0.3), 0.6)); op(labForbid, up(t, A("exodus", 2, 0.45), 0.6));
    }
    // the people: a row that bows, a crew that serves, a walk to the mountain, the foot of the mountain, the calf
    const vp = span(t, CS("words") + 0.4, CS("prophets") + 0.9, 0.6, 0.8); op(gP, vp);
    if (vp > 0) {
      const kb = up(t, W1 - 0.1, 1.4), kc = up(t, A("words", 2, 0.1), 2.6), kd = up(t, X0 + 0.1, 1.9);
      const walk = span(t, A("words", 2, 0.1), A("words", 2, 0.1) + 2.6, 0.3) + span(t, X0 + 0.1, X0 + 2.0, 0.3);
      let b = up(t, A("words", 0, 0.55), 1.2);
      b = mix(b, 0.45, kb); b = mix(b, 0, up(t, A("words", 2, 0.02), 0.6)); b = mix(b, 0.5, up(t, E("words", 2) - 0.6, 1.0)); b = mix(b, 0, up(t, X0, 0.8));
      b = mix(b, 0.85, up(t, A("exodus", 0, 0.78), 1.2)); b = mix(b, 0, up(t, X1, 0.8)); b = mix(b, 0.75, up(t, A("exodus", 1, 0.6), 1.0));
      const dir = t > X1 + 0.6 ? -1 : 1;
      folk.forEach((p, i) => {
        const x = mix(mix(mix(640 + (i - 3) * 92, 238 + i * 31, kb), 812 + i * 30, kc), 508 + i * 44, kd);
