  const X3 = [0, 1, 2].map((k) => S("exodus", k));
  const g3 = G();
  const tabs = G(g3), tabA = tablet(tabs), tabB = tablet(tabs); move(tabA, -64, 0); move(tabB, 64, 0);

  };

  // ================= 9. what it changes: power and goodness held as one; grief, guilt, confusion =================
  const L9 = [0, 1, 2].map((k) => S("life", k));
  const g9 = G();
  const side = [{ x: 380, big: "POWERFUL", small: "NOT QUITE GOOD", word: "fear", at: -0.08 }, { x: 900, big: "GOOD", small: "NOT QUITE ABLE", word: "without hope", at: 0.5 }].map((s) => {
    const g = G(g9); const ring = el("circle", { r: 78, fill: WARM, stroke: INK, "stroke-width": 2.5 }, g); const lab = T(g, "lab", 0, 6, s.big, 15, null, INK);
    const dash = el("circle", { cx: 104, cy: 52, r: 28, fill: "none", stroke: STONE, "stroke-width": 2, "stroke-dasharray": "5 5" }, g);
    return { ...s, g, ring, lab, dash, sl: T(g9, "lab", s.x, 458, s.small, 14), w: T(g9, "ital", s.x, 518, s.word, 42) }; });
  const oneRing = G(g9), oneOuter = el("circle", { r: 104, fill: "none", stroke: MUSTARD, "stroke-width": 3 }, oneRing); el("circle", { r: 90, fill: WARM, stroke: INK, "stroke-width": 2.5 }, oneRing);
  T(oneRing, "lab", 0, -4, "POWER", 15, null, INK); T(oneRing, "lab", 0, 22, "GOODNESS", 15, null, INK);
  const ROWS = [["grief", "FAITHFULNESS", "KEEP SPEAKING TO HIM", 0], ["guilt", "MERCY", "RETURN", 0.37], ["confusion", "WISDOM", "WAIT", 0.66]];
  const rowG = ROWS.map(([w, a, b, f], i) => { const g = G(g9), y = 220 + i * 120; T(g, "ital", 500, y + 12, w, 44, "end"); const ar = line(g, `M530 ${y} H640 M628 ${y - 9} L642 ${y} L628 ${y + 9}`, { stroke: STONE, "stroke-width": 2.5 }); T(g, "lab", 672, y - 2, a, 15, "start", INK); T(g, "lab", 672, y + 22, b, 13, "start"); return { g, ar, f }; });
  const draw9 = (t) => {
    const v = span(t, CS("life") - 0.1, CS("close") + 0.5, 0.8, 0.7); op(g9, v); if (v <= 0) return;
    const merge = up(t, L9[1] + 0.2, 1.6), out = up(t, L9[2] - 0.7, 0.6);
    side.forEach((s, i) => { const k = up(t, AT("life", 0, s.at) - 0.1, 0.9); move(s.g, mix(s.x, 640, merge), 300 + 2 * Math.sin(t + i)); op(s.g, k * (1 - merge)); op(s.dash, 1); set(s.dash, { r: (28 + 2 * Math.sin(t * 1.6 + i)).toFixed(1) });
      op(s.sl, up(t, AT("life", 0, s.at + 0.15), 0.6) * (1 - merge)); op(s.w, up(t, AT("life", 0, s.at + 0.38), 0.7) * (1 - merge)); });
    move(oneRing, 640, 300 + 2 * Math.sin(t), mix(0.8, 1, merge)); op(oneRing, up(t, L9[1] + 1.2, 0.8) * (1 - out)); set(oneOuter, { r: (104 + 4 * Math.sin(t * 1.5)).toFixed(1) });
    rowG.forEach((r) => { const k = up(t, AT("life", 2, r.f) - 0.1, 0.8); op(r.g, k); draw(r.ar, up(t, AT("life", 2, r.f) + 0.3, 0.7)); });
  };

  // ================= 10. the throne of Revelation 4, and the line of time running on =================
  const Z = [0, 1, 2].map((k) => S("close", k)), END = F.VOICE_END;
  const g10 = G();
  const thr10 = G(g10), thrGlow10 = glow(thr10, 200, 7, MUSTARD, 0.045), thrS10 = throne(thr10);
  const four = [0, 1, 2, 3].map(() => el("circle", { r: 14, fill: "none", stroke: INK, "stroke-width": 2.5 }, g10));
  const fourLab = T(g10, "lab", 640, 560, "REVELATION 4 · THE FOUR LIVING CREATURES", 14);
  const ZV = [T(g10, "disp", 640, 164, "Holy, Holy, Holy, is the Lord God Almighty,", 40), T(g10, "disp", 640, 214, "who was and is and is to come!", 40)];
  const zRef = T(g10, "lab", 640, 252, "REVELATION 4:8 · BEREAN STANDARD BIBLE", 13);
  const tl10 = line(g10, "M200 540 H1080", { stroke: INK, "stroke-width": 2.5 }), tlOn = line(g10, "M1080 540 H1220", { stroke: MUSTARD, "stroke-width": 3.5 });
  const tk10 = [["WAS", 400], ["IS", 640], ["IS TO COME", 880]].map(([s, x]) => { const g = G(g10); el("line", { x1: x, x2: x, y1: 532, y2: 548, stroke: INK, "stroke-width": 2.5 }, g); T(g, "lab", x, 574, s, 13); return g; });
  const draw10 = (t) => {
    const v = span(t, CS("close") - 0.1, END + 2.5, 0.8, 0.9); op(g10, v); if (v <= 0) return;
    const kt = up(t, CS("close") + 0.1, 1.2); move(thr10, 640, mix(440, 420, kt) + 2 * Math.sin(t * 0.8)); op(thr10, kt); move(thrGlow10, 0, -40, 0.85 + 0.06 * Math.sin(t * 1.2) + 0.3 * up(t, Z[2], 2.0));
    const slow = mix(0.45, 0.18, up(t, Z[2], 2));
    four.forEach((c, i) => { const a = i * Math.PI / 2 + Math.PI / 4 + (t - CS("close")) * slow; set(c, { cx: (640 + 230 * Math.cos(a)).toFixed(1), cy: (400 + 72 * Math.sin(a)).toFixed(1) }); op(c, up(t, AT("close", 0, 0.35) + i * 0.25, 0.6)); });
    op(fourLab, span(t, AT("close", 0, 0.35), Z[1] + 1.2, 0.6));
    ZV.forEach((l, i) => op(l, up(t, AT("close", 1, i ? 0.55 : 0), 0.8))); op(zRef, up(t, AT("close", 1, 0.3), 0.6));
    draw(tl10, up(t, AT("close", 1, 0.62), 1.6)); op(tl10, up(t, AT("close", 1, 0.6), 0.3)); tk10.forEach((g, i) => op(g, up(t, AT("close", 1, [0.68, 0.8, 0.9][i]), 0.5)));
    draw(tlOn, up(t, Z[2] + 0.6, 2.4)); op(tlOn, up(t, Z[2] + 0.5, 0.3));
  };

  F.title("Holy, loving, just");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.9);
  return (t) => { draw1(t); draw2(t); draw3(t); draw4(t); draw5(t); draw6(t); draw7(t); draw8(t); draw9(t); draw10(t); };
});
