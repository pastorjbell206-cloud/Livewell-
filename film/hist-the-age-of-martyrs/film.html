<!-- "The age of the martyrs" (church history film, lesson /theology/history/the-age-of-martyrs). Ten scenes:
     the movie version (a comb sweeping the provinces) and the one word; local and occasional trouble on a
     timeline from 64 to 313, Pliny's letter and Trajan's answer, the balance of legal and illegal; the altar,
     the pinch of incense, the open door, the gods with room for one more, the cross; the map of Lyons, Rome
     and Carthage beside a list of names with candles; Perpetua's prison window, her diary and the water jug;
     the storms on the timeline (Decius's certificates, Cyprian, Diocletian, Galerius, Constantine); the
     lapsed, Novatian's barred door and Cyprian's stair; the twelve who scattered (Mark 14:50) and the meal on
     the beach (John 21:13); seeds and sprouts, the plague cities, the abandoned, slave beside senator, the
     stage refused; the catacombs and the courtroom, the list again, one word, one candle.
     Deaths are named, never pictured: a lit candle beside a name is the only sign.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
<html lang="en"><head><meta charset="utf-8"><title>The age of the martyrs</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, soft, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5", LEAF = "#7A8B5A";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));

  // ---------- shared shapes ----------

  const FLAME = "M0 0 C-6 -3 -7 -11 0 -21 C7 -11 6 -3 0 0 Z";
  const candle = (p, h = 40, w = 14) => {
    const g = G(p);
    el("rect", { x: -w / 2, y: -h, width: w, height: h, rx: 2, fill: PAPER, stroke: INK, "stroke-width": 2 }, g);
    el("line", { x1: 0, y1: -h, x2: 0, y2: -h - 6, stroke: INK, "stroke-width": 1.8, "stroke-linecap": "round" }, g);
    const glow = el("circle", { cx: 0, cy: -h - 15, r: 19, fill: MUSTARD }, g), fl = G(g); el("path", { d: FLAME, fill: MUSTARD }, fl);
    g._lit = (k, t) => { op(glow, 0.15 * k); op(fl, k); if (k > 0) fl.setAttribute("transform", `translate(0 ${-h - 4}) scale(${(k * (1 + 0.05 * Math.sin(t * 2.7 + h))).toFixed(3)} ${(k * (1 + 0.08 * Math.sin(t * 2.1 + w))).toFixed(3)})`); };
    g._lit(0, 0); return g;
  };
  // a speech bubble holding one word
  const BUB = "M-78 -30 H78 Q92 -30 92 -16 V16 Q92 30 78 30 H-12 L-32 52 L-30 30 H-78 Q-92 30 -92 16 V-16 Q-92 -30 -78 -30 Z";
  const bubble = (p, dashed) => { const g = G(p);
    el("path", { d: BUB, fill: PAPER, stroke: dashed ? STONE : INK, "stroke-width": 2.4, "stroke-linejoin": "round", ...(dashed ? { "stroke-dasharray": "7 6" } : {}) }, g);

    el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, fill: PAPER, stroke: INK, "stroke-width": sw }, g);
    for (let i = 0; i < rows; i++) { const y = -h / 2 + h * 0.22 + i * (h * 0.56 / Math.max(1, rows - 1)); let x = -w / 2 + w * 0.16; const end = w / 2 - w * 0.16 - (i === rows - 1 ? w * 0.25 : 0);
      while (x < end - 3) { const bw = Math.min(end - x, 3 + r() * w * 0.24); el("rect", { x, y: y - bh / 2, width: bw, height: bh, rx: bh / 2, fill: INK }, g); x += bw + Math.max(2.5, w * 0.05); } }

  const closedBook = (p, w = 70, h = 92) => { const g = G(p); el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, fill: PAPER, stroke: INK, "stroke-width": 2.2 }, g); el("rect", { x: -w / 2, y: -h / 2, width: 10, height: h, fill: INK }, g); return g; };
  // a small church: drawn and undrawn stroke by stroke
  const church = (p, attrs) => { const g = G(p); g._ls = ["M-58 0 V-74 L0 -118 L58 -74 V0 Z", "M0 -118 V-148", "M-11 -137 H11", "M-14 0 V-34 H14 V0"].map((d) => line(g, d, { "stroke-width": 3, ...(attrs || {}) })); return g; };
  const drawChurch = (g, k) => { draw(g._ls[0], clamp(k * 1.3)); draw(g._ls[1], clamp(k * 2 - 0.9)); draw(g._ls[2], clamp(k * 2.5 - 1.5)); draw(g._ls[3], clamp(k * 1.6 - 0.5)); };
  const churchGhost = (p) => { const g = G(p); ["M-58 0 V-74 L0 -118 L58 -74 V0 Z", "M0 -118 V-148 M-11 -137 H11"].forEach((d) => el("path", { d, fill: "none", stroke: STONE, "stroke-width": 2, "stroke-dasharray": "6 6" }, g)); return g; };

    el("rect", { x: -52, y: -120, width: 104, height: 120, fill: PAPER, stroke, "stroke-width": 2.6 }, g);

  // ================= 1. the question: the movie version, then one word =================
  const q0 = at("question", 0), q1 = at("question", 1);
  const gF = G(), cities = [];
  for (let r = 0; r < 5; r++) for (let c = 0; c < 12; c++) { const x = 210 + c * 78 + (R() - 0.5) * 32, y = 184 + r * 64 + (R() - 0.5) * 28; cities.push({ x, y, d: R(), e: el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 4, fill: STONE }, gF) }); }
  const rings = [7, 15, 22, 30, 41, 46, 53, 3, 35].map((i) => ({ c: cities[i], e: el("circle", { r: 6, fill: "none", stroke: MUSTARD, "stroke-width": 2.4 }, gF) }));
  const localLab = T(gF, "lab", 640, 132, "LOCAL · OCCASIONAL · MOBS AND GOVERNORS", 15);
  const g1 = G(), comb = G(g1); el("line", { x1: 0, y1: 152, x2: 0, y2: 476, stroke: INK, "stroke-width": 2.4 }, comb);
  for (let i = 0; i < 8; i++) el("rect", { x: -6, y: 170 + i * 40, width: 12, height: 12, rx: 2, fill: INK }, comb);

  const draw1 = (t) => {
    const vF = vis(t, q0 - 0.8, at("rome", 1, 0.2)); op(gF, vF);
    const ca = at("question", 0, 0.12), cd = Math.max(2.5, E("question", 0) - ca + 0.6), cx = mix(140, 1140, soft((t - ca) / cd)), con = up(t, ca - 0.4, 0.6) * (1 - up(t, q1 + 0.1, 0.8));
    if (vF > 0) {
      const dim = 1 - 0.7 * span(t, at("question", 1, 0.35), CS("rome") + 0.5, 0.8, 0.8);
      const RA = at("rome", 0, 0.12), RD = (at("rome", 1, 0) - RA) / rings.length;
      const hot = new Set();
      rings.forEach((r, i) => { const k = clamp((t - RA - i * RD) / 1.9), on = k > 0 && k < 1; set(r.e, { cx: r.c.x.toFixed(1), cy: r.c.y.toFixed(1), r: (6 + 24 * ease(k)).toFixed(1) }); op(r.e, on ? (1 - k) * 0.9 : 0); if (on && k < 0.75) hot.add(r.c); });
      cities.forEach((c) => { const k = up(t, q0 - 0.6 + c.d * 1.2 + (c.x - 200) / 1100, 0.6), near = clamp(1 - Math.abs(c.x - cx) / 46) * con;

  // ================= 2. what Rome wanted: the timeline, Pliny and Trajan, the balance =================
  const TLY = 530, YX = (y) => 170 + (y - 64) * (940 / 249);
  const gTL = G(), gB = G(gTL), axis = line(gTL, `M${YX(64)} ${TLY} H${YX(313)}`, { "stroke-width": 3 });

  const g2 = G();
  const pliny = el("circle", { cx: 330, cy: 300, r: 12, fill: INK }, g2), plinyLab = T(g2, "lab", 330, 262, "PLINY · GOVERNOR", 14);
  const throne = G(g2); ["M-30 0 V-22 H30 V0", "M-24 -22 V-84 H24 V-22"].forEach((d) => el("path", { d, fill: "none", stroke: INK, "stroke-width": 2.6, "stroke-linejoin": "round" }, throne)); move(throne, 950, 330);
  const trajan = el("circle", { cx: 950, cy: 296, r: 12, fill: INK }, g2), trajanLab = T(g2, "lab", 950, 226, "TRAJAN · EMPEROR", 14);
  const letter = page(g2, 34, 44, 4, 112, 1.8), reply = page(g2, 34, 44, 4, 113, 1.8);
  const rules = ["DO NOT SEEK THEM OUT", "IGNORE ANONYMOUS ACCUSATIONS", "IF ACCUSED AND WILL NOT RECANT, PUNISH"].map((s, i) => T(g2, "lab", 640, 412 + i * 30, s, 14));
  const g2b = G();
  el("line", { x1: 640, y1: 222, x2: 640, y2: 470, stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, g2b);
  el("line", { x1: 580, y1: 470, x2: 700, y2: 470, stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, g2b);
  const beam = el("line", { stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, g2b);
  el("circle", { cx: 640, cy: 222, r: 7, fill: INK }, g2b);
  const pans = [0, 1].map(() => { const g = G(g2b); [-50, 50].forEach((x) => el("line", { x1: x, y1: 96, x2: 0, y2: 0, stroke: STONE, "stroke-width": 1.6 }, g)); el("path", { d: "M-62 96 Q0 124 62 96 Z", fill: WARM, stroke: INK, "stroke-width": 2.4 }, g); return g; });
  const sprout = G(pans[0]), stem = line(sprout, "M0 100 C-2 82 2 68 0 52", { stroke: LEAF, "stroke-width": 3 });

  const c2 = candle(pans[1], 36, 14); move(c2, 0, 102);
  const legalLab = T(g2b, "lab", 440, 392, "LEGAL ENOUGH TO GROW", 14), illegalLab = T(g2b, "lab", 840, 392, "ILLEGAL ENOUGH TO DIE", 14);
  const draw2 = (t) => {
    const vT = Math.max(vis(t, CS("rome") - 0.2, CS("gesture") + 0.4), vis(t, CS("storms") - 0.3, CS("lapsed") + 0.9)); op(gTL, vT);
    if (vT > 0) {
      const st = t > CS("storms") - 1, s = (k, f = 0) => at("storms", k, f), fall = 1 - 0.7 * up(t, s(5), 1.2);
      draw(axis, st ? 1 : up(t, at("rome", 0), 1.6));
      op(tk64, st ? 1 : up(t, at("rome", 0, 0.08), 0.6)); op(tk313, st ? 1 : up(t, at("rome", 0, 0.3), 0.6));
      op(tk112, st ? 0 : up(t, at("rome", 1), 0.6)); op(tk250, st ? up(t, s(1), 0.6) : 0);
      localB.forEach((b, i) => shape(b, up(t, at("rome", 0, 0.25) + i * 0.5, 0.9)));
      shape(decB, up(t, s(1, 0.05), 1.4) * fall); shape(valB, up(t, s(2, 0.05), 1.4) * fall); shape(dioB, up(t, s(3, 0.05), 1.8) * fall);
      [[250, 1, 0.1], [258, 2, 0.1], [303, 3, 0.1], [311, 4, 0.1], [313, 4, 0.55]].forEach(([y, k, f], i) => { op(ev[y], up(t, s(k, f), 0.5)); set(ev[y], { r: (5.5 + 1.5 * Math.sin(t * 1.6 + i)).toFixed(2) }); });
    }
    const R1 = at("rome", 1), D1 = dur("rome", 1), v2 = vis(t, R1 - 0.4, at("rome", 2) + 0.3); op(g2, v2);
    if (v2 > 0) {
      op(pliny, up(t, R1 - 0.3, 0.6)); op(plinyLab, up(t, R1, 0.6)); op(throne, up(t, R1 - 0.1, 0.6)); op(trajan, up(t, R1 + 0.1, 0.6)); op(trajanLab, up(t, R1 + 0.3, 0.6));
      set(pliny, { cy: (300 + 2 * Math.sin(t)).toFixed(1) });
      const lk = up(t, R1 + D1 * 0.08, D1 * 0.3); move(letter, mix(360, 915, lk), 300 - 70 * Math.sin(Math.PI * lk), 1, 6 * Math.sin(t)); op(letter, span(t, R1 + D1 * 0.05, R1 + D1 * 0.42, 0.4, 0.4));

  // ================= 3. a pinch of incense: the altar, the word, the open door, the gods, the cross =================
  const g3 = G(), ALT = { x: 360, y: 470 };
  const altar = altarShape(g3); move(altar, ALT.x, ALT.y);

  const smokeD = (t) => { let d = ""; for (let i = 0; i <= 24; i++) { const y = -152 - i * 6.5, amp = 9 * (i / 24), x = amp * Math.sin(i / 3.2 - t * 1.4); d += (i ? " L" : "M") + (ALT.x + x).toFixed(1) + " " + (ALT.y + y).toFixed(1); } return d; };
  const incLab = T(g3, "lab", ALT.x, 505, "A PINCH OF INCENSE", 15), refLab = T(g3, "lab", ALT.x, 505, "REFUSAL", 15, null, MUSTARD);
  const bub3 = bubble(g3), bub3Lab = T(g3, "lab", 660, 348, "A WORD CALLING CAESAR LORD", 14);
  const doorG = G(g3), frame = line(doorG, "M-55 0 V-190 H55 V0", { "stroke-width": 3 }), leaf = el("path", { fill: WARM, stroke: INK, "stroke-width": 2.2, "stroke-linejoin": "round" }, doorG); move(doorG, 960, 470);
  const walker = el("circle", { r: 10, fill: INK }, g3), doorLab = T(g3, "lab", 960, 505, "THE ACCUSED WALKED FREE", 15);
  const ARCH = "M-28 0 V-52 A28 28 0 0 1 28 -52 V0";

    if (last) el("path", { d: ARCH, fill: "none", stroke: MUSTARD, "stroke-width": 2.4, "stroke-dasharray": "6 6" }, g); else g._line = line(g, ARCH, { "stroke-width": 2.4 });
    g._st = last ? G(g) : el("rect", { x: -8, y: -46, width: 16, height: 46, rx: 7, fill: MUTED, stroke: STONE, "stroke-width": 1.6 }, g);
    move(g, 520 + i * 70, 250); return g; });
  const roomLab = T(g3, "lab", 1080, 284, "ROOM FOR ONE MORE GOD", 14);
  const crossV = line(g3, "M960 470 V322", { "stroke-width": 4 }), crossH = line(g3, "M924 362 H996", { "stroke-width": 4 }), jesusLab = T(g3, "lab", 960, 505, "JESUS, AND NO ONE ELSE", 15);
  const draw3 = (t) => {
    const v = vis(t, CS("gesture") - 0.2, CS("witnesses") + 0.4); op(g3, v); if (v <= 0) return;
    const G0 = at("gesture", 0), GD = dur("gesture", 0), G1 = at("gesture", 1), GD1 = dur("gesture", 1);
    op(altar, up(t, CS("gesture"), 0.8)); move(altar, ALT.x, ALT.y);
    const pk = up(t, G0 + GD * 0.28, 0.9); set(pinch, { cx: ALT.x, cy: (ALT.y - 236 + 92 * pk * pk).toFixed(1) }); op(pinch, up(t, G0 + GD * 0.25, 0.3) * (1 - up(t, G0 + GD * 0.28 + 0.9, 0.3)));
    smoke.setAttribute("d", smokeD(t)); draw(smoke, up(t, G0 + GD * 0.36, 1.8)); op(smoke, up(t, G0 + GD * 0.36, 0.3) * (1 - up(t, G1 + GD1 * 0.5, 0.8)));
    op(incLab, up(t, G0 + GD * 0.3, 0.6) * (1 - up(t, G1 + GD1 * 0.55, 0.5))); op(refLab, up(t, G1 + GD1 * 0.62, 0.6));
    const out = 1 - up(t, G1 - 0.3, 0.6);
    const bk = up(t, G0 + GD * 0.5, 0.8); move(bub3, 660, 254 + 8 * (1 - bk) + 2 * Math.sin(t), mix(0.85, 1, bk)); op(bub3, bk * out); op(bub3Lab, up(t, G0 + GD * 0.56, 0.6) * out);
