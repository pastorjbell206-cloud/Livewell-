     running to a lit temple door, with Immanuel and Mighty God on the way; John 1:14 over an open book, then
     the tent and its glory moving to stand among the people; a human life in four pictures, Gethsemane's two
     wills, the sea made calm; the early church on a timeline (the ring that only seemed made solid, the mind
     restored, the four boundaries of 451); a level scale for the two questions where Christians differ; an
     open door, a small town, Hebrews 4:15 above a path walked together, the ring raised; light handed on, and
     the tent pitched among us.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->

  const PPL = [[-118, 4], [-88, -2], [-58, 6], [-30, 0], [30, 0], [58, 6], [88, -2], [118, 4], [-72, 26], [72, 26]];

  const draw5 = (t) => {

  const townLab = T(town, "lab", 320, 512, "A SMALL TOWN", 15), handLab = T(town, "lab", 735, 512, "WORKING WITH HIS HANDS", 13);
  const vG9 = G(g9), HL = ["For we do not have a high priest who is unable", "to sympathize with our weaknesses, but we have one", "who was tempted in every way that we are,", "yet was without sin."];
  const hLines = HL.map((s, i) => T(vG9, "disp", 640, 176 + i * 48, s, 38));
  const hRef = T(vG9, "lab", 640, 400, "HEBREWS 4:15 · BEREAN STANDARD BIBLE", 15);
  const pathD = "M150 520 C320 470 460 560 640 520 S960 470 1130 520";
  const path9 = line(g9, pathD, { stroke: LINE, "stroke-width": 3 });
  const probe = el("path", { d: pathD, fill: "none" }, g9), PL = probe.getTotalLength ? probe.getTotalLength() : 1000;
  const at = (k) => { const p = probe.getPointAtLength(clamp(k) * PL); return [p.x, p.y]; };
  const walkers = [0.0, 0.07, 0.13, 0.22, 0.28].map((o) => ({ o, e: el("circle", { r: 9, fill: INK }, g9), ring: el("circle", { r: 15, fill: "none", stroke: MUSTARD, "stroke-width": 2.4 }, g9) }));
  const wLight = el("circle", { r: 10, fill: MUSTARD }, g9), wHalo = el("circle", { r: 24, fill: MUSTARD, opacity: 0.2 }, g9);

    draw(frame9, up(t, CS("life") + 0.1, 1.2)); op(frame9, dv); draw(floor9, up(t, CS("life") + 0.3, 1.0)); op(floor9, dv);

    doorPanel.setAttribute("d", `M573 253 L${(573 + dw).toFixed(1)} ${(253 + 14 * open).toFixed(1)} L${(573 + dw).toFixed(1)} ${(470 - 8 * open).toFixed(1)} L573 470 Z`); op(doorPanel, up(t, CS("life") + 0.8, 0.6) * dv);
    doorway.setAttribute("opacity", (0.85 * open * dv).toFixed(3)); spill.setAttribute("opacity", ((0.22 + 0.05 * Math.sin(t * 1.3)) * open * dv).toFixed(3));

    const tv = span(t, Lf[1] - 0.3, Lf[2] + 0.4, 0.7, 0.7); op(town, tv);
    houses.forEach((h, i) => { const k = up(t, Lf[1] + 0.1 + i * 0.15, 0.6); h.g.setAttribute("transform", `translate(0 ${(12 * (1 - k)).toFixed(1)})`); op(h.g, k); h.win.setAttribute("fill", t > W("life", 1, 13) + i * 0.35 ? MUSTARD : BONE); });
    draw(ground9, up(t, Lf[1], 1.0)); op(bench, up(t, W("life", 1, 9), 0.6)); op(townLab, up(t, W("life", 1, 7), 0.6)); op(handLab, up(t, W("life", 1, 10), 0.6));
    // Hebrews 4:15 above a path walked together
    op(vG9, span(t, Lf[3] - 0.2, Lf[4] + 0.4, 0.6, 0.7)); hLines.forEach((l, i) => op(l, up(t, W("life", 3, [0, 10, 19, 28][i]), 0.8))); op(hRef, up(t, Lf[3] + 1.6, 0.7));
    draw(path9, up(t, Lf[2], 1.4)); op(path9, 1 - up(t, CS("close"), 0.8));
    const wk = 0.55 * clamp((t - Lf[2]) / Math.max(1, CS("close") + 1 - Lf[2]));   // walkers never wrap
    walkers.forEach((w, i) => { const [x, y] = at(0.08 + wk + w.o); set(w.e, { cx: x.toFixed(1), cy: (y - 12).toFixed(1) }); set(w.ring, { cx: x.toFixed(1), cy: (y - 12).toFixed(1) }); op(w.e, up(t, Lf[2] + 0.3 + i * 0.2, 0.6) * (1 - up(t, CS("close"), 0.8)));
      op(w.ring, up(t, W("life", 4, 16) + i * 0.3, 0.6) * (1 - up(t, CS("close"), 0.8))); });
    const lead = at(0.08 + wk + 0.17), rise = up(t, Lf[4] + 0.2, 1.8);

    const wl = up(t, W("life", 2, 2), 0.6) * (1 - up(t, Lf[4] + 1.6, 0.5)); op(wLight, wl); op(wHalo, wl * 0.2);
    move(E9.g, 640, 250 + 3 * Math.sin(t * 0.8)); const ek = up(t, Lf[4] + 1.4, 0.8) * (1 - up(t, CS("close") + 0.2, 0.8)); op(E9.g, ek);
    set(E9.core, { r: (30 + 2 * Math.sin(t * 2)).toFixed(1) }); E9.arcs.forEach((a, i) => draw(a, up(t, Lf[4] + 1.6 + i * 0.2, 0.7))); op(E9.ghost, 0);
  };

  // ================= 10. the close: light handed on, and the tent pitched among us =================
  const Z = [0, 1].map((k) => S("close", k)), END = F.VOICE_END;
  const g10 = G(), RY = 470;
  const ground10 = line(g10, "M150 500 H1130", { stroke: STONE, "stroke-width": 2.5 });
  const RX = [220, 320, 420, 520, 760, 860, 960, 1060];

  const pour = el("circle", { r: 26, fill: MUSTARD }, g10), pourHalo = el("circle", { r: 46, fill: MUSTARD, opacity: 0.18 }, g10);
  const hand = el("circle", { r: 7, fill: MUSTARD }, g10);

    const v = span(t, CS("close") - 0.2, END + 2.5, 0.7, 0.9); op(g10, v); if (v <= 0) return;

    set(pour, { cx: 640, cy: py.toFixed(1), r: pr.toFixed(1) }); set(pourHalo, { cx: 640, cy: py.toFixed(1), r: (mix(46, 20, dk) + 3 * Math.sin(t * 1.5)).toFixed(1) });
    op(pour, up(t, CS("close") - 0.2, 0.6) * (1 - up(t, Z[1] + 0.4, 0.6))); op(pourHalo, up(t, CS("close") - 0.2, 0.6) * 0.18 * (1 - up(t, Z[1] + 0.4, 0.6)));
    // the pattern: each one hands the light to the next

    tentGlow.setAttribute("opacity", (up(t, W("close", 1, 14), 1.2) * (0.18 + 0.06 * Math.sin(t * 1.4))).toFixed(3));

  F.title("The Word became flesh");

});
