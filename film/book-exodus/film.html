<!-- "Exodus: out of slavery, to God". A strip of the book's 40 chapters runs along the bottom for the whole

     the bush and the name; a marked doorway and a sea standing open; two tablets given after the rescue; a
     tent that the calf nearly ends, and the glow that fills it.
     People are dots. God is never drawn. The deaths of the Passover night and at the sea are named by the
     voice and never shown. Chapter boundaries (checked in client/public/bible/text/exodus/): Sinai from 19:1-2;
     the tabernacle in chapters 25 to 31 and 35 to 40; the calf in 32.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->

    op(v5.g, span(t, W0 + 5.6, W1 - 0.2, 0.6, 0.6));
    const cv = span(t, W1 - 0.2, T0 - 0.4, 0.6, 0.6); op(gChain, cv);

  };
  const drawTent = (t) => {
    const v = up(t, T0 - 0.4, 0.6) * (1 - up(t, END + 0.5, 0.7)); op(gTent, v); op(gCampT, v * up(t, T0 + 0.8, 0.8));
