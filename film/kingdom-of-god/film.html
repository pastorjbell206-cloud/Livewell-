     two equal cards hung from a level rod (within you, among you); a mustard seed that becomes a tree and leaven
     spreading through flour; a chest in a field, a house emptied, a fence, a pearl, and one question mark;
     a timeline filled and unfilled (already, not yet); six equal cards where Christians differ; seven marks,
     two lines that become one, and the filled and unfilled timeline again.
     God is never drawn: only mustard light at opacity 0.1 or less. People are ink dots, all alike. No crowns,
     no modern nation, flag or party. Words and timing come from script.json and timeline.json.
     Open with ?t=42 to freeze on second 42. -->
