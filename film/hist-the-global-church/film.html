     crowd that went to one of them, the minority at Barmen and the page that left the persecution of the Jews
     blank, Stuttgart's late confession; Bonhoeffer's two books, his crossing home, his short time line and one
     light in a great silence; a decade against seventy years, a field of parishes that thins to a few, the
     church in China multiplying under the ground and rising, twenty centuries with the last marked; Azusa
     Street and the lines that run from it round the world; the South stirring at Pyongyang, the Congo and
     East Africa, and the Catholic heart moving south; Lausanne and two equal panels that hold the same call
     two ways; the balance tipping around 1980, Africa's ten million and three hundred million; Walls's moving
     centers from Jerusalem to the Atlantic world; and the multitude before the throne (Revelation 7:9).
     Persecution and death are named in words only; a hollow ring marks one life remembered. Nothing violent
     is drawn. Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42. -->
