     soldiers are three empty places, and the one outline at the end of the first scene goes round every dot,
     the row along the bottom edge (the audience) included. The six ways of explaining the cross come back in
     "together" as six emblems of one size and one tone, with the bare cross in the middle of them.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
