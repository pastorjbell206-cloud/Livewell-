     1 to 4, 5 to 10, 11 to 12, 13 to 20, 21 to 24.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->

    op(plan, pv); move(plan, 640, 292, 1 - 0.25 * turn, 180 * turn); draw(planLine, up(t, H0 + 0.1, 1.8)); op(planArk, up(t, H0 + 1.4, 0.5));
    draw(fromAbove, up(t, word("house", 0, 7) - 0.1, 0.9)); op(fromAbove, 1 - up(t, word("house", 0, 12) + 0.3, 0.8));
    const p0 = word("house", 0, 12), lk = up(t, p0, 3.6), fork = up(t, word("house", 2, 15), 1.6);

    kings.forEach((kk, i) => { const o = up(t, p0 + 0.5 + i * 0.5, 0.6) * (i > 3 ? 1 - fork : 1), beat = Math.max(0, Math.sin(t * 1.6 - i * 0.9)); op(kk.g, o); move(kk.g, kk.x, LY - 18 - 3 * beat, 1); });
    move(hDav, 300, LY - 24 + 1.3 * Math.sin(t * 0.9)); op(hDav, up(t, H0 - 0.3, 0.5));
    const run = t > H2 - 0.2 && fork < 0.05 ? ((t - H2) * 0.3) % 1 : -1; op(pulse, run >= 0 ? Math.sin(Math.PI * run) : 0); if (run >= 0) pulse.setAttribute("cx", mix(310, 1280, run).toFixed(1));
  };
  const drawNathan = (t) => {
    showVerse(v5, t, N2 - 0.25, W0 - 0.3, true);
    const v = up(t, N0 - 0.4, 0.5) * (1 - up(t, W0 - 0.5, 0.7)); op(gNathan, v); if (v <= 0) return;
    const said = up(t, N2 + 0.5, 1.4), cx = mix(KX, KX + 74, said), cy = mix(KY - 32, KY + 22, said);
    set(nKing, { cy: (KY + 1.2 * Math.sin(t * 0.8) + 8 * said).toFixed(1) }); op(nCrown, up(t, N0 - 0.2, 0.6)); move(nCrown, cx, cy + 1.2 * Math.sin(t * 0.8), mix(2.3, 1.5, said), 22 * said);
    const u0 = word("nathan", 0, 6), u1 = word("nathan", 0, 11);
    op(uDot, up(t, u0, 0.6) * (1 - up(t, u1 + 0.2, 1.1))); op(uRing, up(t, u1 + 0.5, 0.8)); op(uLab, up(t, u0 + 0.3, 0.5) * (1 - up(t, u1 + 0.9, 0.6)));
    const cv = up(t, u1 + 1.3, 1.0), lift = up(t, N2 + 0.9, 1.3); op(pall, cv * (1 - lift)); pall.setAttribute("y", (mix(240, 332, cv) - 70 * lift).toFixed(1));
    const w0 = word("nathan", 0, 14); draw(whole, up(t, w0, 2.2)); op(whole, 1 - up(t, N1 - 0.3, 0.8)); op(wholeLab, span(t, w0 + 1.0, N1 - 0.1, 0.5, 0.6));
    const enter = up(t, N1 - 0.2, 1.6), nx = mix(140, 340, enter); op(nDot, up(t, N1 - 0.2, 0.4)); set(nDot, { cx: nx.toFixed(1), cy: (380 - 2 * Math.abs(Math.sin(t * 4.5)) * (enter < 1 ? 1 : 0)).toFixed(1) }); set(nLab, { x: nx.toFixed(1) }); op(nLab, up(t, N1 + 0.9, 0.5) * (1 - up(t, N2 - 0.4, 0.6)));
    draw(nLine, up(t, word("nathan", 1, 9), 1.3)); op(nLine, 1 - up(t, N2 + 0.6, 0.9));
  };
  const drawSword = (t) => {
    const v = up(t, W0 - 0.4, 0.5) * (1 - up(t, W1 - 0.4, 0.8)); op(gSword, v);
    if (v > 0) { draw(house, up(t, W0 - 0.3, 2.6)); draw(fGround, up(t, W0 - 0.3, 1.6));
      const at = [word("sword", 0, 9), word("sword", 0, 13), word("sword", 0, 16), word("sword", 0, 18)]; cracks.forEach((c, i) => draw(c, up(t, at[i], 1.0)));
      const f = up(t, at[3] + 0.5, 0.9); op(father, f); set(father, { cy: (423 + 6 * up(t, at[3] + 1.4, 1.6) + 1.2 * Math.sin(t * 0.8)).toFixed(1) }); }
    showVerse(v6, t, word("sword", 0, 18) + 1.0, W1 + 0.1, false);
    const bv = span(t, W1 - 0.2, ST - 0.1, 0.6, 0.6); op(gBoth, bv);

      both.forEach((g, i) => { op(g, up(t, W1 + 0.5 + i * 1.0, 0.7)); move(g, i ? X(18) : X(5), 396 + 1.5 * Math.sin(t * 0.9 + i * 2)); }); }
  };
  const drawStart = (t) => {
    const v = span(t, ST - 0.3, CL + 0.1, 0.4, 0.6); op(gStart, v); if (v <= 0) return;
    op(big[0], span(t, KEYS[7] - 0.3, KEYS[11] - 0.1, 0.4, 0.3)); op(big[1], span(t, KEYS[11] - 0.1, KEYS[12], 0.3, 0.25)); op(big[2], span(t, KEYS[12], PS - 0.1, 0.25, 0.3));
    big.forEach((b, i) => b.setAttribute("y", (330 + 6 * Math.sin(t * 0.9 + i)).toFixed(1)));
    const p = up(t, PS, 0.8), hx = (X(11) + X(12)) / 2; op(psBig, up(t, PS - 0.05, 0.5)); psBig.setAttribute("y", (300 + 8 * (1 - p)).toFixed(1));
    set(psBar, { x: (hx - 60 * p).toFixed(1), y: SY - 62, width: (120 * p).toFixed(1) }); op(psBar, p); psLine.setAttribute("d", `M${hx} ${SY - 46} V${SY - 18}`); draw(psLine, up(t, PS + 0.3, 0.6)); set(psLab, { x: hx, y: SY - 72 }); op(psLab, up(t, PS + 0.5, 0.5));
  };
  const drawClose = (t) => {
    const v = up(t, CL - 0.2, 0.7) * (1 - up(t, END + 0.5, 0.7)); op(gClose, v); if (v <= 0) return;
    set(cN, { cy: (372 + 1.4 * Math.sin(t * 0.9)).toFixed(1) }); move(cK, 808, 366 + 1.4 * Math.sin(t * 0.8 + 1)); draw(cLine, up(t, CL + 0.5, 1.6)); cLine.setAttribute("stroke-width", (3.5 + 0.6 * Math.sin(t * 1.5)).toFixed(2));
  };

  F.title("2 Samuel");
  F.endCard(SC.close.titleCard, END + 0.7);
  return (t) => { drawStrip(t); drawKing(t); drawParts(t); drawCrown(t); drawHouse(t); drawNathan(t); drawSword(t); drawStart(t); drawClose(t); };
});
