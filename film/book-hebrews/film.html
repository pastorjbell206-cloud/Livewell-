     The urging bands on the strip follow the five warning passages in the site's Berean text
     (2:1-4, 3:7-4:13, 5:11-6:12, 10:19-39, 12:14-29).
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
