<!doctype html>
<!-- "In Christ" (doctrine film: union with Christ). One continuous picture in ten scenes: an open book where
     one small phrase keeps lighting up; a person outside a ring of light, helped from a distance, then joined;
     the ring carried through the cross, the empty tomb and the sunrise; the bond drawn round it; Paul's letters
     and Deissmann's count; the "with" words; the ground the idea grows from (the tabernacle in the camp, two
     who cling and become one flesh, one standing for many); the vine and its branches, the road to Damascus;
     Adam and Christ and their two humanities, buried and raised through the water, every blessing given in
     him, one body; Irenaeus's second Adam and Calvin's bond on a timeline; four traditions side by side over
     one line of grace; a life hidden with Christ in God, suffering passing over, the Lord's Supper; and a life
     that ends inside the ring, waiting for the sunrise.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
<html lang="en"><head><meta charset="utf-8"><title>In Christ</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));
  const CS = (id) => CH[id].start;
  const A = (id, k, f) => S(id, k) + (E(id, k) - S(id, k)) * f;          // a moment f of the way through line k
  const T = (p, cls, x, y, s, size, anchor, fill) => { const e = txt(p, cls, x, y, s, size, fill ? { fill } : undefined); if (anchor) e.setAttribute("style", (e.getAttribute("style") || "") + `text-anchor:${anchor};`); return e; };
  const G = (p) => el("g", {}, p || world);
  const R = rng(53);
  const dr = (e, k) => { draw(e, k); op(e, k > 0.002 ? 1 : 0); };   // draw a line, hidden until it starts
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const cmix = (a, b, k) => { const P = hex(a), Q = hex(b); return "#" + P.map((v, i) => Math.round(mix(v, Q[i], clamp(k))).toString(16).padStart(2, "0")).join(""); };
  const ring = (cx, cy, r) => `M${cx} ${cy - r} A${r} ${r} 0 1 1 ${(cx - 0.01).toFixed(2)} ${cy - r}`;
  // cubic segments sampled into points, and a track along points measured by length (for things that ride a path)
  const bez = (pts, n = 40) => { const out = [pts[0]]; for (let i = 1; i + 2 < pts.length; i += 3) { const [p0, c1, c2, p1] = [pts[i - 1], pts[i], pts[i + 1], pts[i + 2]];
    for (let k = 1; k <= n; k++) { const u = k / n, a = (1 - u) ** 3, b = 3 * (1 - u) ** 2 * u, c = 3 * (1 - u) * u * u, e = u ** 3; out.push([a * p0[0] + b * c1[0] + c * c2[0] + e * p1[0], a * p0[1] + b * c1[1] + c * c2[1] + e * p1[1]]); } } return out; };
  const track = (pts) => { const len = [0]; for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = len.at(-1), d = "M" + pts.map((p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" L");
    const at = (f) => { const s = clamp(f) * L; let i = 1; while (i < len.length - 1 && len[i] < s) i++; const k = (s - len[i - 1]) / Math.max(1e-6, len[i] - len[i - 1]); return [mix(pts[i - 1][0], pts[i][0], clamp(k)), mix(pts[i - 1][1], pts[i][1], clamp(k))]; };
    return { d, at, L }; };
  const cross = (p, h, attrs) => line(p, `M0 ${-h / 2} V${h / 2} M${-h * 0.3} ${-h * 0.2} H${h * 0.3}`, attrs);
  // a sheet of writing: rectangle with rows of little word-bars
  const sheet = (parent, w, h, rows, seed, o = {}) => {
    const g = G(parent), r = rng(seed), bh = Math.max(2.4, h * 0.03);
    g._rect = el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, fill: o.fill || PAPER, stroke: INK, "stroke-width": o.sw || 2.2 }, g);
    const bars = [], pad = w * 0.13;
    for (let i = 0; i < rows; i++) {
      const y = -h / 2 + h * 0.16 + i * (h * 0.68 / Math.max(1, rows - 1));
      let x = -w / 2 + pad; const end = w / 2 - pad - (i === rows - 1 ? w * 0.28 : 0);
      while (x < end - 5) { const bw = Math.min(end - x, 5 + r() * w * 0.17); const b = el("rect", { x, y: y - bh / 2, width: bw, height: bh, rx: bh / 2, fill: INK }, g); Object.assign(b, { _x: x, _y: y, _w: bw, _row: i }); bars.push(b); x += bw + Math.max(3, w * 0.025); }
    }
    g._bars = bars; return g;
  };

  // ================= 1. the question: one small phrase, all through the book =================
  const Q0 = S("question", 0), Q1 = S("question", 1);
  const g1 = G();
  const pageD = (s) => `M0 -62 C${-50 * s} -84 ${-130 * s} -84 ${-180 * s} -66 L${-180 * s} 70 C${-130 * s} 52 ${-50 * s} 52 0 74 Z`;
  const book = G(g1);
  [1, -1].forEach((s) => el("path", { d: pageD(s), fill: PAPER, stroke: INK, "stroke-width": 2.4, "stroke-linejoin": "round" }, book));
  const wbars = [];
  [1, -1].forEach((s) => [-44, -28, -12, 4, 20, 36].forEach((dy) => { let x = 22; while (x < 150) { const w = Math.min(158 - x, 12 + R() * 34); wbars.push(el("rect", { x: s > 0 ? -(x + w) : x, y: dy - 2.5, width: w, height: 5, rx: 2.5, fill: STONE }, book)); x += w + 8; } }));
  const hits = wbars.filter((_, i) => i % 4 === 1);
  const hitOrder = hits.map(() => R());
  const draw1 = (t) => {
    const v = span(t, Q0 - 0.5, Q1 + 1.4, 0.9, 0.9); op(g1, v); if (v <= 0) return;
    const out = up(t, Q1 - 0.7, 0.8);
    move(book, 640, 410 + 2 * Math.sin(t * 0.8) + 50 * out, 1.25); op(book, 1 - out);
    wbars.forEach((b, i) => op(b, up(t, Q0 - 0.3 + i * 0.012, 0.5)));
    const win = Math.max(2, E("question", 0) - Q0 - 1.6);
    hits.forEach((b, i) => b.setAttribute("fill", cmix(STONE, MUSTARD, up(t, Q0 + 0.4 + hitOrder[i] * win, 0.5))));
  };

  // ================= 2. what the church confesses: stations on one road =================
  const J = [0, 1, 2].map((k) => S("joined", k)), JM = A("joined", 0, 0.5);
  const g2 = G();
  const path2 = line(g2, "M150 380 H1130", { stroke: LINE, "stroke-width": 3 });
  const crossG = G(g2), crossP = cross(crossG, 96, { "stroke-width": 5 });
  const tomb = G(g2);
  el("path", { d: "M-62 0 Q-58 -78 0 -82 Q58 -78 62 0 Z", fill: WARM, stroke: INK, "stroke-width": 2.6, "stroke-linejoin": "round" }, tomb);
  el("path", { d: "M-18 0 V-30 A18 18 0 0 1 18 -30 V0 Z", fill: CHAR }, tomb);
  el("circle", { cx: 44, cy: -20, r: 20, fill: MUTED, stroke: INK, "stroke-width": 2.2 }, tomb);
  const sun2 = G(g2); el("path", { d: "M-44 0 A44 44 0 0 1 44 0 Z", fill: MUSTARD, opacity: 0.85 }, sun2);
  const rays2 = [...Array(7)].map((_, i) => { const a = Math.PI + (i + 1) * Math.PI / 8; return line(g2, `M${(1000 + Math.cos(a) * 54).toFixed(1)} ${(340 + Math.sin(a) * 54).toFixed(1)} L${(1000 + Math.cos(a) * 74).toFixed(1)} ${(340 + Math.sin(a) * 74).toFixed(1)}`, { stroke: MUSTARD, "stroke-width": 2.5 }); });
  const st2 = [["DIED WITH HIM", 420], ["RAISED WITH HIM", 700], ["WILL APPEAR WITH HIM", 1000]].map(([s, x]) => T(g2, "lab", x, 440, s, 15));
  const hdr2 = T(g2, "ital", 640, 192, "what's true of him becomes true of them", 40);
  const draw2 = (t) => {
    const v = span(t, J[1] - 0.2, J[2] + 0.8, 0.6, 0.9); op(g2, v); if (v <= 0) return;
    dr(path2, up(t, J[1], 1.3));
    move(crossG, 420, 292 + 2 * Math.sin(t)); dr(crossP, up(t, J[1] + 0.5, 1.0));
    move(tomb, 700, 340); op(tomb, up(t, J[1] + 0.8, 0.8));
    const sk = up(t, J[1] + 1.1, 1.0); move(sun2, 1000, 340, Math.max(0.01, sk)); op(sun2, sk);
    rays2.forEach((r, i) => dr(r, up(t, J[1] + 1.5 + i * 0.1, 0.6)));
    [0.38, 0.58, 0.78].forEach((f, i) => op(st2[i], up(t, A("joined", 1, f), 0.6)));
    op(hdr2, span(t, J[1] + 0.2, J[2] + 0.2, 0.7, 0.6));
  };

  // ================= core: a person, and the ring of light he is joined to (scenes 1 and 2) =================
  const gC = G();
  const inC = T(gC, "ital", 640, 215, "in Christ", 96);
  const helpers = [0, 1, 2, 3].map(() => el("circle", { r: 4, fill: MUSTARD }, gC));
  const bond = line(gC, ring(640, 360, 106), { stroke: MUSTARD, "stroke-width": 3 });
  const cRing = el("circle", { r: 70, fill: WARM, stroke: MUSTARD, "stroke-width": 2.5 }, gC);
  const cDot = el("circle", { r: 10, fill: INK }, gC);
  const qm = T(gC, "ital", 612, 424, "?", 72, null, MUSTARD);
  const farLab = T(gC, "lab", 610, 512, "FROM A DISTANCE", 15), joinLab = T(gC, "lab", 790, 512, "JOINED TO HIM", 15);
  const spLab = T(gC, "lab", 320, 367, "THE SPIRIT · THE BOND", 15), fLab = T(gC, "lab", 960, 367, "FAITH · RECEIVES IT", 15);
  const drawC = (t) => {
    const v = span(t, E("question", 0) - 1.4, CS("phrase") + 1.0, 0.5, 0.9); op(gC, v); if (v <= 0) return;
    op(inC, span(t, E("question", 0) - 1.3, JM + 2.2, 0.9, 0.9)); inC.setAttribute("y", (215 - 8 * up(t, E("question", 0) - 1.3, 2.4)).toFixed(1));
    const jk = up(t, JM, 1.4), c = up(t, J[1] + 0.1, 1.2), e = up(t, J[2] - 0.3, 1.4);
    const d1 = up(t, A("joined", 1, 0.36), 0.9), d2 = up(t, A("joined", 1, 0.56), 0.9), d3 = up(t, A("joined", 1, 0.76), 0.9);
    const px = 170 + 250 * d1 + 280 * d2 + 300 * d3;
    const cx = mix(mix(790, px, c), 640, e), cy = mix(mix(400, 380, c), 360, e) + 2 * Math.sin(t * 0.9), cr = mix(mix(70, 30, c), 74, e);
    set(cRing, { cx: cx.toFixed(1), cy: cy.toFixed(1), r: cr.toFixed(1) }); op(cRing, up(t, Q1 + 0.8, 0.8));
    const hx = 500 + 14 * Math.sin(t * 1.3);
    set(cDot, { cx: mix(hx, cx, jk).toFixed(1), cy: mix(400, cy, jk).toFixed(1), r: mix(mix(10, 7, c), 10, e).toFixed(1) }); op(cDot, up(t, Q1 + 0.4, 0.6));
    op(qm, span(t, Q1 + 1.4, J[0] + 0.5, 0.6, 0.5));
    helpers.forEach((h, i) => { const x = 716 - ((t * 70 + i * 52) % 200); set(h, { cx: x.toFixed(1), cy: 400 }); op(h, span(t, J[0] + 0.4, JM + 0.2, 0.5, 0.4) * clamp((716 - x) / 30) * clamp((x - 516) / 30)); });
    op(farLab, span(t, J[0] + 0.8, JM + 0.3, 0.6, 0.5)); op(joinLab, span(t, JM + 1.0, J[1] + 0.4, 0.6, 0.5));
    dr(bond, up(t, J[2] + 0.5, 1.6));
    op(spLab, up(t, J[2] + 0.9, 0.7)); op(fLab, up(t, A("joined", 2, 0.6), 0.7));
  };

  // ================= 3. a small phrase: Paul's letters, Deissmann's count, the "with" words =================
  const P0 = S("phrase", 0), P1 = S("phrase", 1);
  const g3 = G(), g3a = G(g3), g3b = G(g3);
  const lets = [...Array(7)].map((_, i) => sheet(g3a, 84, 112, 6, 300 + i));
  const hl = []; lets.forEach((s, i) => [1, 7, 12].forEach((j) => { const b = s._bars[(j + i) % s._bars.length]; if (b) hl.push(b); }));
  const hlOrder = hl.map(() => R());
  const cnt = T(g3a, "disp", 1020, 382, "0", 124);
  const dLab = T(g3a, "lab", 1020, 432, "ADOLF DEISSMANN · 1892", 15);
  const topLab = T(g3a, "lab", 470, 232, "IN CHRIST · IN HIM · IN THE LORD", 15), letLab = T(g3a, "lab", 470, 446, "PAUL'S LETTERS", 15);
  const RY = [272, 367, 462], WW = ["crucified", "buried", "raised"];
  const rows3 = RY.map((y, i) => ({ w: T(g3b, "disp", 610, y, WW[i], 56, "end"), with: T(g3b, "ital", 626, y, "with", 56, "start", MUSTARD),
    a: line(g3b, `M790 ${y - 26} C900 ${y - 34} 1010 ${y - 18} 1130 ${y - 26}`, { "stroke-width": 3 }), b: line(g3b, `M790 ${y - 12} C900 ${y - 20} 1010 ${y - 4} 1130 ${y - 12}`, { stroke: STONE, "stroke-width": 3 }) }));
  const synLab = T(g3b, "lab", 640, 172, "THE GREEK PREFIX SYN- MEANS WITH", 15);
  const draw3 = (t) => {
    const v = span(t, CS("phrase") + 0.2, CS("roots") + 1.6, 0.7, 0.9); op(g3, v); if (v <= 0) return;
    const va = 1 - up(t, P1 - 0.4, 0.8); op(g3a, va);
    if (va > 0) {
      lets.forEach((s, i) => { op(s, up(t, CS("phrase") + 0.4 + i * 0.15, 0.6)); move(s, 170 + i * 100, 335 + 3 * Math.sin(t * 0.9 + i)); });
      const hw = Math.max(2, A("phrase", 0, 0.45) - P0 - 0.3);
      hl.forEach((b, i) => b.setAttribute("fill", cmix(INK, MUSTARD, up(t, P0 + 0.3 + hlOrder[i] * hw, 0.4))));
      const c0 = A("phrase", 0, 0.5), ck = up(t, c0, Math.max(1.5, E("phrase", 0) - c0 - 0.3));
      cnt.textContent = String(Math.round(164 * ck)); op(cnt, up(t, c0 - 0.2, 0.5));
      op(dLab, up(t, c0 + 0.3, 0.6)); op(topLab, up(t, P0 + 0.6, 0.6)); op(letLab, up(t, P0 + 1.4, 0.6));
    }
    const vb = up(t, P1 - 0.2, 0.7); op(g3b, vb);
    if (vb > 0) {
      op(synLab, up(t, P1 + 0.2, 0.6));
      [0.5, 0.62, 0.74].forEach((f, i) => { const a = A("phrase", 1, f), r = rows3[i]; op(r.w, up(t, a - 0.1, 0.6)); op(r.with, up(t, P1 + 0.4 + i * 0.3, 0.7)); dr(r.a, up(t, a + 0.2, 1.4)); dr(r.b, up(t, a + 0.3, 1.4)); });
    }
  };

  // ================= 4. the roots: the ground the idea grows from =================
  const Rt = [0, 1, 2, 3].map((k) => S("roots", k));
  const g4 = G();
  const soil = line(g4, "M110 470 H1170", { stroke: STONE, "stroke-width": 3 });
  const hdr4 = T(g4, "ital", 640, 196, "the ground the idea grows from", 44);
  const rootsP = ["M640 500 C560 520 420 515 300 560", "M640 500 C646 525 634 550 640 578", "M640 500 C720 520 860 515 980 560"].map((d) => line(g4, d, { stroke: STONE, "stroke-width": 2 }));
  const seed = el("ellipse", { cx: 640, cy: 500, rx: 9, ry: 6, fill: STONE }, g4);
  // the tabernacle in the middle of the camp
  const glow4 = el("circle", { cx: 300, cy: 404, r: 34, fill: MUSTARD }, g4);
  const tent = el("path", { d: "M266 428 L300 380 L334 428 Z M300 428 V402", fill: WARM, stroke: INK, "stroke-width": 2.4, "stroke-linejoin": "round" }, g4);
  const camp = [...Array(22)].map((_, i) => { const a = (i / 22) * Math.PI * 2; return el("circle", { cx: (300 + Math.cos(a) * 128).toFixed(1), cy: (410 + Math.sin(a) * 44).toFixed(1), r: 5, fill: INK }, g4); });
  const tabLab = T(g4, "lab", 300, 302, "THE TABERNACLE", 15);
  // two who cling and become one flesh
  const flesh = line(g4, "M640 366 C680 366 690 382 690 400 C690 418 680 434 640 434 C600 434 590 418 590 400 C590 382 600 366 640 366", { "stroke-width": 2.4 });
  const love = line(g4, ring(640, 400, 64), { stroke: MUSTARD, "stroke-width": 2.6 });
  const cl = [el("circle", { r: 13, fill: INK }, g4), el("circle", { r: 13, fill: INK }, g4)];
  const dabLab = T(g4, "lab", 640, 290, "DABAQ · TO CLING", 15), proLab = T(g4, "lab", 640, 290, "THE PROPHETS · GOD'S LOVE", 15), oneLab = T(g4, "lab", 640, 320, "ONE FLESH", 15);
  // one standing for many
  const manyPos = []; [[7, 400], [9, 426], [11, 452]].forEach(([n, y]) => { for (let i = 0; i < n; i++) manyPos.push([980 + (i - (n - 1) / 2) * 22, y]); });
  const manyL = manyPos.map(([x, y]) => line(g4, `M980 362 L${x} ${y - 6}`, { stroke: LINE, "stroke-width": 1.4 }));
  const many = manyPos.map(([x, y]) => el("circle", { cx: x, cy: y, r: 5.5, fill: INK }, g4));
  const one = el("circle", { cx: 980, cy: 352, r: 12, fill: INK }, g4);
  const manyLab = T(g4, "lab", 980, 302, "ONE FOR MANY · ADAM", 15);
  const draw4 = (t) => {
    const v = span(t, CS("roots") + 0.3, CS("vine") + 1.4, 0.7, 1.0); op(g4, v); if (v <= 0) return;
    g4.setAttribute("transform", `translate(0 ${(80 * up(t, CS("vine") - 0.1, 1.5)).toFixed(1)})`);
    const below = 1 - up(t, CS("vine") - 0.5, 0.6); rootsP.forEach((r) => op(r, below));
    dr(soil, up(t, CS("roots") + 0.4, 1.4));
    op(hdr4, span(t, Rt[0] + 0.5, CS("vine") + 0.2, 0.8, 0.7));
    op(seed, up(t, A("roots", 0, 0.5), 0.6) * below);
    const t1 = Rt[1];
    op(tent, up(t, t1 + 0.1, 0.7)); op(glow4, 0.26 * up(t, t1 + 0.6, 0.8) * (0.7 + 0.3 * Math.sin(t * 1.6)));
    camp.forEach((c, i) => op(c, up(t, t1 + 0.4 + i * 0.07, 0.4)));
    op(tabLab, up(t, t1 + 0.3, 0.6)); dr(rootsP[0], up(t, t1 + 0.2, 1.6));
    const t2 = Rt[2], gk = up(t, t2 + 0.3, Math.max(1, A("roots", 2, 0.4) - t2 - 0.3));
    set(cl[0], { cx: mix(565, 627, gk).toFixed(1), cy: (400 + 2 * Math.sin(t)).toFixed(1) }); set(cl[1], { cx: mix(715, 653, gk).toFixed(1), cy: (400 + 2 * Math.sin(t)).toFixed(1) }); cl.forEach((c) => op(c, up(t, t2 + 0.1, 0.5)));
    dr(flesh, up(t, A("roots", 2, 0.42), 1.0)); dr(love, up(t, A("roots", 2, 0.6), 1.3));
    op(dabLab, span(t, t2 + 0.2, A("roots", 2, 0.6), 0.6, 0.5)); op(proLab, up(t, A("roots", 2, 0.62), 0.6)); op(oneLab, up(t, A("roots", 2, 0.44), 0.6));
    dr(rootsP[1], up(t, t2 + 0.2, 1.6));
    const t3 = Rt[3]; op(one, up(t, t3 + 0.1, 0.5)); op(manyLab, up(t, t3 + 0.3, 0.6)); dr(rootsP[2], up(t, t3 + 0.2, 1.6));
    many.forEach((m, i) => { const a = t3 + 0.4 + i * 0.045; op(m, up(t, a, 0.4)); dr(manyL[i], up(t, a + 0.2, 0.7)); m.setAttribute("fill", cmix(INK, STONE, up(t, A("roots", 3, 0.6) + i * 0.03, 0.6))); });
    if (below < 1) rootsP.forEach((r) => op(r, below));
  };

  // ================= 5. the true vine; the road to Damascus =================
  const V = [0, 1, 2, 3, 4].map((k) => S("vine", k));
  const g5 = G(), gv = G(g5), g5b = G(g5);
  const trunkC = track(bez([[640, 586], [628, 530], [654, 480], [640, 430], [626, 390], [652, 360], [641, 320]]));
  const trunk = line(gv, trunkC.d, { "stroke-width": 7 });
  const BR = [[[640, 515], [590, 490], [520, 522], [430, 482]], [[640, 510], [690, 485], [760, 517], [850, 474]], [[640, 446], [600, 420], [550, 446], [478, 396]],
    [[640, 440], [680, 414], [730, 440], [802, 392]], [[641, 374], [615, 352], [590, 364], [560, 332]], [[640, 370], [665, 348], [690, 360], [722, 328]]];
  const brs = BR.map((p, i) => { const c = track(bez(p)); return { c, e: line(gv, c.d, { "stroke-width": i < 4 ? 4.5 : 3.5 }) }; });
  const leaves = []; brs.forEach((b, i) => [0.38, 0.72].forEach((f, j) => { const [x, y] = b.c.at(f), [x2, y2] = b.c.at(f + 0.03); const ang = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI + (j ? -55 : 55);
    const lf = G(gv); el("ellipse", { cx: 13, cy: 0, rx: 13, ry: 6, fill: MUTED, stroke: STONE, "stroke-width": 1.4 }, lf); leaves.push({ lf, x, y, ang, f, b: i }); }));
