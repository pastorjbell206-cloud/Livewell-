<!-- "The Church in the Middle Ages" (church history film). One continuous picture in ten scenes: two panels,
     a dark age and an age of faith, give way to one line from 1054 to 1517 with its noon above and its
     sickness below; the line becomes the ground of a village church that touches every day of a life;
     Cluny inside its ring, out of reach of crowns, then coins passing to mitres, and Acts 8:20 while the
     coins sink short of the light; the reform line rises to the papal chair, the link between crown and
     mitre breaks, a king waits three days in the snow at the castle gate of Canossa, and the chair, freed,
     rises above the crown; high noon, kings bowing, the cathedral, the first universities, faith and reason
     joined, and Francis leaving his coins for the poor; a dot map from Europe to Jerusalem where a call
     ripples outward and quiet rings mark Worms and Mainz, Jerusalem and Constantinople, the inquisitors'
     decree, a plain cross, certainty and power joined, and a level scale; the map draws in on Avignon under
     a crown's shadow, Catherine's road, the chair's return, rival chairs, the council at Constance and a
     ring for Hus; a timeline of reformers, some taken in, some condemned, coins rising to a dome, and the
     press scattering pages; three equal readings; and the long line to today, where every church stands.
     Violence is named in words and marked only by hollow rings; nothing is pictured.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->
<html lang="en"><head><meta charset="utf-8"><title>The Church in the Middle Ages</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));

  const Ls = (id) => CH[id].lines.map((_, k) => S(id, k));
  const AT = (id, k, f) => S(id, k) + (E(id, k) - S(id, k)) * f;          // a moment f of the way through line k
  const T = (p, cls, x, y, s, size, anchor, fill) => { const e = txt(p, cls, x, y, s, size, fill ? { fill } : undefined); if (anchor) e.setAttribute("style", (e.getAttribute("style") || "") + `text-anchor:${anchor};`); return e; };
  const G = (p) => el("g", {}, p || world);
  const R = rng(1054);
  const vis = (t, a, b) => span(t, a, b, 0.6, 0.7);
  const fmt = (n) => n.toFixed(1);

  // ---------- shared shapes ----------
  const CHURCH = [
    ["M-40 0 V-60 L0 -92 L40 -60 V0 Z", "M0 -92 V-132", "M-9 -120 H9", "M-10 0 V-22 Q0 -32 10 -22 V0"],
    ["M-44 0 V-56 H44 V0 Z", "M-30 -56 A30 30 0 0 1 30 -56", "M0 -86 V-108", "M-7 -99 H7", "M-10 0 V-22 Q0 -32 10 -22 V0"],
    ["M-46 0 V-50 L0 -78 L46 -50 V0 Z", "M-8 -78 V-96 H8 V-78", "M-26 -14 V-32", "M26 -14 V-32", "M-9 0 V-24 H9 V0"],
    ["M-46 0 V-118 H-14 V0", "M-46 -118 L-30 -136 L-14 -118", "M-14 -56 L16 -76 L46 -56 V0 H-14", "M-30 -82 V-98", "M10 0 V-20 Q18 -28 26 -20 V0"],
    ["M-34 0 V-46 L0 -70 L34 -46 V0 Z", "M0 -70 V-98", "M-10 -86 H10", "M-8 0 V-20 Q0 -28 8 -20 V0"],
  ];
  const mkChurch = (p, i, sw = 2.6, stroke = INK) => { const g = G(p); g._parts = CHURCH[i].map((d) => line(g, d, { "stroke-width": sw, stroke })); return g; };
  const drawParts = (g, t, a, gap = 0.2, d = 1.0) => g._parts.forEach((p, j) => draw(p, up(t, a + j * gap, d)));
  const CROWN_D = "M-20 0 L-24 -24 L-11 -12 L0 -28 L11 -12 L24 -24 L20 0 Z";

  const coin = (p) => { const g = G(p); el("circle", { r: 9, fill: MUSTARD }, g); el("circle", { r: 5.5, fill: "none", stroke: BONE, "stroke-width": 1.4, opacity: 0.7 }, g); return g; };
  const mitre = (p) => { const g = G(p); el("path", { d: "M-18 0 V-30 Q-18 -46 0 -62 Q18 -46 18 -30 V0 Z", fill: PAPER, stroke: INK, "stroke-width": 2.4, "stroke-linejoin": "round" }, g);
    el("path", { d: "M0 -48 V-8 M-8 -30 H8", stroke: STONE, "stroke-width": 2, fill: "none" }, g); return g; };

  const book = (p) => { const g = G(p); el("rect", { x: -22, y: -30, width: 44, height: 60, rx: 3, fill: PAPER, stroke: INK, "stroke-width": 2.4 }, g); el("rect", { x: -22, y: -30, width: 8, height: 60, fill: INK }, g);
    [-12, 0, 12].forEach((y) => el("line", { x1: -6, x2: 14, y1: y, y2: y, stroke: STONE, "stroke-width": 2 }, g)); return g; };

  const openBook = (p) => { const g = G(p); [1, -1].forEach((s) => el("path", { d: pageD(s), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, g));
    g._lines = []; [1, -1].forEach((s) => [-28, -10, 8, 26].forEach((dy) => g._lines.push(line(g, `M${-22 * s} ${dy - 8} C${-60 * s} ${dy - 20} ${-100 * s} ${dy - 20} ${-132 * s} ${dy - 10}`, { stroke: STONE, "stroke-width": 2.2 })))); return g; };
  const sealDoc = (p) => { const g = G(p); el("rect", { x: -20, y: -28, width: 40, height: 52, rx: 2, fill: PAPER, stroke: INK, "stroke-width": 2.2 }, g);
    [-16, -6, 4].forEach((y) => el("line", { x1: -12, x2: 12, y1: y, y2: y, stroke: STONE, "stroke-width": 2 }, g)); el("circle", { cx: 8, cy: 16, r: 6, fill: MUSTARD }, g); return g; };
  const memo = (p, r = 14) => el("circle", { r, fill: "none", stroke: STONE, "stroke-width": 2.4 }, p);   // a hollow ring: lives remembered
  const qPt = (x0, y0, cx, cy, x1, y1, k) => [mix(mix(x0, cx, k), mix(cx, x1, k), k), mix(mix(y0, cy, k), mix(cy, y1, k), k)];

  // ================= 1. the question: two stories, then one line with its noon and its sickness =================
  const Q = Ls("question");
  const g1 = G(), panL = G(g1), panR = G(g1), PW = 300, PH = 210;
  [panL, panR].forEach((g) => el("rect", { x: -PW / 2, y: -PH / 2, width: PW, height: PH, rx: 6, fill: "none", stroke: LINE, "stroke-width": 2 }, g));
  const night = el("rect", { x: -PW / 2 + 5, y: -PH / 2 + 5, width: PW - 10, height: PH - 10, rx: 4, fill: STONE }, panL);
  const moon = el("path", { d: "M0 -22 A22 22 0 0 0 0 22 A28 28 0 0 1 0 -22 Z", fill: STONE }, panL);
  const dimCh = [0, 2, 4].map((i, j) => { const c = mkChurch(panL, i, 3, STONE); c._x = -88 + j * 88; return c; });

  const ppl = [...Array(9)].map((_, i) => { const a = Math.PI * (0.08 + 0.84 * i / 8); return { x: -Math.cos(a) * 92, y: 82 - Math.sin(a) * 30, e: el("circle", { r: 5.5, fill: INK }, panR) }; });
  const qa = T(g1, "lab", 380, 448, "A DARK AGE?", 15, null, INK), qb = T(g1, "lab", 900, 448, "AN AGE OF FAITH?", 15, null, INK);
  const qa2 = T(g1, "lab", 380, 476, "SUPERSTITION AND CORRUPT PRIESTS", 12), qb2 = T(g1, "lab", 900, 476, "A EUROPE WHERE EVERYONE BELIEVED", 12);
  const g1b = G(), tl1 = line(g1b, "M200 470 H1080", { "stroke-width": 3 });
  const arc1 = line(g1b, "M200 470 Q640 30 1080 470", { stroke: MUSTARD, "stroke-width": 3 }), sun1 = el("circle", { r: 15, fill: MUSTARD }, g1b);
  const wash1 = el("path", { d: "M262 478 Q640 562 1018 478 Z", fill: STONE }, g1b);

  const noonLab = T(g1b, "lab", 640, 214, "ITS NOON", 14, null, INK), sickLab = T(g1b, "lab", 640, 556, "AND ITS SICKNESS", 14, null, INK);
  const draw1 = (t) => {
    const v = vis(t, 2.0, AT("question", 2, 0.45)); op(g1, v);
    if (v > 0) {

      move(panL, mix(330, 380, pk), 300 + 2 * Math.sin(t * 0.8)); op(panL, pk); move(panR, mix(950, 900, pr), 300 + 2 * Math.sin(t * 0.8 + 1)); op(panR, pr);
      op(night, 0.14 * pk); move(moon, -96, -50); op(moon, up(t, Q[0] + 0.3, 0.8));

      op(y1a, up(t, AT("question", 2, 0.35), 0.6) * fade); op(y1b, up(t, AT("question", 2, 0.45), 0.6) * fade);
    }
  };

  const houses = [300, 390, 890, 980].map((x) => { const g = G(g2); el("path", { d: "M-22 0 V-28 L0 -46 L22 -28 V0 Z", fill: "none", stroke: STONE, "stroke-width": 2.2, "stroke-linejoin": "round" }, g); g._x = x; return g; });
  const ICX = [440, 640, 840], ICY = 160;
  const icons = [G(g2), G(g2), G(g2)];
  el("path", { d: "M-22 -18 H22 Q20 2 0 6 Q-20 2 -22 -18 Z", fill: PAPER, stroke: INK, "stroke-width": 2.4, "stroke-linejoin": "round" }, icons[0]); el("path", { d: "M0 6 V22 M-12 22 H12", stroke: INK, "stroke-width": 2.4, fill: "none" }, icons[0]);
  el("path", { d: "M-15 -10 Q0 -2 15 -10", stroke: MUSTARD, "stroke-width": 2, fill: "none" }, icons[0]);
  el("circle", { cx: -9, cy: 0, r: 15, fill: "none", stroke: INK, "stroke-width": 2.6 }, icons[1]); el("circle", { cx: 9, cy: 0, r: 15, fill: "none", stroke: MUSTARD, "stroke-width": 2.6 }, icons[1]);
  el("path", { d: "M-26 18 Q0 2 26 18", stroke: INK, "stroke-width": 2.4, fill: "none" }, icons[2]); el("path", { d: "M0 8 V-24 M-10 -14 H10", stroke: INK, "stroke-width": 2.4, fill: "none" }, icons[2]);
  const icLab = ["BAPTIZED", "MARRIED", "BURIED"].map((s, i) => T(g2, "lab", ICX[i], 214, s, 13));
  const spokes = ICX.map((x, i) => line(g2, `M${x} 228 Q${(x + 640) / 2} ${i === 1 ? 250 : 236} 640 ${i === 1 ? 276 : 300}`, { stroke: LINE, "stroke-width": 2 }));
  const ticks2 = [...Array(10)].map((_, i) => { const x = 240 + i * 88 + (i >= 4 && i <= 5 ? (i === 4 ? -30 : 30) : 0); return { x, dot: el("circle", { cx: x, cy: 470, r: 4.5, fill: INK }, g2), arc: line(g2, `M${x} 466 Q${(x + 640) / 2} ${380 - Math.abs(x - 640) * 0.12} 640 ${x < 640 ? 412 : 412}`, { stroke: MUSTARD, "stroke-width": 1.6 }) }; });
  const walker = el("circle", { r: 8, fill: INK }, g2);
  const lifeLab = T(g2, "lab", 640, 512, "A WHOLE LIFE, AND EVERY IMPORTANT DAY", 13);
  const draw2 = (t) => {
    const v = vis(t, CS("village") - 0.3, CS("cluny") + 0.4); op(g2, v); if (v <= 0) return;
    move(ch2, 640, 470, 1.4); drawParts(ch2, t, CS("village") - 0.1, 0.25, 1.1);
    houses.forEach((h, i) => { move(h, h._x, 470 + 1.5 * Math.sin(t + i)); op(h, up(t, CS("village") + 0.4 + i * 0.2, 0.6)); });
    icons.forEach((g, i) => { const a = AT("village", 0, [0.08, 0.38, 0.68][i]); move(g, ICX[i], ICY + 3 * Math.sin(t * 0.9 + i)); op(g, up(t, a, 0.6)); op(icLab[i], up(t, a + 0.3, 0.6)); draw(spokes[i], up(t, a + 0.4, 0.9)); });
    const wk = up(t, Vl[1] - 0.2, Math.max(2.5, E("village", 1) - Vl[1] - 0.4)), wx = mix(200, 1080, wk);
    set(walker, { cx: fmt(wx), cy: fmt(458 - 3 * Math.abs(Math.sin(t * 5)) * (wk > 0 && wk < 1 ? 1 : 0)) }); op(walker, up(t, Vl[1] - 0.4, 0.4));
    ticks2.forEach((k) => { const on = clamp((wx - k.x) / 30); op(k.dot, on); draw(k.arc, clamp((wx - k.x) / 90)); op(k.arc, on * (0.7 + 0.3 * Math.sin(t * 2 + k.x))); });
    op(lifeLab, up(t, Vl[1] + 0.8, 0.6));
  };

  // ================= 3. Cluny: out of reach of crowns; priesthoods for sale; Acts 8:20 =================
  const Cl = Ls("cluny");
  const g3 = G(), MX = 400, MY = 450;
  const mon = G(g3); mon._parts = [line(mon, "M-120 0 V-70 H120 V0", { "stroke-width": 2.6 }), line(mon, "M-130 -70 L-118 -86 H118 L130 -70", { "stroke-width": 2.6 }),
    ...[-100, -60, -20, 20].map((x) => line(mon, `M${x} 0 V-28 Q${x + 14} -46 ${x + 28} -28 V0`, { stroke: STONE, "stroke-width": 2.2 })),
    line(mon, "M62 -86 V-150 H92 V-86", { "stroke-width": 2.6 }), line(mon, "M58 -150 L77 -176 L96 -150", { "stroke-width": 2.6 }), line(mon, "M77 -176 V-196 M70 -188 H84", { "stroke-width": 2.4 }), line(mon, "M-150 0 H150", { stroke: STONE, "stroke-width": 2 })];
  const ring3 = el("circle", { cx: MX, cy: 368, r: 176, fill: "none", stroke: MUSTARD, "stroke-width": 2.4, "stroke-dasharray": "7 8" }, g3);
  const clLab = T(g3, "lab", MX, 492, "CLUNY · 910", 15, null, INK), freeLab = T(g3, "lab", MX, 172, "NO KING OR LORD CONTROLS IT", 13);
  const lords = [[660, 230], [700, 380], [650, 530]].map(([x, y]) => { const g = crown(g3, STONE); const a = Math.atan2(368 - y, MX - x), d = Math.hypot(MX - x, 368 - y) - 176;
    return { g, x, y, reach: line(g3, `M${x + Math.cos(a) * 26} ${y + Math.sin(a) * 26} L${fmt(x + Math.cos(a) * (d - 6))} ${fmt(y + Math.sin(a) * (d - 6))}`, { stroke: STONE, "stroke-width": 2 }) }; });
  const MIT = [840, 960, 1080], mitres = MIT.map((x) => mitre(g3));
  const coins3 = [0, 1, 2, 3, 4, 5].map((i) => ({ g: coin(g3), m: i % 3, d: i * 0.22 }));
  const vcoins = [0, 1, 2, 3, 4, 5].map((i) => ({ g: coin(g3), a: Math.PI * (0.95 + 0.22 * i) + (i > 2 ? 0.25 : 0), d: i * 0.25, sx: MIT[i % 3] + (i > 2 ? 14 : -14) }));
  const simLab = T(g3, "ital", 960, 300, "simony", 54), soldLab = T(g3, "lab", 960, 500, "PRIESTHOODS BOUGHT AND SOLD", 13);

  const vLines3 = VL3.map((s, i) => T(vG3, "disp", 640, 186 + i * 52, s, 38)), vRef3 = T(vG3, "lab", 640, 290, "ACTS 8:20 · BEREAN STANDARD BIBLE", 14);

      const [x, y] = qPt(from.x + 10, from.y, (from.x + MIT[c.m]) / 2, Math.min(from.y, 380) - 70, MIT[c.m], 416, k);
      move(c.g, x, y); op(c.g, (k > 0 ? 1 : 0) * (1 - up(t, a + 1.0, 0.5))); });

    vcoins.forEach((c) => { const k = up(t, Cl[2] + 0.5 + c.d, 2.0), tx = 640 + Math.cos(c.a) * 100, ty = 450 + Math.sin(c.a) * 62;
      const sink = up(t, Cl[2] + 3.2 + c.d, 2.2);
      const [qx, qy] = qPt(c.sx, 430, 640 + (c.sx - 640) * 0.3, 318, tx, ty, k); move(c.g, qx, qy + 70 * sink + 1.5 * Math.sin(t * 2 + c.d * 9)); op(c.g, up(t, Cl[2] + 0.3 + c.d, 0.5) * (1 - sink)); });
    op(simLab, up(t, AT("cluny", 1, 0.5), 0.7) * (1 - vs)); op(soldLab, up(t, Cl[1] + 0.8, 0.6) * (1 - vs));
    vLines3.forEach((l, i) => op(l, up(t, Cl[2] + i * 1.6, 0.8))); op(vRef3, up(t, Cl[2] + 2.8, 0.7));
    const gk = up(t, Cl[2] + 0.6, 1.2); op(glow3, gk * (0.55 + 0.1 * Math.sin(t * 1.5))); set(glowRing, { r: fmt(44 + 4 * Math.sin(t * 1.2)) }); op(glowRing, gk * 0.7);
  };

  // ================= 4. Canossa: reform reaches the chair; the king waits at the gate; the chair rises =================
  const K = Ls("canossa");
  const g4 = G(), ch4 = chair(g4);
  const rise4 = line(g4, "M250 560 C330 520 420 470 588 400", { stroke: MUSTARD, "stroke-width": 2.6 });
