     voice; a crown in the dust and a ring set high; a bare cross with the same thin voice-lines rising.
     People are dots. God and Christ are never drawn. The piles of tiles are not a count.
     Book boundaries (client/public/bible/notes/psalms/intro.json, and the closing blessings at 41:13, 72:19,
     89:52, 106:48 in the site's text): gateway 1-2 inside Book One 1-41; 42-72; 73-89; 90-106; 107-150, whose
     last five psalms, 146-150, are the closing Hallelujah.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
