     and the Jesuits' arcs; three equal clusters of loss, the washes of war, 1648 and the ring that breaks;
     its pieces become three equal readings; and two strands, renewal and mourning, that reach every church.
     Violence is named in words and marked only by hollow rings and grey washes; nothing is pictured.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->

      babies.forEach((b) => { set(b.e, { cx: b.x, cy: fmt(b.y + 1.5 * Math.sin(t + b.i)) }); op(b.e, tv * up(t, CS("radical") + 0.2 + b.i * 0.03, 0.4) * (reb.some((r) => r.from === b && t > Rd[1] + 0.2 + r.j * 0.8) ? 0 : 1)); });
      const slide = up(t, Rd[2] - 0.2, 1.4), cx = mix(880, 640, slide), cy = 340; move(gC, cx, cy);
      bel.forEach((b) => { const a = AT("radical", 0, 0.45) + b.i * 0.32, k = up(t, a, 1.0); set(b.e, { cx: fmt(mix(420, b.x, k)), cy: fmt(b.y + 2 * Math.sin(t * 1.2 + b.i)) }); op(b.e, clamp(k * 3)); });
      reb.forEach((r) => { const a = Rd[1] + 0.2 + r.j * 0.8, k = up(t, a, 1.3), tx = cx + r.seat[0], ty = cy + r.seat[1];
        set(r.e, { cx: fmt(mix(r.from.x, tx, k)), cy: fmt(mix(r.from.y, ty, k) - Math.sin(k * Math.PI) * 40) }); op(r.e, t > a ? 1 : 0);
        const p = up(t, a + 1.3, 1.2); set(r.ring, { cx: fmt(tx), cy: fmt(ty), r: fmt(7 + 16 * p) }); op(r.ring, p > 0 && p < 1 ? 1 - p : 0); });
      move(raLab, cx, 172); op(raLab, up(t, Rd[0] + 0.2, 0.6)); move(anLab, cx, 200); op(anLab, up(t, AT("radical", 1, 0.5), 0.6));
      move(pfLab, cx, 510); op(pfLab, up(t, AT("radical", 0, 0.5), 0.6));
      const bk = up(t, Rd[2] + 1.0, 2.0), lx = mix(330, 480, bk), rx = mix(950, 800, bk); move(brL, lx, 340); move(brR, rx, 340); draw(brL, up(t, Rd[2] + 0.6, 0.8)); draw(brR, up(t, Rd[2] + 0.8, 0.8));
      set(caLab, { x: fmt(lx - 44) }); set(prtLab, { x: fmt(rx + 44) }); op(caLab, up(t, Rd[2] + 1.0, 0.6)); op(prtLab, up(t, Rd[2] + 1.2, 0.6));
    }
    op(deLab, span(t, Rd[3] + 0.6, Rd[4] + 0.9, 0.6, 0.5)); op(pmLab, span(t, AT("radical", 4, 0.55), CS("england") + 0.3, 0.6, 0.6));
  };

  const draw6 = (t) => {
    const v = vis(t, CS("england") - 0.2, En[1] + 0.3); op(g6, v); if (v > 0) {
      hall._parts.forEach((p, j) => draw(p, up(t, CS("england") - 0.1 + j * 0.2, 1.0)));
      op(romDot, up(t, En[0] + 0.4, 0.5)); op(romLab6, up(t, En[0] + 0.6, 0.5));
      const cut = up(t, AT("england", 0, 0.42), 1.2); draw(lnA, up(t, En[0] + 0.6, 1.0) * mix(1, 0.8, cut)); draw(lnB, up(t, En[0] + 0.9, 1.0) * mix(1, 0.8, cut)); op(nulLab, up(t, AT("england", 0, 0.45), 0.6));
      const dk = up(t, AT("england", 0, 0.66), 1.6); move(kc, 420, mix(180, 300, dk) + 3 * Math.sin(t * 1.1) * (1 - dk), 1.3); op(kc, up(t, CS("england") + 0.1, 0.6));
      op(heLab, up(t, En[0] + 0.4, 0.6)); op(hdLab, up(t, AT("england", 0, 0.75), 0.6));
    }
    const pv = vis(t, En[1] - 0.4, CS("trent") + 0.4); op(gPd, pv); if (pv <= 0) return;
    const deg = -28 * up(t, En[1] + 0.2, 1.6) + 56 * up(t, AT("england", 1, 0.33), 2.2) - 28 * up(t, En[2] + 0.2, 2.6) + 2.2 * Math.sin(t * 1.3) * (1 - up(t, En[2] + 1.6, 2.0)), a = (90 - deg) * Math.PI / 180;
    const bx = 640 + ROD * Math.cos(a), by = PIVY + ROD * Math.sin(a); set(rod, { x2: fmt(bx), y2: fmt(by) }); move(bob, 640 + (ROD + 28) * Math.cos(a), PIVY + (ROD + 28) * Math.sin(a), 1, -deg);
    const late = 1 - up(t, AT("england", 2, 0.62), 0.8);
    op(rod, late); op(pivDot, late); op(arcG, late * up(t, En[1] - 0.2, 0.6)); op(tRef, late * up(t, En[1] + 0.6, 0.6)); op(tRom, late * up(t, AT("england", 1, 0.4), 0.6));
    op(sonLab, late * up(t, En[1] + 1.0, 0.6)); op(maryLab, late * up(t, AT("england", 1, 0.45), 0.6)); maryR.forEach((r, i) => op(r, late * up(t, AT("england", 1, 0.8) + i * 0.2, 0.6)));
    op(elLab, late * up(t, En[2] + 0.4, 0.6)); op(midLab, late * up(t, En[2] + 2.0, 0.6));
    angl.forEach((o, i) => { const k = up(t, AT("england", 2, 0.66) + i * 0.12, 0.9); draw(o.ln, k); op(o.d, up(k, 0.8, 0.2)); set(o.d, { r: fmt(6 + 0.8 * Math.sin(t * 1.5 + i)) }); });
    op(angLab, up(t, AT("england", 2, 0.75), 0.6));
  };

  const draw7 = (t) => {
    const v = vis(t, CS("trent") - 0.2, Tr[1] + 0.3); op(g7, v); if (v > 0) {
      const tk = up(t, CS("trent") + 0.1, 1.2); set(table, { rx: fmt(200 * tk), ry: fmt(62 * tk) });
      seats.forEach((s) => { op(s.e, up(t, Tr[0] + 0.3 + s.i * 0.12, 0.4)); set(s.e, { cx: fmt(s.x), cy: fmt(s.y + 1.5 * Math.sin(t * 1.1 + s.i)) }); });
      move(tBook, 640, 368, 0.32 * up(t, Tr[0] + 0.6, 0.8)); tBook._lines.forEach((l, i) => draw(l, up(t, Tr[0] + 1.0 + i * 0.06, 0.5)));
      op(coLab, up(t, Tr[0] + 0.5, 0.6)); op(coLab2, up(t, AT("trent", 0, 0.6), 0.6));
    }
    const v2 = vis(t, Tr[1], TR_J + 0.3); op(g7b, v2); if (v2 > 0) {
      op(decree, up(t, Tr[1] + 0.1, 0.7)); decree._bars.forEach((b, i) => op(b, up(t, Tr[1] + 0.3 + i * 0.03, 0.4)));
      const at = [Tr[1] + 0.4, AT("trent", 1, 0.62), AT("trent", 1, 0.78), Tr[2] + 0.2, AT("trent", 2, 0.22)];
      rows.forEach((r, i) => { draw(r.ln, up(t, at[i], 0.5)); op(r.dot, up(t, at[i], 0.3)); op(r.lab, up(t, at[i] + 0.2, 0.6)); });
      draw(salv, up(t, AT("trent", 1, 0.85), 0.6)); op(salvLab, up(t, AT("trent", 1, 0.88), 0.6));
    }
    const v3 = vis(t, TR_J - 0.2, CS("cost") + 0.3); op(g7c, v3); if (v3 > 0) {
      op(jDot, up(t, TR_J, 0.5)); op(jLab, up(t, TR_J + 0.3, 0.6));
      jArcs.forEach((a, i) => draw(a, up(t, TR_J + 0.4 + i * 0.4, 1.4))); jEnds.forEach((e, i) => { op(e.d, up(t, TR_J + 1.6 + i * 0.4, 0.5)); op(e.l, up(t, TR_J + 1.8 + i * 0.4, 0.6)); });
      jTrav.forEach((j) => { const ph = ((t - TR_J - 1.6) / 3 + j.ph) % 1, [x, y] = j.side ? qPt(640, 330, 380, 150, 130, 380, ph) : qPt(640, 330, 900, 150, 1150, 380, ph); set(j.e, { cx: fmt(x), cy: fmt(y) }); op(j.e, t > TR_J + 1.6 ? Math.sin(ph * Math.PI) : 0); });
      waves.forEach((w, i) => { draw(w, up(t, TR_J + 1.0 + i * 0.2, 0.8)); w.setAttribute("transform", `translate(${fmt(4 * Math.sin(t * 1.2 + i))} 0)`); });
    }
  };

  const draw8 = (t) => {
    const v = vis(t, CS("cost") - 0.2, Co[1] + 0.2); op(g8, v); if (v > 0) {
      clusters.forEach((c, ci) => { c.dots.forEach((d) => { const k = up(t, CS("cost") + 0.2 + ci * 0.3 + d.i * 0.03, 0.5); op(d.e, k); set(d.e, { cy: fmt(d.y + 1.5 * Math.sin(t * 1.2 + d.i + ci)) }); op(d.r, 0); });
        c.lost.forEach((d, j) => { const a = AT("cost", 0, 0.3) + (j * 3 + ci) * 0.22, k = up(t, a, 0.9); op(d.e, (1 - k) * up(t, CS("cost") + 0.2 + ci * 0.3 + d.i * 0.03, 0.5)); op(d.r, k); }); op(c.lab, up(t, Co[0] + 0.2 + ci * 0.3, 0.6)); });
    }
    op(worLab, span(t, Co[1] + 0.3, AT("cost", 1, 0.42) + 0.3, 0.6, 0.5)); op(tywLab, span(t, AT("cost", 1, 0.42) + 0.3, Co[2] - 0.1, 0.6, 0.5));
    op(y1648, span(t, AT("cost", 1, 0.78), Co[2] + 0.4, 0.7, 0.6));
  };

  // the ring of Western Christianity: whole, broken, then its pieces carried to the three readings
  const drawRing = (t) => {
    const v = span(t, Co[2] - 0.4, CS("close") + 0.3, 0.6, 0.7); op(g8r, v); op(g9, vis(t, CS("readings") - 0.2, CS("close") + 0.3)); if (v <= 0) return;
    const brk = up(t, AT("cost", 2, 0.45), 1.6), go = up(t, CS("readings") - 0.3, 2.2);
    op(wcLab, span(t, Co[2] - 0.1, CS("readings") + 0.2, 0.6, 0.6));
    PIECES.forEach((p, i) => { const [pan, b0, b1] = TARGET[i], m = p.mid * Math.PI / 180, dr = 34 * brk;
      const cx0 = 640 + dr * Math.cos(m), cy0 = 330 + dr * Math.sin(m), rot = p.rot * brk, spin = 6 * Math.sin(t * 0.4 + pan * 2) * go;
      const cx = mix(cx0, PAN[pan], ease(go)), cy = mix(cy0, PY9, ease(go)), r = mix(150, PR, go), a0 = mix(p.a0 + rot, b0, go) + spin, a1 = mix(p.a1 + rot, b1, go) + spin;
      p.e.setAttribute("d", arcD(cx, cy, r, a0, a1)); draw(p.e, up(t, Co[2] - 0.4, 0.9)); p.e.setAttribute("stroke-width", fmt(mix(4, 3, go))); });
    if (go <= 0) return;
    const at = [Rg[0] + 0.2, Rg[1] + 0.2, Rg[2] + 0.2], sub = [[0.42, 0.62, 0.8], [0.3, 0.55, 0.7], [0.3, 0.6, 0.85]];
    em.forEach((g, p) => { move(g, PAN[p], PY9 + 2 * Math.sin(t * 0.9 + p)); op(g, up(t, at[p], 0.8)); });
    pBook._lines.forEach((l, i) => draw(l, up(t, at[0] + 0.4 + i * 0.07, 0.6)));
    const fk = up(t, at[2] + 1.0, 1.4); set(fNew, { cx: fmt(mix(70, 0, fk)), cy: fmt(-24 * (1 - fk) + 0) }); op(fNew, up(t, at[2] + 0.8, 0.5));
    txt9.forEach((ls, p) => ls.forEach((e, j) => op(e, up(t, j ? AT("readings", p, sub[p][j - 1]) : at[p] + 0.3, 0.6))));
  };

  const draw10 = (t) => {
    const v = span(t, CS("close") - 0.2, END + 2.5, 0.7, 0.9); op(g10, v); if (v <= 0) return;
    draw(tl10, up(t, CS("close"), 1.2)); set(br10, { width: fmt(220 * up(t, Cl[0] - 0.2, 1.2)) }); op(c10a, up(t, Cl[0], 0.6)); op(c10b, up(t, Cl[0] + 0.4, 0.6)); op(today, up(t, Cl[0] + 1.6, 0.6));
    ch10.forEach((g, i) => { g._parts.forEach((p, j) => draw(p, up(t, Cl[0] + 0.4 + i * 0.25 + j * 0.15, 0.9))); move(g, CX10[i], 404 + 2 * Math.sin(t * 0.8 + i), 0.55); });
    ren.forEach((p, i) => draw(p, up(t, Cl[1] + 0.2 + i * 0.15, 1.8))); mou.forEach((p, i) => draw(p, up(t, AT("close", 1, 0.32) + i * 0.15, 1.8)));
    op(renLab, up(t, Cl[1] + 0.8, 0.6)); op(mouLab, up(t, AT("close", 1, 0.4), 0.6));
    const pulse = up(t, Cl[2] - 0.2, 0.8); [...ren, ...mou].forEach((p, i) => p.setAttribute("stroke-width", fmt(2.4 + pulse * (0.8 + 0.6 * Math.sin(t * 2 + i)))));
  };

  F.title("The Reformation");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.9);
  return (t) => { draw1(t); draw2(t); drawG(t); drawMap(t); draw5(t); draw6(t); draw7(t); draw8(t); drawRing(t); draw10(t); };
});
