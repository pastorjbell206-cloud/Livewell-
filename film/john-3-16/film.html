    const looking = up(t, at("serpent", 1, 0.62), 1.0), upward = up(t, at("serpent", 2, 0.45), 1.6);

    const toSmall = up(t, O0 - 0.3, 1.4), toCenter = up(t, O2 - 0.3, 1.8);

    op(crossGlow, (0.1 * up(t, at("lifted", 1, 0.62), 1.4) * (1 - up(t, O0, 1)) + 0.11 * up(t, O2 + 0.6, 1.6)) * (0.9 + 0.1 * Math.sin(t * 1.7)));

    op(gLook, span(t, at("lifted", 2, 0.25), O0 - 0.1, 0.6));

    op(labGH, up(t, at("so", 1, 0.55), 0.6)); draw(back, up(t, at("so", 1, 0.8), 1.4)); op(backHead, up(t, at("so", 1, 0.8) + 1.2, 0.4));

    op(labSize, span(t, G1 - 0.1, G2 + 0.1, 0.5)); op(labHost, span(t, at("world", 1, 0.5), G2 + 0.1, 0.5));

    const trIn = up(t, V0 - 0.3, 0.7), trOut = 1 - up(t, V1 - 0.4, 0.7);
