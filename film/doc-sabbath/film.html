<!-- "A day to stop" (doctrine film: the Sabbath). One continuous picture in ten scenes: a week of seven days,
     with Saturday, Sunday and a wandering day off ringed in turn; the seventh day singled out, sunset Friday to
     sunset Saturday, and a rolling dot that comes to a stop (shabbat); the six days of creation filling with
     work while the seventh stays open, blessed, with no evening and morning beneath it; the seventh day tied
     with a ribbon, manna falling on six days and twice on the sixth, and a wall of bricks for Pharaoh that
     learns to leave a gap; Sinai, two tablets and the long command unrolled, Exodus 20:8, the two grounds
     (creation and the rescue from slavery), and a whole household sitting down to rest; the synagogue, the
     arguments in the Gospels, a bent woman standing straight, the scale of Jewish teaching, and a crown over
     the seventh day; the tomb over the Sabbath, the stone rolled away at dawn on the first day, Ignatius
     around 110 and Saturday kept alongside Sunday; four identical panels for the four views, under one cross
     and over one line; a gear that stops, a world that turns without anyone holding it up, unfinished work,
     and the people who work, sell and serve sitting down in turn; and a weary walker who lays down a burden
     by a light that does not set, under Matthew 11:28.
     God and Christ are never drawn: a light, a crown, a cross and an empty tomb stand for them.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
<html lang="en"><head><meta charset="utf-8"><title>A day to stop</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));
  const CS = (id) => CH[id].start;
  const A = (id, k, f) => S(id, k) + (E(id, k) - S(id, k)) * f;          // a moment f of the way through line k
  const T = (p, cls, x, y, s, size, anchor, fill) => { const e = txt(p, cls, x, y, s, size, fill ? { fill } : undefined); if (anchor) e.setAttribute("style", (e.getAttribute("style") || "") + `text-anchor:${anchor};`); return e; };
  const G = (p) => el("g", {}, p || world);
  const R = rng(61);
  const f1 = (v) => v.toFixed(1);
  const drf = (e, k, o = 1) => { draw(e, k); op(e, k > 0.002 ? o : 0); };   // draw a line, hidden until it starts
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const cmix = (a, b, k) => { const P = hex(a), Q = hex(b); return "#" + P.map((v, i) => Math.round(mix(v, Q[i], clamp(k))).toString(16).padStart(2, "0")).join(""); };
  const outC = (k) => 1 - Math.pow(1 - clamp(k), 3);
  const rrD = (x, y, w, h, r) => `M${x + r} ${y} H${x + w - r} Q${x + w} ${y} ${x + w} ${y + r} V${y + h - r} Q${x + w} ${y + h} ${x + w - r} ${y + h} H${x + r} Q${x} ${y + h} ${x} ${y + h - r} V${y + r} Q${x} ${y} ${x + r} ${y} Z`;
  const SCR = (id) => window.SCRIPT.chapters.find((c) => c.id === id).scripture;
  // a day: a tile with a fill and an edge that draws itself, centred on 0,0
  const day = (parent, w, h) => { const g = G(parent); const fill = el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 10, fill: PAPER }, g); const edge = line(g, rrD(-w / 2, -h / 2, w, h, 10), { "stroke-width": 2.6 }); return { g, fill, edge }; };
  // a person: legs, body, arms, a head. No face. Feet at x,y.
  const fig = (parent) => { const g = G(parent); const body = el("path", { fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round" }, g); const head = el("circle", { r: 7, fill: INK }, g); return { g, body, head }; };
  const pose = (p, x, y, o = {}) => {
    const s = o.s || 1, b = o.bend || 0, st = o.sit || 0, ar = o.arm || 0, dir = o.dir || 1, sw = o.stride || 0;
    const hipY = y - mix(24, 7, st) * s, hipX = x - st * 6 * s * dir;
    const fa = mix(x - 7 * s + sw * 6 * s, hipX + 20 * s * dir, st), fb = mix(x + 7 * s - sw * 6 * s, hipX + 28 * s * dir, st);
    const a = b * 1.25, L = 25 * s, sx = hipX + Math.sin(a) * L * dir, sy = hipY - Math.cos(a) * L;
    const hx = sx + Math.sin(a) * 10 * s * dir, hy = sy - Math.cos(a) * 10 * s;
    const t1 = mix(Math.PI - 0.3, 0.22, ar), t2 = mix(Math.PI + 0.2, -0.22, ar), al = 18 * s;
    const h1x = sx + Math.sin(t1) * al * dir, h1y = sy - Math.cos(t1) * al, h2x = sx + Math.sin(t2) * al * dir, h2y = sy - Math.cos(t2) * al;
    p.body.setAttribute("d", `M${f1(fa)} ${f1(y)} L${f1(hipX)} ${f1(hipY)} L${f1(fb)} ${f1(y)} M${f1(hipX)} ${f1(hipY)} L${f1(sx)} ${f1(sy)} M${f1(h1x)} ${f1(h1y)} L${f1(sx)} ${f1(sy)} L${f1(h2x)} ${f1(h2y)}`);
    p.body.setAttribute("stroke-width", f1(3.4 * Math.sqrt(s)));

  };
  // an animal: body, four legs, a head with horns or ears. Feet at x,y; rest folds the legs.
  const beast = (parent, horns) => { const g = G(parent); const p = el("path", { fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, g); return { g, p, horns }; };
  const poseBeast = (bt, x, y, rest, s = 1, dir = 1) => {
    const lh = mix(20, 3, rest), top = -lh - 18;
    const d = `M-23 ${-lh} V${top + 4} Q-23 ${top} -19 ${top} H19 Q23 ${top} 23 ${top + 4} V${-lh} Z M-17 ${-lh} V0 M-9 ${-lh} V0 M9 ${-lh} V0 M17 ${-lh} V0 `

  // light: a disc with a soft halo and rays that draw themselves

    return { g, rays }; };
  // an open book
  const pageD = (s) => `M0 -50 C${-40 * s} -70 ${-110 * s} -70 ${-150 * s} -55 L${-150 * s} 55 C${-110 * s} 40 ${-40 * s} 40 0 60 Z`;
  const book = (parent) => { const g = G(parent); [1, -1].forEach((s) => el("path", { d: pageD(s), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, g));
    const ls = []; [1, -1].forEach((s) => [-28, -10, 8, 26].forEach((dy) => ls.push(line(g, `M${-22 * s} ${dy - 8} C${-60 * s} ${dy - 20} ${-100 * s} ${dy - 20} ${-132 * s} ${dy - 10}`, { stroke: STONE, "stroke-width": 2.6 })))); g._ls = ls; return g; };
  const gearD = (r, n, tooth) => { let d = ""; for (let i = 0; i < n * 2; i++) { const a0 = i * Math.PI / n, a1 = (i + 1) * Math.PI / n, q = i % 2 ? r : r + tooth; d += `${i ? "L" : "M"}${f1(Math.cos(a0) * q)} ${f1(Math.sin(a0) * q)} L${f1(Math.cos(a1) * q)} ${f1(Math.sin(a1) * q)} `; } return d + "Z"; };
  const qpt = (p0, p1, p2, k) => [(1 - k) * (1 - k) * p0[0] + 2 * (1 - k) * k * p1[0] + k * k * p2[0], (1 - k) * (1 - k) * p0[1] + 2 * (1 - k) * k * p1[1] + k * k * p2[1]];

  // ================= the week: seven days that carry scenes 1 to 4 =================
  const WX = (i) => 250 + i * 130, WY = 330, TW = 96, TH = 120;
  const Q0 = S("question", 0), Q1 = S("question", 1);
  const W0 = S("what", 0), W1 = S("what", 1), W2 = S("what", 2);
  const C0 = S("creation", 0), C1 = S("creation", 1), C2 = S("creation", 2);
  const M0 = S("manna", 0), M1 = S("manna", 1), M2 = S("manna", 2);
  const gW = G();
  const halo7 = G(gW); el("circle", { r: 112, fill: MUSTARD, opacity: 0.09 }, halo7); el("circle", { r: 82, fill: MUSTARD, opacity: 0.15 }, halo7);
  const NAMES = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const GLY = [
    ["M-9 6 A9 9 0 1 1 9 6 A9 9 0 1 1 -9 6", "M-22 6 H-15 M15 6 H22 M0 -16 V-9 M0 21 V28 M-15 -9 L-11 -5 M15 -9 L11 -5 M-15 21 L-11 17 M15 21 L11 17"],
    ["M-30 -2 Q-22 -9 -15 -2 T0 -2 T15 -2 T30 -2", "M-30 22 Q-22 15 -15 22 T0 22 T15 22 T30 22"],
    ["M-34 30 Q-12 6 10 18 T34 30", "M0 18 V-12 M0 2 Q-10 -2 -13 -10 M0 -4 Q10 -8 13 -16"],
    ["M-22 6 A8 8 0 1 1 -6 6 A8 8 0 1 1 -22 6", "M16 -8 A12 12 0 1 0 16 18 A9 9 0 1 1 16 -8"],
    ["M-28 -8 Q-22 -15 -15 -8 Q-8 -15 -1 -8", "M-8 20 Q4 10 16 20 Q4 30 -8 20 M16 20 L25 13 L25 27 Z"],
    ["M-34 16 Q-34 6 -24 6 H-10 Q-6 6 -5 0 M-31 16 V30 M-12 16 V30 M-34 16 H-10 V6", "M12 30 L18 12 L24 30 M18 12 V-4 M11 2 L25 2 M18 -9 m-5 0 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0"],
  ];
  const tiles = NAMES.map((n, i) => {
    const d = day(gW, TW, TH); d.name = T(d.g, "lab", 0, -34, n, 13); d.num = T(d.g, "lab", 0, -34, String(i + 1), 15);
    d.gl = i < 6 ? GLY[i].map((p) => line(d.g, p, { "stroke-width": 2.4 })) : [];
    const n2 = i === 5 ? 10 : i === 6 ? 0 : 5;
    d.heap = [...Array(n2)].map((_, j) => { const row = j < 6 ? 0 : 1, cnt = row ? 4 : Math.min(n2, 6), col = row ? j - 6 : j; return { x: (col - (cnt - 1) / 2) * 8.5, y: 47 - row * 7.5, d: R(), late: j >= 5 && i === 5, e: el("circle", { r: 3.6, fill: INK }, d.g) }; });
    return d; });
  const rib = [line(tiles[6].g, "M26 -60 V60", { stroke: MUSTARD, "stroke-width": 3 }), line(tiles[6].g, "M-48 14 H48", { stroke: MUSTARD, "stroke-width": 3 }), line(tiles[6].g, "M26 -60 C10 -82 -6 -66 26 -60 C58 -54 44 -80 26 -60", { stroke: MUSTARD, "stroke-width": 3 })];
  const drawW = (t) => {
    const v = span(t, Q0 - 0.3, CS("sinai") + 0.5, 0.5, 0.8); op(gW, v); if (v <= 0) return;
    const sel = up(t, W0 + 0.4, 0.9) * (1 - up(t, CS("creation") + 0.1, 0.8));      // the seventh day singled out
    const holy = up(t, A("creation", 0, 0.72), 1.0);                                    // blessed and holy, from creation on
    const fri = span(t, W1 - 0.1, W2, 0.5);
    tiles.forEach((d, i) => {
      const k = up(t, Q0 + i * 0.18, 0.8);
      drf(d.edge, k); op(d.fill, k);
      move(d.g, WX(i), WY - (i === 6 ? 12 * sel : 0) + 1.5 * Math.sin(t * 0.9 + i));
      const dim = i === 6 ? 1 : 1 - 0.65 * sel + (i === 5 ? 0.4 * fri : 0);
      d.g.setAttribute("opacity", dim.toFixed(3));
      d.fill.setAttribute("fill", i === 6 ? cmix(PAPER, WARM, Math.max(sel, holy)) : PAPER);
      op(d.name, up(t, Q0 + 0.5 + i * 0.18, 0.6) * (1 - up(t, CS("creation") + 0.1, 0.5)));
      op(d.num, up(t, CS("creation") + 0.6, 0.5));
      const gOut = 1 - up(t, CS("manna") + 0.1, 0.7);
      d.gl.forEach((g, j) => { const gk = up(t, C0 + 0.1 + i * 0.45 + j * 0.25, 0.6); draw(g, gk); op(g, (gk > 0.002 ? 1 : 0) * gOut); });
      d.heap.forEach((h) => { const a = M1 + 0.2 + i * 0.5 + h.d * 0.4 + (h.late ? 0.7 : 0), hk = up(t, a, 0.9); op(h.e, hk > 0.002 ? 1 : 0); set(h.e, { cx: f1(h.x), cy: f1(mix(-220, h.y, ease(hk))) }); });
    });
    rib.forEach((r, j) => drf(r, up(t, A("manna", 0, 0.3) + j * 0.3, 0.7)));
    op(halo7, holy * (0.85 + 0.15 * Math.sin(t * 1.3))); move(halo7, WX(6), WY, 1 + 0.04 * Math.sin(t * 1.1));
  };

  // ================= 1. the question: Saturday, Sunday, a day off =================
  const g1 = G();
  const ringD = (x) => rrD(x - 62, WY - 72, 124, 144, 16);
  const ringSat = line(g1, ringD(WX(6)), { stroke: STONE, "stroke-width": 2.4 }), ringSun = line(g1, ringD(WX(0)), { stroke: STONE, "stroke-width": 2.4 });
  const labSat = T(g1, "lab", WX(6), 244, "SATURDAY?", 14), labSun = T(g1, "lab", WX(0), 244, "SUNDAY?", 14);
  const wander = el("circle", { r: 66, fill: "none", stroke: STONE, "stroke-width": 2.2, "stroke-dasharray": "6 7" }, g1), labOff = T(g1, "lab", 0, 244, "A DAY OFF?", 14);
  const qm = T(g1, "disp", 640, 222, "?", 110, null, MUSTARD);
  const draw1 = (t) => {
    const v = span(t, Q0 - 0.2, CS("what") + 0.4, 0.5, 0.7); op(g1, v); if (v <= 0) return;
    const out = 1 - up(t, Q1 - 0.2, 0.6);
    const a1 = A("question", 0, 0.36), a2 = A("question", 0, 0.53), a3 = A("question", 0, 0.70);
    drf(ringSat, up(t, a1, 0.8), out); op(labSat, up(t, a1 + 0.2, 0.5) * out);
    drf(ringSun, up(t, a2, 0.8), out); op(labSun, up(t, a2 + 0.2, 0.5) * out);

    set(wander, { cx: f1(wx), cy: WY, "stroke-dashoffset": f1(-t * 6) }); op(wander, wk * out); labOff.setAttribute("x", f1(wx)); op(labOff, wk * out);
    op(qm, up(t, Q1 + 0.3, 0.8)); qm.setAttribute("y", f1(232 - 10 * up(t, Q1 + 0.3, 2.4)));
  };

  // ================= 2. what it is: the seventh day, sunset to sunset, shabbat =================
  const g2 = G(), SY = 452;
  const clip2 = el("clipPath", { id: "hz2" }, g2); el("rect", { x: -30, y: -40, width: 60, height: 40 }, clip2);
  const brk = line(g2, `M${WX(5) + 24} ${SY - 14} V${SY} H${WX(6) + 24} V${SY - 14}`, { stroke: INK, "stroke-width": 2.4 });
  const suns2 = [WX(5) + 24, WX(6) + 24].map((x) => { const g = G(g2); const disc = el("path", { d: "M-14 0 A14 14 0 0 1 14 0 Z", fill: MUSTARD, "clip-path": "url(#hz2)" }, g); el("line", { x1: -24, x2: 24, y1: 0, y2: 0, stroke: INK, "stroke-width": 2.2 }, g); move(g, x, SY + 32); return { g, disc }; });
  const lab2a = T(g2, "lab", WX(6), 226, "THE SEVENTH DAY", 14);

  const word = T(g2, "ital", 640, 204, "shabbat", 66), lab2c = T(g2, "lab", 640, 240, "TO STOP, MORE THAN TO RELAX", 14);
  const draw2 = (t) => {
    const v = span(t, CS("what"), CS("creation") + 0.4, 0.5, 0.7); op(g2, v); if (v <= 0) return;

    set(roller, { cx: f1(rx), cy: 446 }); op(roller, up(t, W2 + 0.4, 0.4));
    op(word, up(t, W2 + 0.1, 0.8)); word.setAttribute("y", f1(210 - 6 * up(t, W2 + 0.1, 2.5))); op(lab2c, up(t, A("what", 2, 0.55), 0.6));
  };

  // ================= 3. creation: six days of work, the seventh blessed, no evening and morning =================
  const g3 = G();
  const temple = el("path", { d: "M588 240 V188 L640 160 L692 188 V240 Z M604 240 V198 M624 240 V198 M656 240 V198 M676 240 V198 M580 188 H700", fill: "none", stroke: STONE, "stroke-width": 2.2, "stroke-dasharray": "5 5" }, g3);
  const lab3a = T(g3, "lab", WX(6), 250, "BLESSED · HOLY", 14);
  const lab3b = T(g3, "lab", 640, 126, "THE FIRST THING IN SCRIPTURE CALLED HOLY", 14);
  const lab3c = T(g3, "lab", 640, 262, "NOT A PLACE", 13);
  const arcs3 = [0, 1, 2, 3, 4, 5].map((i) => ({ p: [[WX(i) - 36, 404], [WX(i), 448], [WX(i) + 36, 404]], e: line(g3, `M${WX(i) - 36} 404 Q${WX(i)} 448 ${WX(i) + 36} 404`, { stroke: STONE, "stroke-width": 2.2 }), d: el("circle", { r: 4.5, fill: INK }, g3) }));
  const endless3 = el("path", { d: `M${WX(6) - 36} 412 H1300`, stroke: STONE, "stroke-width": 2.6, "stroke-dasharray": "2 11", "stroke-linecap": "round", fill: "none" }, g3);
  const lab3e = T(g3, "lab", (WX(0) + WX(5)) / 2, 482, "EVENING AND MORNING", 13), lab3f = T(g3, "lab", WX(6), 482, "NO EVENING AND MORNING", 13);
  const draw3 = (t) => {

  const g4 = G();

  const lab4b = T(g4, "lab", WX(5), 428, "TWICE", 13), lab4c = T(g4, "lab", WX(6), 428, "NONE", 13);

  const lab4d = T(g4, "lab", 640, 562, "BRICKS FOR PHARAOH, WITHOUT REST", 14), lab4e = T(g4, "lab", 640, 562, "LEARNED TO STOP", 14);
  const draw4 = (t) => {
    const v = span(t, CS("manna"), CS("sinai") + 0.5, 0.5, 0.8); op(g4, v); if (v <= 0) return;
