     ('El 'Elyon, 'El Ro'i, 'El Shaddai, 'El 'Olam) whose lines meet in one light; the burning bush, I AM WHO I AM,
     the four letters of the personal name as the file gives them and LORD in small capitals, hayah and "I will
     surely be with you"; Sinai, where the character words gather into the name; a scroll where the reader
     does not speak the name, the scribes' vowels of 'Adonai and HaShem, then Hebrew, Greek and the church;
     Yeshua and Jesus, "Jesus is Lord" and kyrios, Joel and Romans joined by one line; two equal panels for
     the two readings of I AM, none chosen; a name to call on, the Lord's Prayer's order, Exodus 20:7 with the
     tablets, four misuses the name may not back; and a crowd before the light with a name on every one.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->

  const MIS = [["A FALSE OATH", 250], ["A CRUELTY", 510], ["A PARTY", 770], ["A NATION'S CAUSE", 1030]].map(([s, x], i) => { const g = G(g9); el("rect", { x: -112, y: -38, width: 224, height: 76, rx: 6, fill: WARM, stroke: INK, "stroke-width": 2 }, g); T(g, "lab", 0, 6, s, 13, null, INK); move(g, x, 420);
    return { g, x, i, reach: line(g9, `M640 290 L${mix(640, x, 0.62)} ${mix(290, 382, 0.62)}`, { stroke: STONE, "stroke-width": 2 }), bar: el("line", { stroke: INK, "stroke-width": 3, "stroke-linecap": "round" }, g9) }; });

  const draw9 = (t) => {
    const v = span(t, CS("life") - 0.2, CS("close") + 0.9, 0.7, 0.8); op(g9, v); if (v <= 0) return;
    const o1 = 1 - up(t, C1 - 0.3, 0.7);

    draw(prLine, 1); op(prLine, up(t, S("life", 0) + 0.3, 1.2) * o1);
    prDots.forEach((d, i) => { const ph = (((t - S("life", 0)) * 0.35 + i / 4) % 1 + 1) % 1, k = ph, x = (1 - k) * (1 - k) * 380 + 2 * (1 - k) * k * 600 + k * k * 820, y = (1 - k) * (1 - k) * 470 + 2 * (1 - k) * k * 440 + k * k * 300; set(d, { cx: x.toFixed(1), cy: y.toFixed(1) }); op(d, up(t, S("life", 0) + 1.2, 0.5) * Math.sin(ph * Math.PI) * o1); });
    const uk = span(t, AT("life", 0, 0.4), AT("life", 0, 0.78), 0.6, 0.5); move(unk, 880, 270 + 3 * Math.sin(t * 0.7)); op(unk, uk); op(unkL, uk);
    const nk = up(t, AT("life", 0, 0.75), 0.8); move(nTag, 890, 268 + 3 * Math.sin(t * 0.8), mix(0.8, 1, nk)); op(nTag, nk * o1); draw(nTag._string, up(t, AT("life", 0, 0.8), 0.7)); op(nTagL, up(t, AT("life", 0, 0.85), 0.6) * o1);
    const o2 = 1 - up(t, C2 - 0.4, 0.7);
    op(hal, up(t, C1 + 0.4, 0.8) * o2); op(halR, up(t, C1 + 0.9, 0.6) * o2);
    cards.forEach((c, i) => { const k = up(t, AT("life", 1, 0.3 + i * 0.13), 0.7); op(c, k * o2); c.setAttribute("transform", `translate(${[360, 640, 920][i]} ${(330 + 8 * (1 - k)).toFixed(1)})`); });
    cArr.forEach((a, i) => { draw(a, up(t, AT("life", 1, 0.38 + i * 0.13), 0.5)); op(a, o2); });
    const tk = up(t, AT("life", 1, 0.8), 0.9), tout = up(t, AT("life", 3, 0.26), 0.7); move(tabs, 640, 480 + 2 * Math.sin(t * 0.7), mix(0.85, 1, tk)); op(tabs, tk * (1 - tout));
    third.setAttribute("fill", t > AT("life", 2, 0.15) ? MUSTARD : STONE);
    const o3 = 1 - up(t, C3 - 0.3, 0.6);
    vx.forEach((l, i) => op(l, up(t, C2 + i * 1.6, 0.8) * o3)); op(vxR, up(t, C2 + 0.6, 0.6) * o3);

    MIS.forEach((m) => { const a = AT("life", 3, 0.42 + m.i * 0.12), k = up(t, a, 0.6); op(m.g, k * o4); m.g.setAttribute("transform", `translate(${m.x} ${(420 + 8 * (1 - k)).toFixed(1)})`);
      draw(m.reach, up(t, a + 0.3, 0.6)); op(m.reach, up(t, a + 0.3, 0.2) * o4);
      const ex = mix(640, m.x, 0.62), ey = mix(290, 382, 0.62), dx = m.x - 640, dy = 92, len = Math.hypot(dx, dy), nx = -dy / len * 14, ny = dx / len * 14;
      set(m.bar, { x1: (ex + nx).toFixed(1), y1: (ey + ny).toFixed(1), x2: (ex - nx).toFixed(1), y2: (ey - ny).toFixed(1) }); op(m.bar, up(t, a + 0.85, 0.4) * o4); });

  };

  // ================= 10. the close: a crowd before the light, and His name on every one =================
  const Z1 = S("close", 1), Z2 = S("close", 2), END = F.VOICE_END;
  const g10 = G(), light = G(g10), lGlow = glow(light, 100, 6, MUSTARD, 0.08); el("circle", { r: 16, fill: MUSTARD }, light);
  const rays = [...Array(12)].map((_, i) => { const a = (i / 12) * Math.PI * 2; return line(light, `M${Math.cos(a) * 34} ${Math.sin(a) * 34} L${Math.cos(a) * 62} ${Math.sin(a) * 62}`, { stroke: MUSTARD, "stroke-width": 2.4 }); });
  const people = crowd(g10, 54, 77);
  const rv = [T(g10, "disp", 640, 162, "They will see His face,", 42), T(g10, "disp", 640, 210, "and His name will be on their foreheads.", 42)], rvR = T(g10, "lab", 640, 246, "REVELATION 22:4 · BEREAN STANDARD BIBLE", 13);
  const maxD = Math.max(...people._d.map((d) => d.d));
  const draw10 = (t) => {

      set(p.e, { cx: x.toFixed(1), cy: y.toFixed(1) }); op(p.e, k);

    rv.forEach((l, i) => op(l, up(t, Z1 - 0.1 + i * 1.2, 0.8))); op(rvR, up(t, Z1 + 0.8, 0.6));
  };

  F.title("A name you can call on");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.9);
  return (t) => { draw1(t); draw2(t); draw3(t); draw4(t); draw5(t); draw6(t); draw7(t); draw8(t); draw9(t); draw10(t); };
