<!doctype html>
<!-- "Read the verse next door" (Philippians 4:12-13). The verse hangs as a poster on a gym wall, then shrinks
     back to its real place: one line on the page of a letter, with the line above it lit. A prison window
     and a chain say where the letter was written. Days are bars above and below a level line: full days up,
     hungry days down, and one steady line through all of them.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
<html lang="en"><head><meta charset="utf-8"><title>Read the verse next door</title></head><body>
<script src="../lib/engine.js"></script>
<script>

  el("path", { d: "M-40 -52 H40 V-20 Q40 20 0 24 Q-40 20 -40 -20 Z M-8 22 V44 H-28 V56 H28 V44 H8 V22 Z", fill: WARM, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, trophy);
  const tStrike = line(world, "M0 0", { stroke: STONE, "stroke-width": 3 }), wantLab = txt(world, "lab", 1064, 262, "WHAT YOU WANT");

  const windowP = line(gCell, "M930 150 H1070 V300 H930 Z", { "stroke-width": 3 }), bars = [958, 986, 1014, 1042].map((x) => line(gCell, `M${x} 150 V300`, { "stroke-width": 3 }));
  const paul = el("circle", { cx: 950, cy: 424, r: 17, fill: INK }, gCell), links = [...Array(6)].map((_, i) => el("ellipse", { cx: 984 + i * 22, cy: 432 + (i % 2) * 5, rx: 13, ry: 7.5, fill: "none", stroke: INK, "stroke-width": 3 }, gCell));
  const bolt = el("circle", { cx: 1118, cy: 437, r: 7, fill: INK }, gCell);

  const nv1 = txt(gNext, "disp", 640, 214, "“" + nt.slice(0, ncut + 1), 48), nv2 = txt(gNext, "disp", 640, 272, nt.slice(ncut + 2) + "”", 48), nref = txt(gNext, "lab", 640, 322, REF(SC["next-door"]));
  const bowl = (x, full) => { const g = el("g", {}, gNext); if (full) el("path", { d: "M-34 0 Q0 -44 34 0 Z", fill: STONE }, g); el("path", { d: "M-44 0 H44 Q40 40 0 40 Q-40 40 -44 0 Z", fill: full ? INK : BONE, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, g); move(g, x, 430); return g; };
  const coins = (x, n) => { const g = el("g", {}, gNext); for (let i = 0; i < Math.max(n, 1); i++) el("ellipse", { cx: (i % 2) * 6 - 3, cy: 34 - i * 13, rx: 34, ry: 10, fill: n ? MUTED : "none", stroke: n ? INK : STONE, "stroke-width": n ? 2.5 : 2, ...(n ? {} : { "stroke-dasharray": "4 5" }) }, g); move(g, x, 430); return g; };
  const icons = [bowl(400, true), bowl(560, false), coins(720, 5), coins(880, 0)];

  // ---------- 5 and 6: full days, hungry days, one level line ----------
  const gDays = el("g", {}, world), BASE = 330;
  const H = [90, 52, -64, 112, -42, -92, 72, 34, -112, 62, -52, 102, -72, 44];

  const level = line(gDays, "M236 330 H1044", { stroke: MUSTARD, "stroke-width": 5 }), steady = el("circle", { cy: BASE, r: 11, fill: MUSTARD, stroke: BONE, "stroke-width": 3 }, gDays);
  const enough = txt(gDays, "lab", 1112, 336, "ENOUGH"), labFull = txt(gDays, "lab", 180, 262, "FULL DAYS"), labHungry = txt(gDays, "lab", 180, 408, "HUNGRY DAYS");

  const rowBox = (i) => ({ x: 414, y: ROWY(i) - 13, w: 452, h: 26 });
  return ((draw0) => { F.title("Read the verse next door", 68); F.endCard(SC.close.titleCard, END + 0.7); return draw0; })((t) => {
    // gym
    const gv = 1 - up(t, B0 - 0.5, 0.6); op(gGym, t < B0 + 0.2 ? gv : 0);
    if (gv > 0) { draw(floor, up(t, A0 - 0.6, 1.4)); op(bell, up(t, A0 + 1.3, 0.6)); move(bell, mix(60, 150, up(t, A0 + 1.3, 1.0)), 420, 1, 0); lockers.forEach((l, i) => { op(l, up(t, A0 + 2.4 + i * 0.15, 0.5)); l.setAttribute("transform", `translate(${(30 * (1 - up(t, A0 + 2.4 + i * 0.15, 0.9))).toFixed(1)} 0)`); }); }
    // poster, which becomes the highlighted line on the page
    const k = up(t, B1 + 0.2, 1.6), b = rowBox(VR), sway = 1.2 * Math.sin(t * 0.7) * (1 - k);
    const pvis = up(t, A0 - 0.3, 0.7) * (1 - up(t, B1 + 1.5, 0.5)); op(poster, pvis);
    set(poster, { x: mix(215, b.x, k).toFixed(1), y: (mix(170, b.y, k) + sway).toFixed(1), width: mix(690, b.w, k).toFixed(1), height: mix(226, b.h, k).toFixed(1), "fill-opacity": (1 - k).toFixed(2) });
    const tv = span(t, A1 - 0.3, B1 + 0.6, 0.5, 0.5); op(gVerse, tv); gVerse.setAttribute("transform", `translate(0 ${sway.toFixed(2)})`); op(pref, up(t, A1 + 1.4, 0.6));
    // trophy: what it sounds like; later set aside
    const t1 = span(t, B0 - 0.2, B1 + 0.6, 0.5, 0.6), t2 = up(t, M0 - 0.2, 0.6) * (1 - up(t, CL - 0.4, 0.6)), aside = up(t, M0 + 1.0, 1.2);
    op(trophy, Math.max(t1, t2 * mix(1, 0.4, aside))); const tx = t < M0 - 0.5 ? 1062 : mix(640, 1064, aside), ty = t < M0 - 0.5 ? 320 - 10 * up(t, B0 - 0.2, 1.5) : mix(300, 172, aside), ts = t < M0 - 0.5 ? 1.5 : mix(1.5, 0.62, aside);
    move(trophy, tx, ty + 2 * Math.sin(t * 0.9), ts);
    tStrike.setAttribute("d", `M${tx - 52 * ts} ${ty + 44 * ts} L${tx + 52 * ts} ${ty - 44 * ts}`); op(tStrike, t2 > 0 ? t2 * up(t, M0 + 0.7, 0.3) : 0); draw(tStrike, up(t, M0 + 0.7, 0.7));

      rows.forEach((r, i) => op(r, Math.max(up(t, B1 + 0.5 + Math.abs(i - VR) * 0.09, 0.5), back)));
      const upRow = up(t, C1 + 0.7, 1.1) * (1 - back), hb = rowBox(VR); set(hi, { x: hb.x, y: (hb.y - 31 * upRow).toFixed(1), width: hb.w, height: hb.h }); op(hi, Math.max(up(t, B1 + 1.5, 0.4), back));
      const nd = span(t, B1 + 2.3, C0 - 0.3, 0.5); op(halo[0], Math.max(nd, back * up(t, CL + 0.9, 0.5))); op(halo[1], back * up(t, CL + 1.1, 0.5)); op(halo[2], back * up(t, CL + 1.6, 0.5)); op(halo[3], back * up(t, CL + 1.8, 0.5));
      op(n13, Math.max(up(t, B1 + 1.7, 0.5), back)); op(n12, Math.max(up(t, B1 + 2.5, 0.5), back)); draw(doorLine, up(t, B1 + 2.5, 0.5)); op(doorLine, nd); op(doorLab, nd); }

  });
});
</script>
