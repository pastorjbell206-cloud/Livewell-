     pamphlet, the parlor at Kettering, the one-way voyage, the seven-year wait, and the Serampore press filling a
     shelf with forty-odd languages; the Judsons in Burma, Ann's ring and the rings of the women who followed her;
     the China Inland Mission walking up-country from the treaty ports; Livingstone's path and a package of three
     words in which the light dims as the wrapping thickens; treaty sheets and a ship that carries a crate of opium
     beside a book; the third wrapper, European customs; 1900 in north China, marked only with a grey wash and
     hollow rings; Knibb's Jamaica, Britain and a chain that parts; a Bible sending its words out in every tongue;
     Exodus 20:2; the book carried on an imperial ship; an empty portrait frame; catechists on African paths, Bible
     women going house to house, island teachers crossing the Pacific; scenery that turns out to be the engine;
     Pandita Ramabai's household; Crowther taken, freed at sea, translating, given the crozier, his Niger mission
     taken apart, and the long line of years it took to unlearn; Edinburgh's twelve hundred seats, the few from
     Asia, Azariah at the lectern and "Friends"; the young churches outgrowing the old; three equal panels for
     three traditions; the whole century's routes; the package unwrapped and the light passed lamp to lamp; and a
     ship whose cargo fades while its light goes on, down a Roman road.
     The land dots are LiveWell's own 3-degree world grid (copied from the ENDS map data); places sit at their real
     longitude and latitude. Deaths are named in words and marked only by hollow rings; nothing violent is drawn.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->
