     first and marana tha; the bread and the cup on the line to his coming; the creed of 381, Miller's card
     and the calculations that failed; the four millennial views drawn as four timelines, each with the
     same return; the ending with a face; grief with a sunrise; the work entrusted; steady and alert; the
     open book under Revelation 22:20.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->

  const r1 = row(RY[0], "AMILLENNIAL"); r1.br = bracket(r1.g, 172, 880, RY[0], "THE THOUSAND YEARS · THIS PRESENT AGE"); r1.ret = retDot(r1.g, 900, RY[0]);
  const r2 = row(RY[1], "POSTMILLENNIAL"); r2.wedge = el("path", { fill: MUTED, stroke: STONE, "stroke-width": 1.6, "stroke-linejoin": "round" }, r2.g); r2.br = bracket(r2.g, 172, 880, RY[1], "A LONG AGE OF GOSPEL GROWTH"); r2.ret = retDot(r2.g, 900, RY[1]);
  const r3 = row(RY[2], "HISTORIC PREMILLENNIAL"); r3.box = box(r3.g, 560, 680, RY[2], "TRIBULATION"); r3.ret = retDot(r3.g, 700, RY[2]); r3.br = bracket(r3.g, 714, 1040, RY[2], "1,000 YEARS ON EARTH");
  r3.church = el("circle", { r: 5, fill: INK }, r3.g);
  const r4 = row(RY[3], "DISPENSATIONAL PREMILLENNIAL"); r4.rap = G(r4.g); el("path", { d: `M545 ${RY[3] - 6} V${RY[3] - 26} M537 ${RY[3] - 18} L545 ${RY[3] - 27} L553 ${RY[3] - 18}`, stroke: INK, "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" }, r4.rap);
  r4.rapL = T(r4.g, "lab", 545, RY[3] - 36, "RAPTURE", 13); r4.box = box(r4.g, 560, 680, RY[3], "SEVEN YEARS"); r4.ret = retDot(r4.g, 700, RY[3]); r4.br = bracket(r4.g, 714, 1040, RY[3], "1,000 YEARS");
  const join7 = line(g7, `M900 ${RY[0]} V${RY[1]} C900 ${RY[1] + 48} 700 ${RY[2] - 48} 700 ${RY[2]} V${RY[3]}`, { stroke: MUSTARD, "stroke-width": 2.5 });
  const sameLab = T(g7, "lab", 900, 140, "ONE RETURN, CONFESSED BY ALL", 15, null, INK);
  const draw7 = (t) => {
    const v = span(t, CS("differ") - 0.2, NEXT("differ") + 0.3, 0.6, 0.7); op(g7, v); if (v <= 0) return;
    const fOut = 1 - up(t, A("differ", 0, 0.48), 0.7);
    fork.forEach((f, i) => { draw(f, up(t, D[0] + (i ? 0.9 + i * 0.25 : 0), i ? 1.4 : 1.0)); op(f, fOut); });
    const tk = span(t, A("differ", 0, 0.56), D[1] + 0.3, 0.8, 0.6); op(thou, tk); op(thouLab, tk * up(t, A("differ", 0, 0.7), 0.6)); thou.setAttribute("y", (328 - 6 * up(t, A("differ", 0, 0.56), 3)).toFixed(1));

    draw(join7, up(t, A("differ", 5, 0.4), 1.8)); op(join7, up(t, A("differ", 5, 0.4), 0.3)); op(sameLab, up(t, A("differ", 5, 0.5), 0.8));
  };

  // ================= 8. what it changes: an ending with a face; grief and a sunrise; the work entrusted; steady and alert =================
  const L = [0, 1, 2, 3].map((k) => S("life", k));
  const g8 = G();
  const story = line(g8, "M160 380 H990", { stroke: INK, "stroke-width": 3 }), ring8 = ring(g8, 1030, 380, 28), rays8 = rays(g8, 1030, 380, 46, 70, 9);
  const storyLab = T(g8, "lab", 560, 424, "THE STORY HAS AN ENDING", 15), face = T(g8, "ital", 620, 256, "and the ending has a face", 52);
  const g8b = G();
  const ground8 = line(g8b, "M200 500 H1080", { stroke: INK, "stroke-width": 2.5 }), sun8 = halfSun(g8b, "clip-l", 640, 500, 62), rays8b = rays(g8b, 640, 500, 120, 156, 9);
  const mound8 = el("path", { d: "M560 500 Q640 444 720 500 Z", fill: WARM, stroke: INK, "stroke-width": 2.4 }, g8b);
  const hopeLab = T(g8b, "lab", 640, 546, "NOT WITHOUT HOPE", 15);
  const g8c = G();
  const ground8c = line(g8c, "M140 520 H1140", { stroke: INK, "stroke-width": 2.5 });
  const hill8 = el("path", { d: "M150 520 Q260 402 330 400 Q400 402 510 520 Z", fill: WARM, stroke: INK, "stroke-width": 2.4 }, g8c);
  const sky8 = line(g8c, "M330 378 V200", { stroke: STONE, "stroke-width": 2 });
  const house = G(g8c); el("path", { d: "M-70 0 V-84 L0 -134 L70 -84 V0 Z", fill: PAPER, stroke: INK, "stroke-width": 2.4, "stroke-linejoin": "round" }, house); el("path", { d: "M-14 0 V-46 H14 V0 Z", fill: CHAR }, house);
  const crops = [640, 676, 712, 748, 784].map((x) => line(g8c, `M${x} 520 V498 M${x} 508 Q${x - 10} 500 ${x - 12} 492 M${x} 504 Q${x + 10} 496 ${x + 12} 488`, { stroke: "#7A8B5A", "stroke-width": 2.4 }));
  const workers = [0, 1, 2].map(() => el("circle", { r: 7, fill: INK }, g8c)), starer = el("circle", { r: 7, fill: INK }, g8c);
  const workLab = T(g8c, "lab", 740, 562, "THE PEOPLE AND THE WORK ENTRUSTED TO YOU", 13);
  const g8d = G();
  const lamp8 = lamp(g8d, 1.6), steady = T(g8d, "ital", 370, 338, "steady", 62), alert = T(g8d, "ital", 910, 338, "alert", 62);
  const secLab = T(g8d, "lab", 370, 388, "THE OUTCOME IS SECURE", 14), todayLab = T(g8d, "lab", 910, 388, "IT COULD BE TODAY", 14);
  const draw8 = (t) => {
    const v = span(t, CS("life") - 0.2, L[1] + 0.5, 0.6, 0.8); op(g8, v);
    if (v > 0) {
      draw(story, up(t, S("life", 0) + 0.1, Math.max(2, (E("life", 0) - S("life", 0)) * 0.6)));
      const kr = up(t, A("life", 0, 0.55), 0.8); op(ring8, kr); breathe(ring8, t, kr); rays8.forEach((r, i) => { draw(r, up(t, A("life", 0, 0.6) + i * 0.08, 0.6)); op(r, 0.7 + 0.3 * Math.sin(t * 1.2 + i)); });
      op(storyLab, up(t, A("life", 0, 0.45), 0.7)); op(face, up(t, A("life", 0, 0.74), 0.9)); face.setAttribute("y", (262 - 6 * up(t, A("life", 0, 0.74), 3)).toFixed(1));
    }
    const v2 = span(t, L[1] - 0.4, L[2] + 0.5, 0.7, 0.8); op(g8b, v2);
    if (v2 > 0) {
      draw(ground8, up(t, L[1] - 0.3, 1.0)); const km = up(t, L[1], 0.8); op(mound8, km);
      set(sun8, { cy: (500 + 62 - 54 * up(t, A("life", 1, 0.08), 3.4)).toFixed(1) });
      rays8b.forEach((r, i) => { draw(r, up(t, A("life", 1, 0.62) + i * 0.08, 0.7)); op(r, 0.7 + 0.3 * Math.sin(t * 1.2 + i)); }); op(hopeLab, up(t, A("life", 1, 0.7), 0.7));
    }
    const v3 = span(t, L[2] - 0.4, L[3] + 0.5, 0.7, 0.8); op(g8c, v3);
    if (v3 > 0) {
      draw(ground8c, up(t, L[2] - 0.3, 1.0)); move(house, 960, 520); op(house, up(t, L[2], 0.7));
      crops.forEach((c, i) => draw(c, up(t, L[2] + 0.3 + i * 0.15, 0.8)));
      const wk = [[700, 880, 0.31], [760, 820, 0.53], [920, 990, 0.42]];
      workers.forEach((w, i) => { const [a, b, sp] = wk[i], ph = 0.5 - 0.5 * Math.cos(t * sp * 2 + i * 2); set(w, { cx: mix(a, b, ph).toFixed(1), cy: (512 - Math.abs(Math.sin(t * 4 + i)) * 2).toFixed(1) }); op(w, up(t, L[2] + 0.2 + i * 0.2, 0.6)); });
      const kh = up(t, A("life", 2, 0.25), 0.8); op(hill8, kh);
      draw(sky8, up(t, A("life", 2, 0.32), 1.2)); op(sky8, 1 - up(t, A("life", 2, 0.58), 0.8));
      const kd = up(t, A("life", 2, 0.62), Math.max(2.4, (E("life", 2) - S("life", 2)) * 0.32));

      op(steady, up(t, A("life", 3, 0.12), 0.8)); op(secLab, up(t, A("life", 3, 0.3), 0.7)); op(alert, up(t, A("life", 3, 0.55), 0.8)); op(todayLab, up(t, A("life", 3, 0.8), 0.7));

  // ================= 9. the close: the open book, the light behind it, Revelation 22:20 =================
