     with himself, Pachomius's walled communities on the Nile, Basil's monastery at the edge of the city, the
     sayings of the mothers and fathers; the pillar, the scale of church politics, the monks' own sayings,
     Abba Moses and his leaking basket; the desert's wisdom carried west, Monte Cassino, the braid of psalms,
     work and reading, the open door; the house that could still read and the daily round; three readings
     side by side, Orthodox, Catholic, Protestant; and the edge of the fields again.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->

  const strands = [[0, INK, "PSALMS"], [2.094, STONE, "WORK"], [4.189, MUSTARD, "READING"]].map(([ph, c, s], i) => ({ ph, e: el("path", { stroke: c, "stroke-width": 4, fill: "none", "stroke-linecap": "round" }, g7), lab: T(g7, "lab", 196, BY - 26 + i * 26, s, 13, "end") }));
  const doorF = line(g7, "M1000 300 V230 Q1040 196 1080 230 V300", { "stroke-width": 3 }), doorIn = el("path", { d: "M1004 300 V232 Q1040 202 1076 232 V300 Z", fill: WARM }, g7);
  const guest = dot(g7, 7), guestLab = T(g7, "lab", 1040, 176, "GUESTS RECEIVED AS CHRIST", 13), begLab = T(g7, "lab", 640, 520, "A RULE FOR BEGINNERS", 14);
  const draw7 = (t) => {
    const v = span(t, CS("rule") - 0.2, CS("kept") + 0.3, 0.6, 0.7); op(g7, v); if (v <= 0) return;
    const mapV = 1 - up(t, U[1] - 0.2, 0.9);
    desDots.forEach((d, i) => { at(d.e, d.x + 2 * Math.sin(t + i), d.y); op(d.e, up(t, CS("rule") + i * 0.05, 0.5) * mapV); }); op(desLab7, up(t, CS("rule") + 0.4, 0.6) * mapV);
    const apart = up(t, W("rule", 0, 0.45), 3.0);
    west.forEach((w) => { const r = 50 + apart * w.dr; at(w.e, 330 + Math.cos(w.a + apart * w.dd * 0.6) * r, 258 + Math.sin(w.a + apart * w.dd * 0.6) * r * 0.7); op(w.e, up(t, CS("rule") + 0.2, 0.6) * mix(1, 0.4, apart) * mapV); });
    op(westLab, up(t, CS("rule") + 0.6, 0.6) * mapV);
    draw(route7, up(t, U[0] + 0.4, 2.0)); op(route7, up(t, U[0] + 0.3, 0.3) * mapV);
    const tr = up(t, U[0] + 0.6, 2.4); if (tr > 0 && tr < 1) { const L7 = route7.getTotalLength(), pt = route7.getPointAtLength(L7 * tr); at(spark7, pt.x, pt.y); } op(spark7, tr > 0 && tr < 1 ? 1 : 0);
    const hv = span(t, U[1] - 0.3, U[2] + 0.4, 0.7, 0.8);
    draw(hill, up(t, U[1] - 0.2, 1.4)); op(hill, hv); move(abbey, 640, 362, mix(0.6, 1, up(t, U[1] + 0.6, 1.0))); op(abbey, hv * up(t, U[1] + 0.6, 0.7));
    op(casLab, hv * up(t, U[1] + 0.9, 0.6)); op(benLab, hv * up(t, W("rule", 1, 0.25), 0.6));
    move(ruleBk, 960, 400 + 2 * Math.sin(t * 0.9)); op(ruleBk, hv * up(t, W("rule", 1, 0.5), 0.6)); move(candle, 1034, 438); op(candle, hv * up(t, W("rule", 1, 0.62), 0.6));
    flame.setAttribute("transform", `rotate(${(4 * Math.sin(t * 1.6)).toFixed(2)} 0 -28) scale(${(1 + 0.05 * Math.sin(t * 2.3)).toFixed(3)})`);
    op(eveLab, hv * up(t, W("rule", 1, 0.66), 0.6));
    const bv = up(t, U[2] - 0.1, 0.6), grow = mix(210, 1100, up(t, U[2] + 0.3, E("rule", 2) - U[2])), grow2 = mix(grow, 1210, up(t, W("rule", 3, 0.5), 2.0));
    strands.forEach((s, i) => { s.e.setAttribute("d", strandD(s.ph - t * 0.5, Math.max(216, grow2))); op(s.e, bv); op(s.lab, up(t, U[2] + 0.4 + i * 0.4, 0.6)); });
    op(harsh, span(t, U[2] + 0.2, U[3] + 0.1, 0.7, 0.6));
    draw(doorF, up(t, U[3], 0.9)); op(doorF, up(t, U[3] - 0.1, 0.3)); op(doorIn, up(t, U[3] + 0.6, 0.6));
    const gk = up(t, U[3] + 0.6, 1.8); at(guest, mix(1210, 1040, gk), mix(286, 284, gk)); op(guest, up(t, U[3] + 0.5, 0.5) * (1 - up(t, U[3] + 2.6, 0.6)));
    op(guestLab, up(t, U[3] + 0.8, 0.6)); op(begLab, up(t, W("rule", 3, 0.45), 0.6));
  };

  // ================= 8. what they kept alive: the house that could still read, the daily round =================
  const K = [0, 1].map((k) => S("kept", k));
  const g8 = G();
  const scat = [...Array(30)].map(() => ({ x: 120 + R() * 1040, y: 130 + R() * 440, dx: (R() - 0.5) * 120, dy: (R() - 0.5) * 60, e: dot(g8, 4) })).filter((s) => Math.abs(s.x - 640) > 170 || s.y > 540);
  const hall = line(g8, "M520 470 V310 L640 236 L760 310 V470 Z M640 236 V204 M628 216 H652", { "stroke-width": 3 });
  const wins = [570, 640, 710].map((x) => el("path", { d: `M${x - 14} 420 V382 Q${x} 364 ${x + 14} 382 V420 Z`, fill: PAPER, stroke: INK, "stroke-width": 2.2 }, g8));
  const pages8 = [...Array(10)].map((_, i) => { const s = sheet(g8, 30, 40, 3, 800 + i, { sw: 1.4 }); s._x = i < 5 ? 220 + i * 58 : 830 + (i - 5) * 58; return s; });
  const readLab = T(g8, "lab", 640, 540, "AMONG THE FEW PLACES THAT COULD STILL READ", 14);
  const ring8 = el("circle", { cx: 640, cy: 330, r: 118, fill: "none", stroke: LINE, "stroke-width": 6 }, g8);
  const arcs8 = [...Array(8)].map((_, i) => { const a0 = -Math.PI / 2 + i * Math.PI / 4 + 0.05, a1 = a0 + Math.PI / 4 - 0.1; return line(g8, `M${640 + Math.cos(a0) * 118} ${330 + Math.sin(a0) * 118} A118 118 0 0 1 ${640 + Math.cos(a1) * 118} ${330 + Math.sin(a1) * 118}`, { stroke: i % 2 ? INK : MUSTARD, "stroke-width": 6, "stroke-linecap": "butt" }); });
  const hourDots = [...Array(8)].map((_, i) => { const a = -Math.PI / 2 + i * Math.PI / 4; return el("circle", { cx: 640 + Math.cos(a) * 92, cy: 330 + Math.sin(a) * 92, r: 4, fill: STONE }, g8); });
  const cross8 = line(g8, "M640 300 V362 M622 318 H658", { "stroke-width": 4 });
  const cmdLab = T(g8, "lab", 640, 500, "THE COMMANDS OF JESUS", 14), dayLab = T(g8, "lab", 640, 526, "A DAILY SCHEDULE", 14);
  const draw8 = (t) => {
    const v = span(t, CS("kept") - 0.2, CS("differ") + 0.3, 0.6, 0.7); op(g8, v); if (v <= 0) return;
    const hv = 1 - up(t, W("kept", 1, 0.3), 1.0);
    scat.forEach((s, i) => { const k = up(t, K[0], 6); at(s.e, s.x + s.dx * k, s.y + s.dy * k); op(s.e, up(t, CS("kept") + i * 0.04, 0.5) * mix(0.9, 0.25, k) * hv); });
    draw(hall, up(t, K[0] - 0.3, 1.6)); op(hall, hv);
    wins.forEach((w, i) => { op(w, up(t, K[0] + 0.6 + i * 0.2, 0.5) * hv); w.setAttribute("fill", t > K[0] + 1.6 + i * 0.5 ? MUSTARD : PAPER); });
    pages8.forEach((p, i) => { const k = up(t, K[0] + 1.6 + i * 0.32, 0.6); move(p, p._x, 450 - 6 * k + 2 * Math.sin(t + i)); op(p, k * hv); });
    op(readLab, up(t, W("kept", 0, 0.45), 0.6) * hv);
    const rv = up(t, W("kept", 1, 0.32), 1.0);
    op(ring8, rv); arcs8.forEach((a, i) => { draw(a, up(t, W("kept", 1, 0.45) + i * 0.4, 0.5)); op(a, rv); }); hourDots.forEach((h, i) => op(h, rv * up(t, W("kept", 1, 0.4) + i * 0.1, 0.4)));
    draw(cross8, up(t, W("kept", 1, 0.4), 0.9)); op(cross8, rv);
    op(cmdLab, up(t, W("kept", 1, 0.5), 0.6)); op(dayLab, up(t, W("kept", 1, 0.72), 0.6));
  };

  // ================= 9. where Christians differ: three readings, side by side, drawn alike =================
  const P = [0, 1, 2, 3].map((k) => S("differ", k));
  const g9 = G(), PX = [290, 640, 990];
  const hub = el("circle", { cx: 640, cy: 140, r: 16, fill: "none", stroke: INK, "stroke-width": 3 }, g9);
  const branches = PX.map((x) => line(g9, `M640 156 C640 196 ${x} 186 ${x} 226`, { stroke: STONE, "stroke-width": 2.4 }));
  const panels = PX.map((x) => line(g9, `M${x - 150} 226 H${x + 150} V530 H${x - 150} Z`, { "stroke-width": 2.4 }));
  const icon = PX.map((x) => G(g9));
  // Orthodox: a domed house of prayer, its door open
  line(icon[0], "M-52 0 V-56 H52 V0 M-34 -56 A34 34 0 0 1 34 -56 M0 -90 V-112 M-8 -104 H8 M-12 0 V-26 Q0 -38 12 -26 V0", { "stroke-width": 2.8 });
  const oDots = [-74, -88].map((dx) => dot(icon[0], 5));
  // Catholic: a cloister of arches and the Rule
  line(icon[1], "M-78 0 V-60 H78 V0 M-78 0 H78 M-60 0 V-34 Q-48 -48 -36 -34 V0 M-12 0 V-34 Q0 -48 12 -34 V0 M36 0 V-34 Q48 -48 60 -34 V0 M-86 -60 L0 -96 L86 -60", { "stroke-width": 2.8 });
  // Protestant: field, home and cell on one line
  line(icon[2], "M-100 0 H100 M-92 -4 L-70 -26 M-80 -4 L-58 -26 M-68 -4 L-46 -26 M-20 0 V-30 L0 -48 L20 -30 V0 M58 0 V-30 Q76 -48 94 -30 V0", { "stroke-width": 2.8 });
  const names = [["ORTHODOX", "PRAYER AND COUNSEL", "BASIL'S STAMP"], ["CATHOLIC", "A VOWED CALLING", "BENEDICT'S RULE"], ["PROTESTANT", "EVERY CALLING HOLY", "FARMER · MOTHER · MONK"]].map((ls, i) => ls.map((s, j) => T(g9, "lab", PX[i], [432, 466, 490][j], s, j ? 13 : 16, null, j ? STONE : INK)));
  const draw9 = (t) => {
    const v = span(t, CS("differ") - 0.2, CS("close") + 0.3, 0.6, 0.7); op(g9, v); if (v <= 0) return;

    [1, 2, 3].forEach((k, i) => { const a = P[k] - 0.1;

      move(icon[i], PX[i], 380 + 2 * Math.sin(t * 0.8 + i)); names[i].forEach((n, j) => op(n, up(t, a + 0.8 + j * 0.5, 0.6))); });

  const g10 = G();
  const monk = dot(g10, 8), candleC = G(g10); el("rect", { x: -3.5, y: -22, width: 7, height: 22, fill: PAPER, stroke: INK, "stroke-width": 1.6 }, candleC); const flameC = el("path", { d: "M0 -38 Q6 -29 0 -24 Q-6 -29 0 -38 Z", fill: MUSTARD }, candleC);

    const mk = up(t, Z[1] - 0.5, 4); move(moon, 300, mix(214, 170, mk)); op(moon, mk);

    op(sell, up(t, Z[2] - 0.1, 0.9)); sell.setAttribute("y", (256 - 8 * up(t, Z[2] - 0.1, 3)).toFixed(1));

    const wA = W("antony", 2, 0.62), wB = E("antony", 2) + 2.4, wk = up(t, wA, wB - wA);

  return (t) => { drawLand(t); draw1(t); draw2(t); draw3(t); draw4(t); draw5(t); draw6(t); draw7(t); draw8(t); draw9(t); draw10(t); drawAnt(t); };
