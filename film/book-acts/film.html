     light, a turned dot, and an old tree with new growth; one book read by clusters that order the same three
     marks differently; the key chapters; the house in Rome with its door open.
     People are dots, all the same size and ink. The risen Jesus and the Spirit are never drawn: only mustard
     light and mustard lines. Stephen's death is named by the voice and never shown. No map, no borders.
     Chapter count checked in client/public/bible/text/acts/ (28). The strip shades 13 to 28 for "the second
     half belongs largely to Paul" (his first sending is Acts 13).
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
