     and a boy who listens; a crowd pointing at other nations' crowns; tall men measured against a line while a

     People are dots; a king is a dot with a small crown. God is never drawn (his rule is an empty mustard ring).
     War and death are named by the voice and never shown: no battle, no giant, no weapon, no fallen figure.
     THE HARD CHAPTER (Amalek): only a book, its pages, and three readers treated alike. Nothing stands for any people.
     The seven stages follow the book page's own structure (client/public/bible/notes/1-samuel/intro.json):
     1 to 3, 4 to 7, 8 to 12, 13 to 15, 16 to 20, 21 to 27, 28 to 31. The life-lines run Samuel 1 to 25 (25:1),
     Saul 9 to 31 (9:2; 31:6), David 16 onward (16:13), each confirmed in client/public/bible/text/1-samuel/.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
