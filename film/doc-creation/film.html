<!-- "In the beginning" (doctrine film: creation). One picture in nine scenes: stars, sea and breath that
     narrow to the Bible's first page; an empty ring that fills with a made world, held in being; the open
     book under Genesis 1:1; the Enuma Elish's war beside one quiet light; the sun and moon lifted off their
     pedestals to become lights on an arc of seasons; seven rings of good; Genesis and the New Testament
     joined by a thread, a light that sends out all things and a ring that holds them; the Spirit over the
     waters; Plato's lump and Aristotle's loop, then a world out of nothing and the creed's page; the six
     days and the age line opening into four equal columns, one for each view, joined by one bracket;
     breath, bread, work, beauty and a heartbeat on one ribbon; enjoy and care, study, farm and build; the
     exiles' tents under named stars; the waiting horizon, the first and last pages, sunrise under
     Revelation 21:5, and the last word.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->
<html lang="en"><head><meta charset="utf-8"><title>In the beginning</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));
  const CS = (id) => CH[id].start;
  const at = (id, k, f = 0) => S(id, k) + f * (E(id, k) - S(id, k));      // a point f of the way through line k
  const T = (p, cls, x, y, s, size, anchor, fill) => { const e = txt(p, cls, x, y, s, size, fill ? { fill } : undefined); if (anchor) e.setAttribute("style", (e.getAttribute("style") || "") + `text-anchor:${anchor};`); return e; };
  const G = (p) => el("g", {}, p || world);
  const R = rng(1101);
  const circD = (cx, cy, r) => `M${cx - r} ${cy} A${r} ${r} 0 1 1 ${cx + r} ${cy} A${r} ${r} 0 1 1 ${cx - r} ${cy}`;
  const waveD = (x0, x1, y, amp, k, ph) => { let d = `M${x0} ${(y + amp * Math.sin(x0 * k + ph)).toFixed(1)}`; for (let x = x0 + 12; x <= x1; x += 12) d += ` L${x} ${(y + amp * Math.sin(x * k + ph)).toFixed(1)}`; return d; };
  // a sheet of writing: rectangle with rows of little word-bars
  const sheet = (parent, w, h, rows, seed) => {
    const g = G(parent), r = rng(seed), bh = Math.max(2.4, h * 0.03);
    el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, fill: PAPER, stroke: INK, "stroke-width": 2.2 }, g);
    const bars = [], pad = w * 0.13;
    for (let i = 0; i < rows; i++) {
      const y = -h / 2 + h * 0.16 + i * (h * 0.68 / Math.max(1, rows - 1));
      let x = -w / 2 + pad; const end = w / 2 - pad - (i === rows - 1 ? w * 0.28 : 0);
      while (x < end - 5) { const bw = Math.min(end - x, 5 + r() * w * 0.17); bars.push(el("rect", { x, y: y - bh / 2, width: bw, height: bh, rx: bh / 2, fill: INK }, g)); x += bw + Math.max(3, w * 0.025); }
    }
    g._bars = bars; return g;
  };
  // an open book, centred on 0,0 (about 300 wide, 130 tall)
  const pageD = (s) => `M0 -50 C${-40 * s} -70 ${-110 * s} -70 ${-150 * s} -55 L${-150 * s} 55 C${-110 * s} 40 ${-40 * s} 40 0 60 Z`;
  const mkBook = (parent) => { const b = G(parent);
    [1, -1].forEach((s) => el("path", { d: pageD(s), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, b));
    b._lines = []; [1, -1].forEach((s) => [-28, -10, 8, 26].forEach((dy) => b._lines.push(line(b, `M${-22 * s} ${dy - 8} C${-60 * s} ${dy - 20} ${-100 * s} ${dy - 20} ${-132 * s} ${dy - 10}`, { stroke: STONE, "stroke-width": 2.2 }))));
    return b; };

  // ================= 1. the question: stars, sea, breath; the first page =================
  const Q0 = S("question", 0), Q1 = S("question", 1);
  const g1 = G();
  const st1 = [...Array(46)].map(() => ({ x: 110 + R() * 1060, y: 122 + R() * 158, r: 1.5 + R() * 2.4, d: R(), e: el("circle", { fill: INK }, g1) }));
  const hz1 = line(g1, "M110 345 H1170", { "stroke-width": 2.5 });
  const sea1 = [0, 1, 2].map(() => el("path", { fill: "none", stroke: STONE, "stroke-width": 2.2, "stroke-linecap": "round" }, g1));
  const brDot = el("circle", { cx: 860, cy: 420, r: 6, fill: INK }, g1);
  const br1 = [0, 1, 2, 3].map(() => el("path", { fill: "none", stroke: STONE, "stroke-width": 2.4, "stroke-linecap": "round" }, g1));
  const l1a = T(g1, "lab", 640, 316, "THE STARS", 15), l1b = T(g1, "lab", 420, 505, "THE SEA", 15), l1c = T(g1, "lab", 900, 505, "BREATH", 15);
  const pg1 = sheet(g1, 220, 290, 10, 5), pgLab = T(g1, "lab", 640, 170, "THE FIRST PAGE", 15), q1 = T(g1, "disp", 830, 380, "?", 110, null, MUSTARD);
  const draw1 = (t) => {
    const v = span(t, 0.2, CS("confess") + 0.7, 0.6, 0.8); op(g1, v); if (v <= 0) return;
    const out = up(t, Q1 - 0.3, 1.0);
    st1.forEach((s) => { set(s.e, { cx: s.x, cy: s.y, r: (s.r * (0.82 + 0.18 * Math.sin(t * 1.6 + s.d * 9))).toFixed(2) }); op(s.e, up(t, Q0 - 1.2 + s.d * 1.8, 0.6) * (1 - out)); });
    op(l1a, up(t, at("question", 0, 0.45), 0.6) * (1 - out));
    draw(hz1, up(t, at("question", 0, 0.5), 1.0)); op(hz1, 1 - out);
    sea1.forEach((w, i) => { w.setAttribute("d", waveD(150, 700, 382 + i * 25, 5, 0.03, t * 1.2 + i)); op(w, up(t, at("question", 0, 0.56) + i * 0.15, 0.6) * (1 - out)); });
    op(l1b, up(t, at("question", 0, 0.6), 0.6) * (1 - out));
    br1.forEach((a, i) => { const ph = (t * 0.6 + i / 4) % 1, rr = 14 + ph * 60;
      a.setAttribute("d", `M${(860 + rr * Math.cos(-0.6)).toFixed(1)} ${(420 + rr * Math.sin(-0.6)).toFixed(1)} A${rr.toFixed(1)} ${rr.toFixed(1)} 0 0 1 ${(860 + rr * Math.cos(0.6)).toFixed(1)} ${(420 + rr * Math.sin(0.6)).toFixed(1)}`);
      op(a, up(t, at("question", 0, 0.72), 0.6) * (1 - ph) * (1 - out)); });
    op(brDot, up(t, at("question", 0, 0.7), 0.5) * (1 - out)); op(l1c, up(t, at("question", 0, 0.76), 0.6) * (1 - out));
    const pk = up(t, Q1 - 0.1, 0.9); move(pg1, 640, 345 + 10 * (1 - pk) + 2 * Math.sin(t * 0.8)); op(pg1, pk);
    pg1._bars.forEach((b, i) => op(b, up(t, Q1 + 0.2 + i * 0.03, 0.4)));
    op(pgLab, up(t, Q1 + 0.4, 0.6)); op(q1, up(t, at("question", 1, 0.7), 0.7)); move(q1, 0, 3 * Math.sin(t * 1.4));
  };

  // ================= 2. what the church confesses: a world from nothing, held in being =================
  const C0 = S("confess", 0), C1 = S("confess", 1), CX = 640, CY = 340;
  const g2 = G();
  const ring2d = el("circle", { cx: CX, cy: CY, r: 140, fill: "none", stroke: STONE, "stroke-width": 2, "stroke-dasharray": "6 8" }, g2);
  const nothing2 = T(g2, "lab", CX, CY + 6, "NOTHING", 15);
  const world2 = G(g2), ring2 = line(world2, circD(0, 0, 140), { "stroke-width": 3 });
  const pulse2 = [0, 1, 2].map(() => el("circle", { r: 10, fill: "none", stroke: MUSTARD, "stroke-width": 2 }, world2));
  const dots2 = [...Array(84)].map(() => { const a = R() * 6.283, rr = 22 + Math.sqrt(R()) * 104, m = R() < 0.1;
    return { x: Math.cos(a) * rr, y: Math.sin(a) * rr, r: 2 + R() * 4.2, d: R(), e: el("circle", { r: 0, fill: m ? MUSTARD : INK }, world2) }; });
  const seed2 = el("circle", { r: 7, fill: MUSTARD }, world2);
  const L2 = [["FREELY", 380, 215, 0.55], ["BY HIS WORD", 900, 215, 0.67], ["FROM NOTHING", 380, 475, 0.77], ["AND GOOD", 900, 475, 0.9]].map(([s, x, y, f]) => ({ e: T(g2, "lab", x, y, s, 16), f }));
  const not2 = [T(g2, "lab", 330, 355, "NOT GOD", 16), T(g2, "lab", 950, 355, "NOT AN ACCIDENT", 16)];
  const gift2 = T(g2, "ital", CX, 180, "a gift", 56);
  const hold2 = line(g2, `M${(CX + 132 * Math.cos(0.35)).toFixed(1)} ${(352 + 132 * Math.sin(0.35)).toFixed(1)} A132 132 0 0 1 ${(CX + 132 * Math.cos(Math.PI - 0.35)).toFixed(1)} ${(352 + 132 * Math.sin(Math.PI - 0.35)).toFixed(1)}`, { stroke: MUSTARD, "stroke-width": 4 });
  const holdLab = T(g2, "lab", CX, 548, "HELD IN BEING, EVERY MOMENT", 15);
  const draw2 = (t) => {
    const v = span(t, CS("confess") - 0.3, CS("first") + 1.0, 0.6, 0.8); op(g2, v); if (v <= 0) return;
    const sh = up(t, C1 - 0.2, 1.2), made = up(t, at("confess", 0, 0.15), 0.9);
    op(ring2d, up(t, CS("confess"), 0.7) * (1 - made)); op(nothing2, up(t, CS("confess") + 0.2, 0.6) * (1 - up(t, at("confess", 0, 0.12), 0.5)));
    move(world2, CX, mix(CY, 352, sh) + 2 * Math.sin(t * 0.7), mix(1, 0.78, sh));
    draw(ring2, made);
    op(seed2, up(t, at("confess", 0, 0.08), 0.5)); set(seed2, { r: (7 + 1.5 * Math.sin(t * 2)).toFixed(2) });
    pulse2.forEach((p, i) => { const ph = (t * 0.35 + i / 3) % 1; set(p, { r: (10 + ph * 120).toFixed(1) }); op(p, up(t, at("confess", 0, 0.64), 0.6) * (1 - ph) * 0.8); });
    const a = t * 0.04;
    dots2.forEach((d) => { const k = up(t, at("confess", 0, 0.18) + d.d * 2.2, 0.6);
      set(d.e, { cx: (d.x * Math.cos(a) - d.y * Math.sin(a)).toFixed(1), cy: (d.x * Math.sin(a) + d.y * Math.cos(a)).toFixed(1), r: (d.r * k).toFixed(2) }); op(d.e, k); });
    L2.forEach((l) => op(l.e, up(t, at("confess", 0, l.f), 0.6) * (1 - up(t, C1 - 0.3, 0.6))));
    op(not2[0], up(t, at("confess", 1, 0.06), 0.6)); op(not2[1], up(t, at("confess", 1, 0.24), 0.6));
    op(gift2, up(t, at("confess", 1, 0.4), 0.8));
    draw(hold2, up(t, at("confess", 1, 0.66), 1.4)); op(hold2, up(t, at("confess", 1, 0.66), 0.3) * (0.75 + 0.25 * Math.sin(t * 1.6)));
    op(holdLab, up(t, at("confess", 1, 0.74), 0.7));
  };

  // ================= 3. the first sentence: the open book, Genesis 1:1; the Enuma Elish beside Genesis 1 =================
  const F0 = S("first", 0), F1 = S("first", 1), F2 = S("first", 2), F3 = S("first", 3);
  const g3 = G(), book3 = mkBook(g3);
  const rays3 = [...Array(7)].map((_, i) => line(g3, `M${640 + (i - 3) * 22} 405 L${640 + (i - 3) * 46} 364`, { stroke: MUSTARD, "stroke-width": 2.4 }));
  const v3 = ["In the beginning God created", "the heavens and the earth."].map((s, i) => T(g3, "disp", 640, 200 + i * 58, s, 54));
  const ref3 = T(g3, "lab", 640, 312, "GENESIS 1:1 · BEREAN STANDARD BIBLE", 14);
  const g3b = G(), div3 = line(g3b, "M640 150 V520", { stroke: LINE, "stroke-width": 2 });
  const hL3 = T(g3b, "lab", 340, 165, "THE ENUMA ELISH", 15), hR3 = T(g3b, "lab", 940, 165, "GENESIS 1", 15);
  const strokes3 = [0, 1, 2].map(() => el("line", { stroke: STONE, "stroke-width": 2.2, "stroke-linecap": "round" }, g3b));
  const war3 = [...Array(5)].map((_, i) => { const g = G(g3b); el("path", { d: "M0 -24 L21 14 L-21 14 Z", fill: i % 2 ? STONE : INK }, g); return { g, a0: i * 1.2566 }; });
  const wl3 = [T(g3b, "lab", 340, 462, "BUILT AFTER", 14), T(g3b, "lab", 340, 488, "A WAR AMONG THE GODS", 14)];
  const ringsR3 = [0, 1, 2].map(() => el("circle", { cx: 940, cy: 305, fill: "none", stroke: MUSTARD, "stroke-width": 2 }, g3b));
  const lightR3 = el("circle", { cx: 940, cy: 305, r: 11, fill: MUSTARD }, g3b);
  const made3 = [...Array(8)].map((_, i) => { const a = -Math.PI / 2 + i * Math.PI / 4;
    const e = i % 3 === 0 ? el("circle", { r: 9, fill: INK }, g3b) : i % 3 === 1 ? el("rect", { x: -8, y: -8, width: 16, height: 16, rx: 2, fill: INK }, g3b) : el("path", { d: "M0 -10 L9 7 L-9 7 Z", fill: INK }, g3b);
    return { x: 940 + Math.cos(a) * 105, y: 305 + Math.sin(a) * 105, e }; });
  const rl3 = ["ONE GOD", "NO BATTLE", "NO RIVAL"].map((s, i) => T(g3b, "lab", 940, 458 + i * 30, s, 14));
  const draw3 = (t) => {
    const v = span(t, F0 - 0.6, F2 + 1.5, 0.7, 0.8); op(g3, v);
    if (v > 0) {
      const bk = up(t, F0 - 0.5, 1.0); move(book3, 640, 470 + 12 * (1 - bk) + 2 * Math.sin(t * 0.8), 0.9); op(book3, bk);
      book3._lines.forEach((l, i) => draw(l, up(t, F0 + 0.1 + i * 0.08, 0.6)));
      rays3.forEach((r, i) => { draw(r, up(t, F0 + 1.0 + Math.abs(i - 3) * 0.15, 0.7)); op(r, 0.55 + 0.45 * Math.sin(t * 1.5 + i)); });
      const vOut = up(t, F2 + 0.1, 0.6); v3.forEach((l, i) => op(l, up(t, F1 - 0.2 + i * 1.3, 0.8) * (1 - vOut))); op(ref3, up(t, F1 + 2.0, 0.7) * (1 - vOut));
    }
    const v2 = span(t, F2 + 0.7, CS("good") + 0.9, 0.6, 0.8); op(g3b, v2);
    if (v2 > 0) {
      draw(div3, up(t, F2 + 0.8, 1.2)); op(hL3, up(t, F2 + 0.8, 0.6));
      const wk = up(t, F2 + 1.1, 0.8), dim = 1 - 0.55 * up(t, F3 - 0.2, 0.8);
      war3.forEach((w, i) => { const dir = i % 2 ? 1 : -1, a = w.a0 + t * 0.5 * dir, rr = 62 + 20 * Math.sin(t * 1.3 + i * 1.7);
        move(w.g, 340 + Math.cos(a) * rr, 318 + Math.sin(a) * rr * 0.8, 1, (t * 40 * dir) % 360); op(w.g, wk * dim); });
      strokes3.forEach((s, i) => { const a = t * 0.35 + i * 1.05;
        set(s, { x1: (340 + Math.cos(a) * 70).toFixed(1), y1: (318 + Math.sin(a) * 56).toFixed(1), x2: (340 - Math.cos(a) * 70).toFixed(1), y2: (318 - Math.sin(a) * 56).toFixed(1) }); op(s, wk * dim * 0.7); });
      wl3.forEach((l, i) => op(l, up(t, at("first", 2, 0.62) + i * 0.5, 0.6) * dim));
      op(hR3, up(t, F3 - 0.3, 0.6));
      op(lightR3, up(t, F3, 0.8)); set(lightR3, { r: (11 + 1.5 * Math.sin(t * 2)).toFixed(2) });
      ringsR3.forEach((r, i) => { const ph = (t * 0.3 + i / 3) % 1; set(r, { r: (14 + ph * 80).toFixed(1) }); op(r, up(t, at("first", 3, 0.6), 0.6) * (1 - ph)); });
      made3.forEach((m, i) => { const k = up(t, at("first", 3, 0.68) + i * 0.32, 0.7); move(m.e, mix(940, m.x, k), mix(305, m.y, k) + 2 * Math.sin(t + i)); op(m.e, k); });
      rl3.forEach((l, i) => op(l, up(t, at("first", 3, [0.12, 0.3, 0.46][i]), 0.6)));
    }
  };

  // ================= 4. and it was good: the sun and moon become lights; seven rings of good =================
  const G0 = S("good", 0), G1 = S("good", 1);
  const g4 = G(), hz4 = line(g4, "M150 470 H1130", { "stroke-width": 2.5 });
  const PB = [[200, 470], [330, 150], [950, 150], [1080, 470]];
  const bez = (u) => { const a = (1 - u) ** 3, b = 3 * (1 - u) ** 2 * u, c = 3 * (1 - u) * u * u, d = u ** 3; return [a * PB[0][0] + b * PB[1][0] + c * PB[2][0] + d * PB[3][0], a * PB[0][1] + b * PB[1][1] + c * PB[2][1] + d * PB[3][1]]; };
  const arc4 = line(g4, "M200 470 C330 150 950 150 1080 470", { stroke: LINE, "stroke-width": 2 });
  const ticks4 = [0.2, 0.4, 0.6, 0.8].map((u) => { const [x, y] = bez(u); return el("circle", { cx: x, cy: y, r: 5, fill: BONE, stroke: STONE, "stroke-width": 2 }, g4); });
  const ped4 = [430, 850].map((x) => el("path", { d: `M${x - 52} 470 L${x - 38} 412 L${x + 38} 412 L${x + 52} 470 Z`, fill: WARM, stroke: INK, "stroke-width": 2.2 }, g4));
  const sun4 = G(g4); el("circle", { r: 32, fill: MUSTARD }, sun4);
  const crown4 = [...Array(10)].map((_, i) => { const a = i * Math.PI / 5; return line(sun4, `M${(Math.cos(a) * 42).toFixed(1)} ${(Math.sin(a) * 42).toFixed(1)} L${(Math.cos(a) * 56).toFixed(1)} ${(Math.sin(a) * 56).toFixed(1)}`, { stroke: MUSTARD, "stroke-width": 2.5 }); });
  const moon4 = G(g4); el("path", { d: "M0 -26 A26 26 0 0 0 0 26 A12 26 0 0 1 0 -26 Z", fill: STONE }, moon4);
  const mcrown4 = [...Array(8)].map((_, i) => { const a = i * Math.PI / 4; return line(moon4, `M${(Math.cos(a) * 36).toFixed(1)} ${(Math.sin(a) * 36).toFixed(1)} L${(Math.cos(a) * 46).toFixed(1)} ${(Math.sin(a) * 46).toFixed(1)}`, { stroke: STONE, "stroke-width": 2.2 }); });
  const wor4 = T(g4, "lab", 640, 532, "WORSHIPED AS GODS", 15), lig4 = T(g4, "lab", 640, 532, "LIGHTS, SET TO MARK THE SEASONS", 15);
  const g4b = G();
  const sev = [...Array(7)].map((_, i) => { const x = 640 + (i - 3) * 150, big = i === 6, r = big ? 40 : 28;
    return { x, big, ring: line(g4b, circD(x, 320, r), { "stroke-width": 3, stroke: big ? MUSTARD : INK }), dot: el("circle", { cx: x, cy: 320, r: r - 9, fill: big ? MUSTARD : INK }, g4b),
      lab: T(g4b, "lab", x, big ? 398 : 388, big ? "VERY GOOD" : "GOOD", big ? 16 : 14, null, big ? INK : STONE) }; });
  const und4 = line(g4b, "M190 440 H1090", { stroke: LINE, "stroke-width": 2 });
  const draw4 = (t) => {
    const v = span(t, CS("good") - 0.2, G1 + 0.5, 0.6, 0.7); op(g4, v);
    if (v > 0) {
      draw(hz4, up(t, CS("good"), 1.0));
      const pk = up(t, G0 - 0.4, 0.8), lift = up(t, at("good", 0, 0.58), 1.6), glide = Math.max(0, t - at("good", 0, 0.58)) * 0.012;
      ped4.forEach((p) => op(p, pk * (1 - lift)));
      draw(arc4, up(t, at("good", 0, 0.55), 1.4));
      const [sx, sy] = bez(0.3 + glide), [mx, my] = bez(0.7 + glide);
      move(sun4, mix(430, sx, lift), mix(374, sy, lift) + 2 * Math.sin(t)); op(sun4, pk);
      crown4.forEach((c, i) => { draw(c, up(t, G0 + 0.3 + i * 0.06, 0.5)); op(c, 1 - lift); });
      move(moon4, mix(850, mx, lift), mix(380, my, lift) + 2 * Math.sin(t + 1)); op(moon4, up(t, G0 - 0.1, 0.8));
      mcrown4.forEach((c, i) => { draw(c, up(t, G0 + 0.6 + i * 0.06, 0.5)); op(c, 1 - lift); });
      op(wor4, up(t, at("good", 0, 0.34), 0.6) * (1 - up(t, at("good", 0, 0.56), 0.5)));
      op(lig4, up(t, at("good", 0, 0.64), 0.6));
      ticks4.forEach((k, i) => op(k, up(t, at("good", 0, 0.8) + i * 0.2, 0.5)));
    }
    const v2 = span(t, G1 - 0.4, CS("son") + 0.9, 0.6, 0.8); op(g4b, v2);
    if (v2 > 0) {
      sev.forEach((s, i) => { const a = s.big ? at("good", 1, 0.72) : at("good", 1, 0.04 + i * 0.085);
        draw(s.ring, up(t, a, 0.7)); op(s.dot, up(t, a + 0.4, 0.5)); set(s.dot, { r: ((s.big ? 31 : 19) + 1.5 * Math.sin(t * 1.5 + i)).toFixed(2) }); op(s.lab, up(t, a + 0.3, 0.5)); });
      draw(und4, up(t, at("good", 1, 0.85), 1.4));
    }
  };

  // ================= 5. through the Son: Genesis and the New Testament; all things in, through and for him; the Spirit over the waters =================
  const N0 = S("son", 0), N1 = S("son", 1), N2 = S("son", 2);
  const g5 = G(), shG = sheet(g5, 140, 182, 7, 51), shN = sheet(g5, 140, 182, 7, 52);
  const lG5 = T(g5, "lab", 360, 470, "GENESIS", 15), lN5 = T(g5, "lab", 920, 470, "THE NEW TESTAMENT", 15);
  const thread5 = line(g5, "M440 330 C540 250 740 250 840 330", { stroke: MUSTARD, "stroke-width": 2.5 });
  const field5 = G(g5), rayG5 = G(field5), dotG5 = G(field5);
