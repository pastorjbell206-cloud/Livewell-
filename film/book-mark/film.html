<!-- "Mark: the story at a run". A strip of the book's 16 chapters runs along the bottom for the whole film.
     Above it: a mustard line already running, past two empty frames it does not stop at; Galilee, the hinge
     at chapter 8, the road up to Jerusalem and an open tomb; a crowd whose words reach toward the line and
     miss; three markers on the road; twelve dots who drift, sleep and scatter, and one who is named again;
     a bare cross on a hill with one small square at its foot.
     People are dots. Jesus is never a figure or a dot: his way is the mustard line. The crucifixion is named
     by the voice and never shown: the cross is bare. Peter's confession is at Mark 8:29 (checked in
     client/public/bible/text/mark/8.json), so the hinge sits between chapters 8 and 9.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
