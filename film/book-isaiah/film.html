    small(vComfort, t, partAt[1] + 0.4, T0 - 0.3);
  };
  const drawTrust = (t) => {
    const v = span(t, T0 - 0.3, R0 - 0.2, 0.5, 0.7); op(gT, v); if (v <= 0) { op(vTrust.g, 0); return; }
    const tA = at("trust", 0, "Ahaz"), tH = at("trust", 0, "Hezekiah");
    draw(roadA, up(t, at("trust", 0, "military") - 0.4, 1.4)); draw(roadB, up(t, at("trust", 0, "trusting God") - 0.3, 1.2));
    wheels.forEach((w, i) => { op(w, up(t, at("trust", 0, "military") + i * 0.15, 0.5)); move(w, 700 + i * 54, GY - 20, 1, t * 40); });
    const adv = up(t, tA + 0.5, 1.6) * (1 - up(t, tH + 0.9, 1.6)); op(tBlock, up(t, at("trust", 0, "foreign"), 0.7)); set(tBlock, { x: mix(1000, 470, adv).toFixed(1) });
    op(ahaz.g, up(t, T0 + 0.6, 0.5) * (1 - up(t, tH - 0.2, 0.6) * 0.75)); move(ahaz.g, mix(520, 660, up(t, tA + 0.2, 1.4)), GY - 16); op(ahaz.l, up(t, tA, 0.4));
    op(hez.g, up(t, tH - 0.2, 0.5)); move(hez.g, 520, GY - 16 - 6 * up(t, tH + 0.3, 1.0)); op(hez.l, up(t, tH, 0.4));
    roadB.setAttribute("stroke-width", (4 + 2 * up(t, tH + 0.3, 1.0)).toFixed(1));
    guard.setAttribute("stroke-dashoffset", (1 - up(t, tH + 0.8, 1.4)).toFixed(3));

  };
  const drawRemnant = (t) => {
    const v = span(t, R0 - 0.3, V0 - 0.2, 0.5, 0.7); op(gR, v); if (v <= 0) { op(vRem.g, 0); return; }
    const fall = up(t, R0 + 1.0, 1.8); move(tree, 300, GY, 1, 88 * fall); op(tree, 1 - up(t, R0 + 3.2, 1.2));
    const tEvery = at("remnant", 0, "on Judah");
    towns.forEach((c, i) => { const low = up(t, tEvery + i * 0.45, 1.3); c.g.setAttribute("transform", `translate(${c.x} ${GY}) scale(1 ${mix(1, 0.14, low).toFixed(3)})`); op(c.g, up(t, R0 + 0.2 + i * 0.12, 0.5) * mix(1, 0.5, low)); });
    draw(shoot, up(t, at("remnant", 0, "But it") + 0.2, 2.0));
    back.forEach((b) => { const k = up(t, R1 + 0.6 + b.i * 0.22, 2.4); set(b.e, { cx: mix(1240 + b.i * 20, 372 + b.i * 26, k).toFixed(1), cy: (GY - 10 - 2 * Math.abs(Math.sin(t * 4 + b.i))* (k < 1 ? 1 : 0)).toFixed(1) }); op(b.e, up(t, R1 + 0.5 + b.i * 0.22, 0.4)); });
    small(vRem, t, R0 + 0.8, V0 - 0.3);
  };
  const drawServant = (t) => {
    const tC = at("servant", 0, "A royal"), tS = at("servant", 0, "A Servant"), tM = at("servant", 0, "And an anointed");
    const v = span(t, V0 - 0.2, V2 + 0.4, 0.5, 0.8); op(gS, v);
    if (v > 0) { const dim = 1 - 0.7 * span(t, V1 - 0.3, V2 + 0.4, 0.5); frames.forEach((f, i) => { draw(f, up(t, V0 + 0.3 + i * 0.9, 1.6)); op(f, dim); });
      op(sChild, up(t, tC, 0.7) * dim); op(sLabs[0], up(t, tC + 0.5, 0.5) * dim); sChild.setAttribute("transform", `translate(${PX[0]} ${PY}) rotate(${(3 * Math.sin(t * 1.1)).toFixed(2)}) scale(1.35)`);
      const bow = 18 + 16 * up(t, tS + 0.4, 1.4) + 2 * Math.sin(t * 1.3); op(sServ, up(t, tS, 0.7)); op(sLabs[1], up(t, tS + 0.5, 0.5));
      sLine.setAttribute("d", `M-84 ${(-4).toFixed(1)} Q0 ${bow.toFixed(1)} 84 -4`); sWeight.setAttribute("y", (bow * 0.5 - 50).toFixed(1));
      sFor.forEach((d, i) => d.setAttribute("fill", t > tS + 1.6 + i * 0.2 ? INK : STONE));
      op(sMsg, up(t, tM, 0.7) * dim); op(sLabs[2], up(t, tM + 0.6, 0.5) * dim); news.forEach((n, i) => draw(n, 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 1.6 - i * 0.7)) * up(t, tM + 0.3, 0.8))); }
    const sv = span(t, V1 - 0.3, V2 + 0.3, 0.4, 0.7); op(vServ.g, sv); op(vServ.ref, up(t, V1 + 0.9, 0.6));
    const rv = span(t, V2 + 0.1, N0 - 0.2, 0.6, 0.7); op(gRead, rv);
    if (rv > 0) readers.forEach((r) => { op(r.d, up(t, V2 + 0.7, 0.6)); draw(r.l, up(t, V2 + 1.2, 1.0)); r.d.setAttribute("cy", (420 + 1.5 * Math.sin(t * 0.9)).toFixed(1)); });
  };
  const drawNew = (t) => {
    const v = span(t, N0 - 0.2, ST0 - 0.2, 0.6, 0.7); op(gN, v); if (v <= 0) { op(vNew.g, 0); return; }
    op(hill, up(t, N0 - 0.1, 0.8)); op(zion, up(t, N0 + 0.5, 0.7));
    const flow = up(t, at("new", 0, "all nations") - 0.5, 1.0);
    streams.forEach((s) => s.dots.forEach((d, j) => { const k = ((t * 0.16 + j / 7 + s.k * 0.11) % 1); set(d, { cx: mix(s.x, 640, k).toFixed(1), cy: mix(s.y, 268, k).toFixed(1) }); op(d, flow * Math.min(1, k * 6, (1 - k) * 5)); }));
    const rise = up(t, N1 + 0.4, 3.2); set(sun, { cy: mix(GY + 70, 236, rise).toFixed(1) }); op(sun, rise > 0 ? 1 : 0); draw(sky, up(t, N1 + 1.6, 2.6));
    small(vNew, t, N1 + 0.6, ST0 - 0.3);
  };
  const drawStart = (t) => {
    const v = span(t, ST0 - 0.2, CL0 - 0.2, 0.5, 0.7); op(gH, v); if (v <= 0) return;
    const ta = [at("start", 0, "the prophet's"), at("start", 0, "the exile"), at("start", 0, "and the far")], dimH = 1 - 0.65 * up(t, ST1 - 0.3, 0.7);
    hz.forEach((h, i) => { draw(h, up(t, ta[i] - 0.3, 1.5)); op(h, dimH); op(hzMark[i], up(t, ta[i] + 0.3, 0.6) * dimH); op(hzLab[i], up(t, ta[i] + 0.5, 0.6) * dimH); h.setAttribute("transform", `translate(${(4 * Math.sin(t * 0.5 + i * 1.7)).toFixed(2)} 0)`); });
    poem.forEach((l, i) => { draw(l, up(t, ST0 + 0.1 + i * 0.28, 0.9)); op(l, 1 - up(t, ST1 - 0.5, 0.6)); });
    bigN.forEach((n, i) => { const o = span(t, KW[i], (KW[i + 1] ?? ST1E + 0.7) + 0.1, 0.25); op(n, o); n.setAttribute("y", (250 + 8 * (1 - up(t, KW[i], 0.5))).toFixed(1)); });
  };
  const drawClose = (t) => {
    const v = up(t, CL0 - 0.2, 0.5) * (1 - up(t, END + 0.5, 0.7)); op(gC, v); if (v <= 0) { op(vClose.g, 0); return; }
    const fade = up(t, CL0 + 1.9, 1.5);
    blades.forEach((b, i) => { draw(b, up(t, CL0 - 0.1 + i * 0.06, 0.9)); op(b, 1 - fade); }); op(flower, up(t, CL0 + 0.4, 0.7) * (1 - fade)); flower.setAttribute("transform", `translate(800 400) rotate(${(4 * Math.sin(t * 1.4) + 30 * fade).toFixed(2)})`);
    emp.forEach((e, i) => { const k = up(t, CL0 + i * 0.5, 2.6); set(e, { x: mix(i ? -120 : 1300, i ? 520 : 560, k).toFixed(1) }); op(e, Math.sin(Math.PI * k) * 0.55); });
    draw(stay, up(t, at("close", 0, "One thing") - 0.2, 1.6));
    const cv = up(t, CL1 - 0.3, 0.6) * (1 - up(t, END + 0.5, 0.6)); op(vClose.g, cv); op(vClose.ref, up(t, CL1 + 1.0, 0.6));
  };

  F.title("Isaiah", 96);
  F.endCard(SC.close.titleCard, END + 0.7);
  return (t) => { drawHoly(t); drawLayout(t); drawTrust(t); drawRemnant(t); drawServant(t); drawNew(t); drawStart(t); drawClose(t); drawStrip(t); };
});
