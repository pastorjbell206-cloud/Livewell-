     through the gate, and the wall standing whole.

    const plv = span(t, R0 + 1.0, R2 - 0.6, 0.7, 0.6); op(gPledge, plv); pledges.forEach((p, i) => op(p.e, p.keep ? 1 : 1 - 0.88 * up(t, R0 + 4.6 + i * 0.3, 1.3)));
    // ----- Nehemiah's dot -----
    let nx = 372, ny = 352, nv = 0, ns = 1;
    if (t < L0) { const go = up(t, A0 + 4.2, 2.6), pt = road.getPointAtLength(road.getTotalLength() * go), inn = up(t, A0 + 6.6, 1.2); nx = go > 0 ? mix(pt.x, 930, inn) : 372; ny = go > 0 ? mix(pt.y, 200, inn) : 352; nv = up(t, A0 + 0.6, 0.6) * (1 - up(t, L0 - 0.8, 0.6)); ns = mix(1, 0.7, inn); }
    else if (t < P0 - 0.4) { nx = rx; ny = ry; nv = span(t, W0 + 0.8, W2 - 0.9, 0.6, 0.6); ns = 0.85; }
    else if (t < T0) { nx = rx + 12 * rs; ny = ry - 4 * rs; nv = span(t, P1 - 0.2, PE + 0.4, 0.7, 0.6); ns = 0.85; }
    else if (t < ST) { const walk = up(t, R0 + 1.8, 3.6); nx = mix(rx - 290, rx - 30 * rs, walk); ny = ry; nv = span(t, R0 + 1.4, R2 - 0.9, 0.6, 0.7); ns = 0.8; }
    else { nx = rx; ny = ry; nv = span(t, ST + 0.9, CL - 0.3, 0.6, 0.6); ns = 0.85; }
    op(neh, nv); move(neh, nx, ny + 1.5 * Math.sin(t * 0.9), ns);
    const labV = t < L0 ? span(t, A0 + 1.0, A0 + 4.4, 0.5, 0.5) : 0; op(nehLab, labV); set(nehLab, { x: nx + 6, y: ny - 34 });
    const praying = (t > A1 && t < AE + 0.4 ? 1 : 0) + (t > ST + (STE - ST) * 0.56 && t < STE + 0.3 ? 1 : 0) + (t > W1 - 0.2 && t < W2 - 1 ? 1 : 0);
    prayers.forEach((p, i) => { const k = ((t * 0.5 + i * 0.25) % 1), y = ny - 26 - 54 * k, x = nx + (i - 1.5) * 9; p.setAttribute("d", `M${x.toFixed(1)} ${y.toFixed(1)} v-14`); op(p, praying * nv * Math.sin(Math.PI * k)); });
    // ----- 7: where to start -----
    let cur = -1; KEY.forEach((_, i) => { if (t > keyAt(i) - 0.1) cur = i; });
    const bn = cur >= 0 ? String(KEY[cur]) : ""; if (bigNum.textContent !== bn) bigNum.textContent = bn;
    op(bigNum, cur >= 0 ? Math.min(up(t, keyAt(cur) - 0.1, 0.3), 1 - up(t, ST + (STE - ST) * 0.6, 0.6)) : 0);
    const nmv = span(t, ST + (STE - ST) * 0.8, CL - 0.3, 0.6, 0.6); op(gNames, nmv); nameRows.forEach((r, i) => draw(r, up(t, ST + (STE - ST) * 0.8 + i * 0.14, 0.6)));
    // ----- 8: ordinary weeks -----
    const cl = up(t, CL - 0.2, 0.8) * (1 - up(t, END + 0.5, 0.7)); op(gDays, cl);
    if (cl > 0) { const day = clamp((t - CL) / (END + 0.6 - CL)) * 6, i0 = Math.floor(day), f = ease(day - i0); set(promise, { cx: (460 + (i0 + f) * 60).toFixed(1), cy: (468 - 22 * Math.sin(Math.PI * f)).toFixed(1) }); }
  };
});
