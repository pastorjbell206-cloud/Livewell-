<!-- "Not one sparrow" (doctrine film: providence). One picture in ten scenes: loose pieces that fall into place

     the mustard ring beside him at each step, folding into one event with two arrows, ink and mustard; Ruth's
     walk to the field of Boaz under a line she cannot see, the cast lot in the lap, and a long mustard line
     that passes behind a veil; two sparrows that glide to a branch under Matthew 10:29, then an easy formula
     struck through; the cross with the same two arrows, reaching a world; Athens, the Stoic wheel, the far-off
     gods, and the world held in care; God's rule and free choices opening into three equal columns under one
     bracket; the road of patience, thankfulness and trust, the veil over the road ahead, the world lifted off
     the walker, the knot of wrong and the mustard thread that runs through it; the planned course, the steps
     under Proverbs 16:9, the next step, and the world held.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->

      ch8.forEach((c, i) => { const a = c.a + t * c.sp, x = 640 + c.r * Math.cos(a), y = 330 + c.r * Math.sin(a) * 0.9; set(c.e, { cx: x.toFixed(1), cy: y.toFixed(1) });
        const b = a - 0.3 * Math.sign(c.sp); c.tl.setAttribute("d", `M${(640 + c.r * Math.cos(b)).toFixed(1)} ${(330 + c.r * Math.sin(b) * 0.9).toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)}`);
        const k = up(t, at("differ", 0, 0.25) + i * 0.12, 0.5); op(c.e, k); op(c.tl, k); });
    }
    const v = span(t, D[1] - 0.4, CS("life") + 0.6, 0.6, 0.7); op(g8, v); if (v <= 0) return;
    divs.forEach((d, i) => draw(d, up(t, D[1] - 0.3 + i * 0.3, 1.0)));
    cols.forEach((c, i) => op(c, colOp(i, t)));
    const r0 = D[1], wk = up(t, r0 + 0.3, 2.4), wp = rWritAt(wk); draw(rWrit, wk);
    move(rPen, wp.x + 2, wp.y - 2 - 3 * Math.abs(Math.sin(t * 6)) * (wk < 1 ? 1 : 0) + 1.5 * Math.sin(t * 1.2) * up(t, r0 + 2.8, 0.6), 1, 18); op(rPen, up(t, r0 + 0.1, 0.5));
    rDots.forEach((d, i) => { const k = 0.5 + 0.5 * Math.sin(t * 0.9 + i * 1.3); set(d.e, { cx: (d.x + d.dx * k * 0.8).toFixed(1), cy: (330 + 46 * k).toFixed(1) }); op(d.e, up(t, r0 + 1.2 + i * 0.15, 0.5)); draw(d.a, up(t, r0 + 1.4 + i * 0.15, 0.6)); });
    const a0 = D[2]; draw(aRing, up(t, a0 + 0.2, 1.4));
    aForks.forEach((f, i) => { draw(f.p, up(t, a0 + 0.8 + i * 0.2, 0.7)); const s = Math.sin(t * 0.7 + f.ph); set(f.e, { cx: (f.x + 15 * s).toFixed(1), cy: (f.y - 12 - 6 * Math.abs(s)).toFixed(1) }); op(f.e, up(t, a0 + 1.4 + i * 0.2, 0.5)); });
    const m0 = D[3], pick = up(t, at("differ", 3, 0.6), 1.4);
    mW.forEach((w, i) => { const k = up(t, m0 + 0.3 + i * 0.3, 0.6); const x = 1050 + w.j * 88, y = 244 + 2 * Math.sin(t + i);
      if (w.j === 0) move(w.g, x, mix(y, 386, pick), mix(1, 1.16, pick)); else move(w.g, x, y); op(w.g, k * (w.j === 0 ? 1 : mix(1, 0.35, pick))); });
    draw(mArr, up(t, at("differ", 3, 0.6) + 0.3, 0.8)); op(mArrH, up(t, at("differ", 3, 0.6) + 1.0, 0.3));
    keys8.forEach((kk, i) => kk.forEach((l, j) => op(l, up(t, at("differ", i + 1, [0.3, 0.7][j]), 0.6))));
    draw(brk8, up(t, D[4] - 0.1, 1.2)); op(dot8, up(t, D[4] + 0.6, 0.5)); set(dot8, { r: (6 + Math.sin(t * 2)).toFixed(2) }); op(each8, up(t, D[4] + 0.4, 0.6));
  };

  // ================= 9. what it changes: the road of patience, thankfulness and trust; the knot and the thread =================
  const L = [0, 1, 2, 3].map((k) => S("life", k));
  const lifeD = "M330 400 C410 400 430 470 500 470 C580 470 640 300 740 300 C840 300 880 400 980 400 L1180 400";
  const g9 = G(), heid = sheet(g9, 116, 150, 6, 1563), hLab = [T(g9, "lab", 200, 444, "HEIDELBERG CATECHISM", 13, null, INK), T(g9, "lab", 200, 468, "1563", 13)];
  const road9 = line(g9, lifeD, { stroke: LINE, "stroke-width": 3 }), thread9 = line(g9, lifeD, { stroke: MUSTARD, "stroke-width": 2.6 }), at9 = measure(g9, lifeD);
  const vLab = [T(g9, "lab", 500, 508, "PATIENCE", 14, null, INK), T(g9, "lab", 740, 272, "THANKFULNESS", 14, null, INK), T(g9, "lab", 1090, 372, "TRUST", 14, null, INK)];
  const veil9 = G(g9); el("rect", { x: -100, y: -110, width: 200, height: 220, rx: 8, fill: MUTED, stroke: LINE, "stroke-width": 2 }, veil9); T(veil9, "lab", 0, 6, "NOT KNOWING WHY", 13);
  const knot = line(g9, "M1046 400 C1056 374 1084 418 1092 394 C1100 372 1066 376 1076 404 C1084 424 1104 414 1112 400", { stroke: INK, "stroke-width": 3 });
  const knotLab = T(g9, "lab", 1080, 350, "NAME IT · GRIEVE IT", 13);
  const cross9 = G(g9); el("rect", { x: -3, y: -30, width: 6, height: 58, fill: INK }, cross9); el("rect", { x: -16, y: -18, width: 32, height: 6, fill: INK }, cross9);
  const w9 = globe(g9, 32), cr9 = line(g9, cradleD(0, 0, 44), { stroke: MUSTARD, "stroke-width": 3 });
  const walker = el("circle", { r: 10, fill: INK }, g9);
  const draw9 = (t) => {
    const v = span(t, CS("life") - 0.2, CS("close") + 0.6, 0.6, 0.7); op(g9, v); if (v <= 0) return;
    const hOut = 1 - up(t, L[2] - 0.2, 0.8);
    move(heid, 200, 330 + 3 * Math.sin(t * 0.8)); op(heid, up(t, L[0] - 0.3, 0.7) * hOut); hLab.forEach((l, j) => op(l, up(t, L[0] + 0.2 + j * 0.4, 0.6) * hOut));
    draw(road9, up(t, L[0] + 0.2, 1.6));
    // the walker: along the road through the first line, waits before the veil, walks on, then through the knot
    const f = mix(mix(mix(0.02, 0.69, up(t, at("life", 0, 0.12), Math.max(3, at("life", 0, 0.95) - at("life", 0, 0.12)))), 0.8, up(t, at("life", 2, 0.45), 1.8)), 0.985, up(t, at("life", 3, 0.6), Math.max(2.5, E("life", 3) - at("life", 3, 0.6))));
    const p = at9(f); set(walker, { cx: p.x.toFixed(1), cy: (p.y - 10 - 1.5 * Math.abs(Math.sin(t * 4))).toFixed(1) }); op(walker, up(t, L[0], 0.6));
    vLab.forEach((l, i) => op(l, up(t, at("life", 0, [0.42, 0.62, 0.86][i]), 0.6)));
    vLab[2].setAttribute("y", mix(372, 232, up(t, L[1] + 0.2, 0.9)).toFixed(1));
    const vk = up(t, L[1] + 0.3, 1.1) * (1 - up(t, L[2] + 0.1, 0.9)); move(veil9, 1090, mix(300, 360, up(t, L[1] + 0.3, 1.1)) + 2 * Math.sin(t * 0.7)); op(veil9, vk);
    // the weight lifted
    const wOn = up(t, L[2] - 0.1, 0.6), lift = up(t, at("life", 2, 0.35), 1.6), wp = at9(0.69);
    move(w9, mix(wp.x, 930, lift), mix(wp.y - 52, 196, lift) + 2 * Math.sin(t * 0.8), 1); spin(w9, t); op(w9, wOn);
    move(cr9, 930, 238 + 2 * Math.sin(t * 0.8)); draw(cr9, up(t, at("life", 2, 0.35) + 1.2, 0.9)); op(cr9, up(t, at("life", 2, 0.35) + 1.2, 0.3));
    // the wrong named, and the thread that runs through it
    draw(knot, up(t, L[3] + 0.2, 1.2)); op(knotLab, up(t, at("life", 3, 0.2), 0.6));
    move(cross9, 330, 352 + 2 * Math.sin(t * 0.9)); op(cross9, up(t, at("life", 3, 0.45), 0.7));
    draw(thread9, up(t, at("life", 3, 0.5), 2.8)); op(thread9, up(t, at("life", 3, 0.5), 0.3));
  };

  // ================= 10. the close: the planned course, the steps, the next step, the world held =================
  const Z = [0, 1, 2].map((k) => S("close", k)), END = F.VOICE_END;
  const g10 = G(), PL = [[180, 484], [350, 456], [520, 490], [690, 458], [860, 488], [1030, 460]];
  const plan = []; for (let i = 0; i < PL.length - 1; i++) { const [x1, y1] = PL[i], [x2, y2] = PL[i + 1]; for (let s = 0; s < 6; s++) { const a = s / 6, b = (s + 0.55) / 6; plan.push(line(g10, `M${mix(x1, x2, a).toFixed(1)} ${mix(y1, y2, a).toFixed(1)} L${mix(x1, x2, b).toFixed(1)} ${mix(y1, y2, b).toFixed(1)}`, { stroke: STONE, "stroke-width": 2.2 })); } }
  const planPts = PL.map(([x, y]) => el("circle", { cx: x, cy: y, r: 7, fill: PAPER, stroke: INK, "stroke-width": 2.2 }, g10));
  const jamesLab = T(g10, "lab", 640, 548, "IF THE LORD IS WILLING · JAMES 4:15", 14);
  const steps = [...Array(14)].map((_, i) => { const x = 190 + i * 62, y = 392 + 14 * Math.sin(x / 150) + (i % 2 ? 9 : -9); return { x, y, e: el("ellipse", { cx: x, cy: y, rx: 9, ry: 5.5, fill: i === 13 ? MUSTARD : INK }, g10) }; });
  const vz = ["A man’s heart plans his course,", "but the LORD determines his steps."].map((s, i) => T(g10, "disp", 640, 168 + i * 52, s, 44));
  const refz = T(g10, "lab", 640, 262, "PROVERBS 16:9 · BEREAN STANDARD BIBLE", 14);
  const w10 = globe(g10, 28), cr10 = line(g10, cradleD(1150, 372, 40), { stroke: MUSTARD, "stroke-width": 3 });
  const draw10 = (t) => {
    const v = span(t, CS("close") - 0.2, END + 2.5, 0.7, 0.9); op(g10, v); if (v <= 0) return;
    const pd = mix(1, 0.45, up(t, Z[1] + 1.0, 1.2));
    plan.forEach((s, i) => { draw(s, up(t, Z[0] + 0.3 + i * 0.06, 0.25)); op(s, pd); }); planPts.forEach((p, i) => { op(p, up(t, Z[0] + 0.3 + i * 0.36, 0.4) * pd); set(p, { r: (7 + 0.8 * Math.sin(t * 1.6 + i)).toFixed(2) }); });

    const wk = up(t, at("close", 2, 0.4), 0.9); move(w10, 1150, mix(360, 326, wk) + 2 * Math.sin(t * 0.8)); spin(w10, t); op(w10, wk);
    draw(cr10, up(t, at("close", 2, 0.5), 1.0)); op(cr10, up(t, at("close", 2, 0.5), 0.3));
  };

  F.title("Not one sparrow");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.9);
  return (t) => { draw1(t); draw2(t); draw3(t); draw4(t); draw5(t); draw6(t); draw7(t); draw8(t); draw9(t); draw10(t); };
});
