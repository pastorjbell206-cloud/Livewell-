<!-- "Nicaea to Chalcedon" (church history film, lesson "The Great Councils"). One continuous picture in ten

     and the plank that cannot cross the gap, the eastern churches split; bishops gathering to Nicaea, the
     creed's words, the book they protect, John 1:1; fifty-six years on a line, Athanasius's five exiles, the
     slow walk against power; Father, Son and Spirit, and the road between two cliffs; God and man, the rivals,
     Ephesus and the scale of Nestorius; Chalcedon's one ring and two doors; the break that has never healed,
     and the cross again; the tent of John 1:14 and the ground the four councils marked out.
     Words and timing come from script.json (and timeline.json once recorded). Open with ?t=42 to freeze. -->

Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;

  const CS = (id) => CH[id].start;
  const W = (id, k, f) => S(id, k) + (E(id, k) - S(id, k)) * f;          // a moment inside line k

  };
  const drawHolding = (o, t, t0, offL, offR, litL, litR) => {

    o.sides.forEach((s, i) => { const k = up(t, t0 + 0.8 + i * 0.3, 0.7), off = i ? offR : offL, lit = i ? litR : litL;
      op(s.sg, k * (1 - 0.78 * off)); move(s.sg, 0, 2 * Math.sin(t * 0.9 + i)); draw(s.c, up(t, t0 + 1.0 + i * 0.3, 0.8)); op(s.c, 1 - 0.8 * off); op(s.ghost, k * off);
      s.r.setAttribute("stroke", lit > 0.5 ? MUSTARD : INK); s.r.setAttribute("stroke-width", (2.6 + 1.4 * lit).toFixed(2)); });

  // ================= 1. the question: one word, and what lies under it =================

  const oneLab = T(g1, "lab", 0, 0, "ONE WORD", 15);

    bars1.forEach((b, i) => { if (i === KEY) return; op(b, up(t, Q0 - 0.5 + i * 0.09, 0.5) * dim * (1 - out)); move(b, b._cx, 300 + 2 * Math.sin(t * 1.3 + i)); });
    const kb = bars1[KEY], lift = up(t, W("question", 0, 0.22), 1.1), drop = up(t, Q1 - 0.2, 1.3);
    kb.setAttribute("fill", lift > 0.3 ? MUSTARD : INK);
    move(kb, mix(kb._cx, 640, drop), mix(mix(300, 226, lift), 470, drop) + 3 * Math.sin(t * 1.1) * (1 - drop), mix(1, 1.8, lift) * mix(1, 0.6, drop));
    op(kb, up(t, Q0 - 0.5 + KEY * 0.09, 0.5) * (1 - up(t, Q1 + 0.8, 0.6)));

    rings1.forEach((r, i) => { op(r, up(t, W("question", 1, 0.1) + i * 0.3, 0.6)); set(r, { r: (12 + 1.6 * Math.sin(t * 1.4 + i)).toFixed(2) }); });
    op(counLab, up(t, W("question", 1, 0.2), 0.7));
    op(who, up(t, W("question", 1, 0.5), 0.9)); who.setAttribute("y", (336 - 8 * up(t, W("question", 1, 0.5), 3) + 2 * Math.sin(t * 0.8)).toFixed(1));
    op(who2, up(t, W("question", 1, 0.76), 0.7));
  };

  // ================= 2. why the words mattered: worship ahead of words; the cross and two truths =================
  const B0 = S("stakes", 0), B1 = S("stakes", 1), B2 = S("stakes", 2);
  const g2a = G(), lnW = line(g2a, "M220 262 H1060", { "stroke-width": 4 }), labW = T(g2a, "lab", 220, 236, "WORSHIP · FROM THE BEGINNING", 15, "start");
  const dashes = [...Array(7)].map((_, i) => el("rect", { x: 220 + i * 30, y: 378, width: 18, height: 4, rx: 2, fill: STONE }, g2a));
  const labA = T(g2a, "lab", 220, 354, "AGREED WORDS · NOT YET", 15, "start"), qA = T(g2a, "disp", 470, 398, "?", 58, null, MUSTARD);
  const g2b = G(), H2 = holding(g2b);
  const noble = T(g2b, "lab", 300, 412, "A NOBLE DEATH, NOTHING MORE", 14), never = T(g2b, "lab", 980, 412, "OUR FLESH NEVER TOUCHED", 14);
  const draw2 = (t) => {
    const va = span(t, B0 - 0.5, B1 + 0.1, 0.6, 0.6); op(g2a, va);
    if (va > 0) { draw(lnW, up(t, B0 + 0.1, 2.2)); op(labW, up(t, B0 + 0.3, 0.6));
      dashes.forEach((d, i) => op(d, up(t, W("stakes", 0, 0.5) + i * 0.22, 0.4))); op(labA, up(t, W("stakes", 0, 0.48), 0.6)); op(qA, up(t, W("stakes", 0, 0.85), 0.6) * (0.75 + 0.25 * Math.sin(t * 2))); }

  };

  // ================= 3. Arius: Alexandria; the stair of creatures; the gap; the churches split =================
  const A = [0, 1, 2, 3].map((k) => S("arius", k));
  const [AX, AY] = CITY.alexandria;
  const g3 = G(), cDots3 = CHURCHES.map((c) => el("circle", { cx: c.x, cy: c.y, r: 4.5, fill: STONE }, g3));

  const arius3 = T(g3, "lab", AX, AY - 26, "ARIUS", 15, null, INK);

  const chant3 = [[600, 212], [760, 236], [470, 250]].map(([x, y]) => { const g = G(g3); move(g, x, y); return [10, 17, 24].map((r) => el("path", { d: `M${(r * 0.7).toFixed(1)} ${(-r * 0.7).toFixed(1)} A${r} ${r} 0 0 1 ${(r * 0.7).toFixed(1)} ${(r * 0.7).toFixed(1)}`, stroke: INK, "stroke-width": 2, fill: "none", "stroke-linecap": "round" }, g)); });
  const crowdLab = T(g3, "lab", 640, 132, "CROWDS IN THE STREETS", 14), splitLab = T(g3, "lab", 1220, 566, "THE EASTERN CHURCHES, SPLIT", 14, "end");
  const g3b = G(), divide = line(g3b, "M280 200 H1000", { stroke: LINE, "stroke-width": 2.5 }), creatorLab = T(g3b, "lab", 640, 176, "THE CREATOR", 14), creaturesLab = T(g3b, "lab", 320, 536, "CREATURES", 14, "start");

  const godLab = T(g3c, "lab", 270, 306, "GOD", 16, null, INK), manLab = T(g3c, "lab", 1010, 306, "MAN", 16, null, INK);
  const plank = el("rect", { y: 318, height: 10, rx: 3, fill: MUSTARD }, g3c), plankLab = T(g3c, "lab", 0, 296, "A CREATED SAVIOR", 14);
  const gapLab = T(g3c, "lab", 640, 446, "CAN'T BRIDGE THE GAP", 14);
  const draw3 = (t) => {
    const v = Math.max(span(t, A[0] - 0.7, A[1] + 0.1, 0.6, 0.6), span(t, A[3] - 0.4, CS("nicaea") + 1.2, 0.6, 0.7)); op(g3, v);

      op(alex3, up(t, A[0] - 0.3, 0.5)); op(alexLab3, up(t, A[0] + 0.2, 0.6)); op(arius3, up(t, W("arius", 0, 0.35), 0.6));

    }
    const vb = span(t, A[1] - 0.3, A[2] + 0.2, 0.6, 0.6); op(g3b, vb);

      op(highLab, up(t, W("arius", 1, 0.55), 0.6)); op(stillLab, up(t, W("arius", 1, 0.82), 0.6)); }

      move(plankLab, 850 - w / 2 - 10, 0); op(plankLab, up(t, W("arius", 2, 0.35), 0.6)); op(gapLab, up(t, W("arius", 2, 0.75), 0.6) * (0.8 + 0.2 * Math.sin(t * 1.6))); }

  const [NX, NY] = CITY.nicaea;
  const g4 = G(), g4map = G(g4), nicDot = el("circle", { cx: NX, cy: NY, r: 9, fill: INK }, g4map), nicLab = T(g4map, "lab", NX, NY - 36, "NICAEA", 14, null, INK);
  const thr4 = throne(g4map), conLab = T(g4map, "lab", 300, 470, "CONSTANTINE", 14, null, INK), conLab2 = T(g4map, "lab", 300, 494, "WANTING UNITY", 13);

    return { ...c, e: el("circle", { r: 5, fill: INK }, g4), nx: NX + Math.cos(ca) * cr * 1.1, ny: NY + 14 + Math.sin(ca) * cr * 0.55, ex: 640 + Math.cos(a) * 380, ey: 330 + Math.sin(a) * 178 }; });
  const gathLab = T(g4, "lab", 640, 552, "THE SCATTERED CHURCH, GATHERED", 14);

  const creedL = CL.map((parts, i) => { const e = el("text", { class: "disp", x: 640, y: 288 + i * 52, style: "font-size:42px;" }, creed); const spans = parts.map((p) => { const ts = el("tspan", {}, e); ts.textContent = p; return ts; }); e._key = spans[1]; return e; });
  const borrowLab = T(g4, "lab", 640, 132, "A WORD NOT IN SCRIPTURE", 14, null, INK);

  const v4 = G(g4), v4a = T(v4, "disp", 640, 214, "In the beginning was the Word,", 46), v4b = T(v4, "disp", 640, 268, "and the Word was with God, and the Word was God.", 46);
  const v4ref = T(v4, "lab", 640, 314, "JOHN 1:1 · BEREAN STANDARD BIBLE", 14);
  const draw4 = (t) => {
    const v = span(t, N[0] - 0.6, CS("after") + 1.1, 0.6, 0.7); op(g4, v); if (v <= 0) return;
    const mapV = span(t, N[0] - 0.6, N[1] + 0.6, 0.6, 0.9); op(g4map, mapV);
    op(nicDot, up(t, N[0] - 0.2, 0.5)); op(nicLab, up(t, N[0] + 0.3, 0.6)); set(nicDot, { r: (9 + 1.5 * Math.sin(t * 2)).toFixed(2) });
    move(thr4, 300, 420 + 2 * Math.sin(t)); op(thr4, up(t, W("nicaea", 0, 0.12), 0.7)); op(conLab, up(t, W("nicaea", 0, 0.2), 0.6)); op(conLab2, up(t, W("nicaea", 0, 0.38), 0.6));

    op(borrowLab, span(t, W("nicaea", 3, 0.2), N[4] - 0.7, 0.6, 0.5));

    rays4.forEach((r, i) => { draw(r, up(t, N[4] + 0.6 + i * 0.12, 0.6)); op(r, 0.55 + 0.45 * Math.sin(t * 1.4 + i)); });
    op(v4a, up(t, N[4], 0.8)); op(v4b, up(t, N[4] + 1.2, 0.8)); op(v4ref, up(t, N[4] + 1.8, 0.7));
  };

    doors.forEach((d, i) => { const k = up(t, i ? d2 : d1, 1.4); op(d.g, up(t, C[1] - 0.6 + i * 0.3, 0.6)); d.panel.setAttribute("transform", `translate(${d.hx} 230) scale(${mix(0.16, 1, k).toFixed(3)} 1)`); d.knob.setAttribute("transform", `translate(${d.hx} 230) scale(${mix(0.16, 1, k).toFixed(3)} 1)`);
      dl[i].forEach((l, j) => op(l, up(t, (i ? d2 : d1) + 0.2 + j * 0.5, 0.6))); });
  };

  // ================= 9. what it cost: the break that has never healed; the cross held again =================
  const D = [0, 1, 2, 3].map((k) => S("cost", k));
  const g9 = G(), cDots9 = CHURCHES.map((c) => el("circle", { cx: c.x, cy: c.y, r: 4.6, fill: INK }, g9));
  const bez = (k) => { const P0 = [1010, 132], P1 = [880, 300], P2 = [720, 470], P3 = [380, 500], m = 1 - k; return [0, 1].map((j) => m * m * m * P0[j] + 3 * m * m * k * P1[j] + 3 * m * k * k * P2[j] + k * k * k * P3[j]); };
  const crack = [...Array(34)].map((_, i) => { const [x1, y1] = bez(i / 34), [x2, y2] = bez((i + 0.55) / 34); return el("line", { x1, y1, x2, y2, stroke: STONE, "stroke-width": 3, "stroke-linecap": "round" }, g9); });
  const egy = T(g9, "lab", 684, 552, "EGYPT", 14, "start", INK), syr = T(g9, "lab", 958, 528, "SYRIA", 14, "start", INK), eas = T(g9, "lab", 1094, 262, "THE EAST", 14, null, INK);
  const never9 = T(g9, "lab", 1010, 112, "THE BREAK HAS NEVER HEALED", 13), read9 = T(g9, "lab", 560, 112, "READ DIFFERENTLY TO THIS DAY", 13);
  const bk9 = [[286, 410], [1116, 500]].map(([x, y]) => { const b = book(g9); b._x = x; b._y = y; return b; });
  const g9b = G(), H9 = holding(g9b);
  const love9 = T(g9b, "lab", 300, 412, "GOD'S OWN LOVE", 14, null, INK), flesh9 = T(g9b, "lab", 980, 412, "OUR FLESH AND DEATH", 14, null, INK), flesh9b = T(g9b, "lab", 980, 436, "CARRIED INTO GOD", 14, null, INK);
  const draw9 = (t) => {
    const v = span(t, D[0] - 0.6, D[2] + 0.2, 0.6, 0.7); op(g9, v);
    if (v > 0) { cDots9.forEach((d, i) => { op(d, up(t, D[0] - 0.5 + CHURCHES[i].p * 0.8, 0.6)); d.setAttribute("cy", (CHURCHES[i].y + 1.5 * Math.sin(t * 1.1 + i)).toFixed(1)); });
      const ck = W("cost", 0, 0.35), cd = Math.max(2.5, E("cost", 0) - ck);
      crack.forEach((s, i) => op(s, up(t, ck + (i / crack.length) * cd, 0.4) * (0.75 + 0.25 * Math.sin(t * 1.3 - i * 0.2))));
      op(egy, up(t, W("cost", 0, 0.42), 0.6)); op(syr, up(t, W("cost", 0, 0.48), 0.6)); op(eas, up(t, W("cost", 0, 0.55), 0.6));
      op(never9, span(t, W("cost", 0, 0.85), D[1] + 0.3, 0.6, 0.5)); op(read9, up(t, W("cost", 1, 0.1), 0.6));
      bk9.forEach((b, i) => { move(b, b._x, b._y + 2 * Math.sin(t + i), 0.42); op(b, up(t, W("cost", 1, 0.15) + i * 0.4, 0.7)); b._lines.forEach((l) => draw(l, up(t, W("cost", 1, 0.3) + i * 0.4, 0.8))); }); }
    const vb = span(t, D[2] - 0.3, S("close", 0) - 0.1, 0.6, 0.7); op(g9b, vb); if (vb <= 0) return;

    drawHolding(H9, t, D[2] - 0.2, span(t, ta, ta + 1.3, 0.5), span(t, tb, tb + 1.3, 0.5), up(t, W("cost", 2, 0.4), 0.5), up(t, W("cost", 3, 0.15), 0.5));
    op(love9, up(t, W("cost", 2, 0.6), 0.6)); op(flesh9, up(t, W("cost", 3, 0.25), 0.6)); op(flesh9b, up(t, W("cost", 3, 0.4), 0.6));
  };

  // ================= 10. the tent of John 1:14; the ground the councils marked out =================
  const Z = [0, 1, 2].map((k) => S("close", k)), END = F.VOICE_END;
  const g10 = G(), ground = line(g10, "M140 480 H1140", { stroke: STONE, "stroke-width": 2.5 }), groundIn = line(g10, "M230 480 H1050", { stroke: INK, "stroke-width": 3.5 });
  const tentGlow = el("path", { d: "M640 392 L676 480 L604 480 Z", fill: MUSTARD }, g10);
  const tent = line(g10, "M534 480 L640 352 L746 480 M640 352 L640 392 M604 480 L640 392 L676 480 M640 352 L626 336 M640 352 L654 336", { "stroke-width": 3.4 });
  const stones = [[230, "NICAEA", "325"], [462, "CONSTANTINOPLE", "381"], [818, "EPHESUS", "431"], [1050, "CHALCEDON", "451"]].map(([x, a, b]) => { const g = G(g10);
    const s = el("rect", { x: -13, y: -44, width: 26, height: 44, rx: 8, fill: PAPER, stroke: INK, "stroke-width": 2.6 }, g), cap = el("circle", { cx: 0, cy: -44, r: 5, fill: MUSTARD }, g);
    T(g, "lab", 0, 30, a, 13, null, INK); T(g, "lab", 0, 52, b, 13); g._x = x; g._cap = cap; return g; });
  const v10 = T(g10, "disp", 640, 208, "The Word became flesh and made His dwelling among us.", 46), v10ref = T(g10, "lab", 640, 254, "JOHN 1:14 · BEREAN STANDARD BIBLE", 14);
  const draw10 = (t) => {

    const vv = 1 - up(t, Z[1] + 0.4, 0.7); op(v10, up(t, Z[0], 0.8) * vv); op(v10ref, up(t, Z[0] + 1.0, 0.7) * vv);
    stones.forEach((g, i) => { const k = up(t, W("close", 1, 0.25) + i * 0.45, 0.7); move(g, g._x, 480 + 6 * (1 - k)); op(g, k); op(g._cap, up(t, Z[2] + 0.4 + i * 0.6, 0.7) * (0.75 + 0.25 * Math.sin(t * 1.4 + i))); });
    draw(groundIn, up(t, W("close", 1, 0.55), 2.2));

  F.title("Nicaea to Chalcedon");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.9);
  return (t) => { draw1(t); draw2(t); draw3(t); draw4(t); draw5(t); draw6(t); draw7(t); draw8(t); draw9(t); draw10(t); };
});
