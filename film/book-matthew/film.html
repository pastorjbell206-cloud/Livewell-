<!-- "Matthew: God with us". A strip of the book's 28 chapters runs along the bottom for the whole film.
     Above it: a family line traced back through King David to Abraham; story and speech alternating, with the
     five discourses; an old scroll whose lines land on a mustard line; a ring arriving (God's reign); one dot
     stepping forward at chapter 16 and the road to Jerusalem; dots of one kind around one scroll, then the
     scroll's line going out to every edge; the key chapters; the line running the whole length of the book.
     People are dots. God and Christ are never drawn: Jesus is a mustard line, the cross two bare strokes,
     the tomb an open mound. Nothing here blames the Jewish people: the argument is drawn inside one family.
     The five discourses are chapters 5 to 7, 10, 13, 18 and 24 to 25; each closes with "had finished" at
     7:28, 11:1, 13:53, 19:1 and 26:1 (checked in client/public/bible/text/matthew/).
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
