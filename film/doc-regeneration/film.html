<!-- "Born again" (doctrine film: regeneration). One heart carries the first half: a heart of stone that polish
     cannot change; the light given inside a person and the changed life it walks out into; the heart in Hebrew
     (thought, will, desire) and the flood that cleansed the earth but not the heart; the road to Babylon, the
     command and the promise side by side, and the stone heart made flesh; the valley of dry bones and the breath
     (ruach) that stands them up. Then the night visit (John 3:3) and the one Greek word, again and from above;
     the new creation, the washing (Titus 3:5) and the word (1 Peter 1:23) as two equal panels; Justin's water and
     the revivals' banner on one timeline; where Christians differ, two equal panels for each question (order,
     then baptism) with one touch of mustard each, and four cards under one light; the teacher, the bones again,
     two roads to faith, the sprout with four signs of life and the newborn; and the wind over the grass
     (John 3:8) as the sprout grows and the sun comes up on the whole field.
     Words and timing come from script.json and timeline.json. Open with ?t=42 to freeze on second 42. -->
<html lang="en"><head><meta charset="utf-8"><title>Born again</title></head><body>
<script src="../lib/engine.js"></script>
<script>
Film.make((F) => {
  const { el, txt, set, op, draw, line, move, clamp, ease, up, span, mix, rng, S, E, TL, world, INK, BONE, WARM, MUTED, STONE, MUSTARD, LINE, CHAR } = F;
  const PAPER = "#FBF9F5";
  const CH = Object.fromEntries(TL.chapters.map((c) => [c.id, c]));
  const CS = (id) => CH[id].start;
  const Ls = (id) => CH[id].lines.map((_, k) => S(id, k));
  const at = (id, k, f) => S(id, k) + (E(id, k) - S(id, k)) * f;          // a moment part-way through line k
  const T = (p, cls, x, y, s, size, anchor, fill) => { const e = txt(p, cls, x, y, s, size, fill ? { fill } : undefined); if (anchor) e.setAttribute("style", (e.getAttribute("style") || "") + `text-anchor:${anchor};`); return e; };
  const G = (p) => el("g", {}, p || world);
  const R = rng(41);
  const keys = (t, K) => { if (t <= K[0][0]) return K[0].slice(1); for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const k = ease((t - K[i - 1][0]) / (K[i][0] - K[i - 1][0])); return K[i - 1].slice(1).map((v, j) => mix(v, K[i][j + 1], k)); } return K.at(-1).slice(1); };
  // a falling column of small dots (light or water)
  const stream = (p, n, fill = MUSTARD, r = 3.2) => [...Array(n)].map(() => el("circle", { r, fill }, p));
  const runStream = (dots, t, x, y0, y1, v, speed = 36) => { const L = y1 - y0; dots.forEach((d, i) => { const y = y0 + (((t * speed + (i * L) / dots.length) % L) + L) % L; set(d, { cx: x, cy: y.toFixed(1) }); op(d, v * clamp(Math.min((y - y0) / 14, (y1 - y) / 14))); }); };
  // an open book, a basin, a bone
  const pageD = (s) => `M0 -50 C${-40 * s} -70 ${-110 * s} -70 ${-150 * s} -55 L${-150 * s} 55 C${-110 * s} 40 ${-40 * s} 40 0 60 Z`;
  const mkBook = (p) => { const g = G(p); [1, -1].forEach((s) => el("path", { d: pageD(s), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, g));
    [1, -1].forEach((s) => [-28, -10, 8, 26].forEach((dy) => el("path", { d: `M${-22 * s} ${dy - 8} C${-60 * s} ${dy - 20} ${-100 * s} ${dy - 20} ${-132 * s} ${dy - 10}`, stroke: STONE, "stroke-width": 2.2, fill: "none" }, g))); return g; };
  const mkBasin = (p) => { const g = G(p); el("path", { d: "M-14 44 L-22 64 H22 L14 44", fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, g);
    el("path", { d: "M-62 -8 Q-60 44 0 46 Q60 44 62 -8 Z", fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, g);
    g._water = el("path", { stroke: STONE, "stroke-width": 2.4, fill: "none", "stroke-linecap": "round" }, g); return g; };
  const ripple = (b, t) => { const w = 3 * Math.sin(t * 2.2); b._water.setAttribute("d", `M-54 4 Q-27 ${(4 + w).toFixed(1)} 0 4 Q27 ${(4 - w).toFixed(1)} 54 4`); };
  const mkBone = (p) => { const g = G(p); el("line", { x1: -15, y1: 0, x2: 15, y2: 0, stroke: STONE, "stroke-width": 5, "stroke-linecap": "round" }, g); [-1, 1].forEach((s) => [-1, 1].forEach((u) => el("circle", { cx: s * 17, cy: u * 3.2, r: 3.6, fill: STONE }, g))); return g; };
  const HEART = "M0 50 C-30 25 -62 2 -62 -24 C-62 -47 -45 -60 -28 -60 C-14 -60 -5 -52 0 -41 C5 -52 14 -60 28 -60 C45 -60 62 -47 62 -24 C62 2 30 25 0 50 Z";
  const STONEP = "M0 50 L-38 20 L-60 -8 L-60 -38 L-42 -58 L-18 -58 L0 -41 L18 -58 L42 -58 L60 -38 L60 -8 L38 20 Z";

  // ================= the heart, carried through the first four scenes =================
  const Q = Ls("question"), C = Ls("confess"), H = Ls("heart"), P = Ls("promise");
  const hg = G();
  const hStone = el("path", { d: STONEP, fill: MUTED, stroke: STONE, "stroke-width": 3, "stroke-linejoin": "round" }, hg);
  const hCr = ["M-22 -50 L-12 -30 L-26 -12 L-16 8", "M30 -48 L20 -22 L34 -4", "M-2 12 L8 26 L0 40"].map((d) => line(hg, d, { stroke: STONE, "stroke-width": 2 }));
  const hShine = [0, 1, 2].map((i) => line(hg, `M${-44 + i * 8} ${-26 + i * 20} Q${-4 + i * 3} ${-46 + i * 20} ${40 - i * 8} ${-24 + i * 20}`, { stroke: PAPER, "stroke-width": 4 }));
  const hFill = el("path", { d: HEART, fill: PAPER }, hg), hLine = line(hg, HEART, { stroke: INK, "stroke-width": 3 });
  const hCore = G(hg); el("path", { d: HEART, fill: MUSTARD }, hCore);
  const hGlow = el("circle", { r: 9, fill: MUSTARD }, hg);
  const HK = [[0, 640, 330, 1.45], [CS("confess") + 0.3, 640, 330, 1.45], [CS("confess") + 1.5, 640, 365, 0.95], [CS("heart") + 0.1, 640, 365, 0.95], [CS("heart") + 1.3, 640, 325, 1.45],
    [H[1] - 0.1, 640, 325, 1.45], [H[1] + 1.1, 640, 422, 0.8], [CS("promise") + 0.2, 640, 422, 0.8], [CS("promise") + 1.4, 640, 390, 1.2]];
  const drawHeart = (t) => {
    const vis = up(t, Q[0] - 0.2, 0.9) * (1 - up(t, P[2] - 0.3, 0.7)); op(hg, vis); if (vis <= 0) return;
    const stoneK = 1 - up(t, at("promise", 1, 0.35), 1.6), fleshK = up(t, at("promise", 1, 0.4), 1.8);
    const beat = 1 + 0.03 * fleshK * Math.pow(Math.max(0, Math.sin(t * 4.2)), 8);
    const [hx, hy, hs] = keys(t, HK); move(hg, hx, hy + 2 * Math.sin(t * 0.9), hs * beat);
    op(hStone, stoneK); hCr.forEach((c, i) => { draw(c, up(t, Q[0] + 0.3 + i * 0.35, 0.9)); op(c, stoneK); });
    hShine.forEach((s, i) => { const a = at("question", 0, 0.32) + i * 0.6; draw(s, up(t, a, 0.6)); op(s, up(t, a, 0.2) * (1 - up(t, a + 0.7, 0.6))); });
    op(hFill, fleshK); draw(hLine, fleshK); op(hLine, fleshK > 0 ? 1 : 0);
    move(hCore, 0, 4, 0.3 * (1 + 0.1 * Math.sin(t * 2.4))); op(hCore, fleshK * 0.9);
    const gk = span(t, at("confess", 0, 0.62), CS("heart") + 1.0, 0.6, 0.8); set(hGlow, { r: (8 + 2.5 * Math.sin(t * 2.6)).toFixed(1) }); op(hGlow, gk);
  };

  // ================= 1. the question: polish on a stone heart; at the root?; born again =================
  const g1 = G();
  const ring1 = el("circle", { cx: 640, cy: 330, r: 128, fill: "none", stroke: STONE, "stroke-width": 2.2, "stroke-dasharray": "7 9" }, g1);
  const tryLab = T(g1, "lab", 452, 336, "TRY HARDER", 15, "end"), rootLab = T(g1, "lab", 828, 336, "AT THE ROOT?", 15, "start");
  const qMark = T(g1, "disp", 772, 222, "?", 60, null, MUSTARD);
  const ba = G(), baText = T(ba, "ital", 0, 0, "born again", 66);
  const baBars = [[-146, 116], [-4, 150]].map(([x, w]) => el("rect", { x, y: 8, width: w, height: 5, rx: 2.5, fill: STONE }, ba));
  const BA = [[0, 640, 528, 1], [CS("confess") + 0.2, 640, 528, 1], [CS("confess") + 1.4, 640, 214, 0.55]];
  const draw1 = (t) => {
    const v = span(t, Q[0] - 0.3, CS("confess") + 0.6, 0.6, 0.7); op(g1, v);
    if (v > 0) { set(ring1, { transform: `rotate(${(t * 7).toFixed(2)} 640 330)` }); op(ring1, up(t, at("question", 0, 0.62), 0.8));
      op(tryLab, up(t, at("question", 0, 0.34), 0.6)); op(rootLab, up(t, at("question", 0, 0.66), 0.6)); op(qMark, up(t, at("question", 0, 0.8), 0.7)); }
    const bv = up(t, Q[1] - 0.2, 0.6) * (1 - up(t, CS("heart") - 0.2, 0.7)); op(ba, bv);
    if (bv > 0) { const [x, y, s] = keys(t, BA); move(ba, x, y + 2 * Math.sin(t * 0.8), s);
      baBars.forEach((b, i) => op(b, up(t, Q[1] + 0.3 + i * 0.3, 0.5) * (1 - up(t, at("question", 1, 0.62), 0.6)))); op(baText, up(t, at("question", 1, 0.62), 0.8)); }
  };

  // ================= 2. what Christians confess: regeneration; life given; a changed life =================
  const g2 = G();
  const regen = T(g2, "disp", 640, 162, "regeneration", 60);
  const ring2 = line(g2, "M640 255 A105 105 0 1 1 639.9 255", { stroke: INK, "stroke-width": 2.5 });
  const light2 = stream(g2, 7);
  const actLab = T(g2, "lab", 772, 290, "GOD'S ACT · LIFE GIVEN", 14, "start"), inLab = T(g2, "lab", 515, 371, "INSIDE", 14, "end");
  const steps = [...Array(11)].map((_, i) => ({ x: 772 + i * 38, y: 392 + i * i * 0.45, e: el("circle", { r: 5, fill: INK }, g2) }));
  const lifeLab = T(g2, "lab", 960, 494, "A CHANGED LIFE", 14);
  const draw2 = (t) => {
    const v = span(t, CS("confess") - 0.1, CS("heart") + 0.6, 0.6, 0.7); op(g2, v); if (v <= 0) return;
    op(regen, up(t, C[0] + 0.1, 0.8)); set(regen, { y: (162 - 4 * up(t, C[0], 3)).toFixed(1) });
    draw(ring2, up(t, CS("confess") + 0.9, 1.4));
    runStream(light2, t, 640, 238, 352, up(t, at("confess", 0, 0.45), 0.6) * (1 - up(t, CS("heart"), 0.5)));
    op(actLab, up(t, at("confess", 0, 0.5), 0.6)); op(inLab, up(t, at("confess", 1, 0.25), 0.6));
    steps.forEach((s, i) => { const k = up(t, at("confess", 1, 0.55) + i * 0.2, 0.35); op(s.e, k); set(s.e, { cx: s.x, cy: (s.y - 4 * Math.abs(Math.sin(t * 2 + i))).toFixed(1) }); });
    op(lifeLab, up(t, at("confess", 1, 0.75), 0.6));
  };

  // ================= 3. trouble in the heart: thought, will, desire; the flood =================
  const g3 = G();
  const levLab = T(g3, "lab", 640, 150, "LEV · THE HEART, IN HEBREW", 15);
  const ring3 = line(g3, "M640 197 A128 128 0 1 1 639.9 197", { stroke: STONE, "stroke-width": 2 });
  const SP = [[[552, 282], [430, 244], "THOUGHT", 414, 250, "end"], [[728, 282], [850, 244], "WILL", 866, 250, "start"], [[640, 406], [640, 460], "DESIRE", 640, 494, null]];
  const spokes = SP.map(([a, b, name, lx, ly, anc]) => ({ l: line(g3, `M${a[0]} ${a[1]} L${b[0]} ${b[1]}`, { stroke: STONE, "stroke-width": 2 }), d: el("circle", { cx: b[0], cy: b[1], r: 5, fill: INK }, g3), lab: T(g3, "lab", lx, ly, name, 16, anc) }));
  const g3b = G();
  const ground3 = line(g3b, "M160 470 H1120", { "stroke-width": 2.5 });
  const trees = [190, 252, 318, 384, 452, 520, 760, 826, 894, 962, 1030, 1092].map((x, i) => { const g = G(g3b); el("line", { x1: 0, y1: 0, x2: 0, y2: -14, stroke: INK, "stroke-width": 2.5, "stroke-linecap": "round" }, g); el("path", { d: "M-11 -11 L0 -38 L11 -11 Z", fill: STONE }, g); return { g, x, d: R() }; });
  const water = el("rect", { x: 150, y: 480, width: 980, height: 0, fill: MUTED, "fill-opacity": 0.6 }, g3b);
  const waveA = el("path", { stroke: STONE, "stroke-width": 2.5, fill: "none" }, g3b), waveB = el("path", { stroke: STONE, "stroke-width": 1.8, fill: "none" }, g3b);
  const wave = (y0, amp, ph) => { let d = `M150 ${y0.toFixed(1)}`; for (let x = 170; x <= 1130; x += 20) d += ` L${x} ${(y0 + amp * Math.sin(x / 42 + ph)).toFixed(1)}`; return d; };
  const gen6 = T(g3b, "lab", 330, 170, "BEFORE THE FLOOD · GENESIS 6:5", 14), gen8 = T(g3b, "lab", 950, 170, "AFTER IT · GENESIS 8:21", 14);
  const notHeart = T(g3b, "lab", 640, 545, "THE EARTH CLEANSED, BUT NOT THE HEART", 15);
  const draw3 = (t) => {
    const v = span(t, CS("heart") - 0.1, H[1] + 0.6, 0.6, 0.6); op(g3, v);
    if (v > 0) { op(levLab, up(t, H[0] + 0.6, 0.7)); draw(ring3, up(t, H[0] + 0.9, 2.4)); op(ring3, 1 - up(t, at("heart", 0, 0.58), 0.6)); set(ring3, { transform: `rotate(${(t * 9).toFixed(1)} 640 325)` });
      spokes.forEach((s, i) => { const a = at("heart", 0, 0.62) + i * 0.55; draw(s.l, up(t, a, 0.6)); op(s.d, up(t, a + 0.4, 0.4)); op(s.lab, up(t, a + 0.3, 0.6)); set(s.d, { r: (5 + 0.8 * Math.sin(t * 2 + i)).toFixed(2) }); }); }
    const v2 = span(t, H[1] - 0.3, CS("promise") + 0.5, 0.6, 0.7); op(g3b, v2); if (v2 <= 0) return;
    draw(ground3, up(t, H[1] - 0.2, 1.2));
    const rise = up(t, at("heart", 1, 0.12), 1.9) - up(t, at("heart", 1, 0.46), 1.9), lev = 482 - 150 * rise;
    set(water, { y: lev.toFixed(1), height: Math.max(0, 482 - lev).toFixed(1) }); op(water, rise > 0.01 ? 1 : 0);
    waveA.setAttribute("d", wave(lev, 5, t * 2.2)); waveB.setAttribute("d", wave(lev + 22, 3.5, t * 1.7 + 1)); op(waveA, clamp(rise * 4)); op(waveB, clamp(rise * 4) * 0.8);
    const under = clamp(rise * 1.6);
    trees.forEach((tr) => { const k = up(t, H[1] + 0.2 + tr.d * 0.8, 0.6); move(tr.g, tr.x, 470, mix(1, 0.5, under), 2 * Math.sin(t * 1.1 + tr.x)); op(tr.g, k * (1 - under)); });
    op(gen6, up(t, H[1] + 0.3, 0.6)); op(gen8, up(t, at("heart", 1, 0.47), 0.6)); op(notHeart, up(t, at("heart", 1, 0.8), 0.7));
  };

  // ================= 4. a new heart: the road to Babylon; the command and the promise; stone made flesh =================
  const g4 = G(), XJ = 300, XB = 980, YM = 172;
  const arcPt = (k) => [mix(mix(XJ, 640, k), mix(640, XB, k), k), mix(mix(YM, 118, k), mix(118, YM, k), k)];
  const route = [...Array(26)].map((_, i) => { const [x, y] = arcPt(i / 25); return el("circle", { cx: x, cy: y, r: 2.6, fill: STONE }, g4); });
  const cityJ = el("circle", { cx: XJ, cy: YM, r: 8, fill: INK }, g4), cityB = el("circle", { cx: XB, cy: YM, r: 8, fill: INK }, g4);
  const labJ = T(g4, "lab", XJ, 208, "JERUSALEM", 14), labB = T(g4, "lab", XB, 208, "BABYLON", 14), labE = T(g4, "lab", 640, 208, "EZEKIEL, A PRIEST AMONG THE EXILES", 14);
  const exiles = [...Array(5)].map(() => el("circle", { r: 4.5, fill: INK }, g4));
  const card = (x, title, ref, solid) => { const g = G(g4); el("rect", { x: x - 115, y: 312, width: 230, height: 156, rx: 8, fill: PAPER, stroke: LINE, "stroke-width": 2 }, g); const ic = G(g); move(ic, x, 372, 0.42);
    el("path", solid ? { d: HEART, fill: PAPER, stroke: INK, "stroke-width": 5 } : { d: HEART, fill: "none", stroke: STONE, "stroke-width": 5, "stroke-dasharray": "10 9" }, ic);
    T(g, "lab", x, 430, title, 14); T(g, "lab", x, 454, ref, 12); return g; };
  const cmd = card(300, "THE COMMAND", "EZEKIEL 18:31", false), prm = card(980, "THE PROMISE", "EZEKIEL 36:26", true);
  const stoneLab = T(g4, "lab", 640, 540, "A HEART OF STONE", 15), fleshLab = T(g4, "lab", 640, 540, "A HEART OF FLESH", 15);
  const draw4 = (t) => {
    const v = span(t, CS("promise") - 0.1, P[2] + 0.3, 0.6, 0.6); op(g4, v); if (v <= 0) return;
    route.forEach((d, i) => op(d, up(t, P[0] + 0.2 + i * 0.05, 0.3)));
    op(cityJ, up(t, P[0], 0.5)); op(labJ, up(t, P[0] + 0.2, 0.5)); op(cityB, up(t, P[0] + 1.3, 0.5)); op(labB, up(t, P[0] + 1.5, 0.5)); op(labE, up(t, at("promise", 0, 0.22), 0.6));
    exiles.forEach((e, i) => { const k = up(t, P[0] + 0.5 + i * 0.3, 2.6), [x, y] = arcPt(k); set(e, { cx: (x + (i - 2) * 9 * k).toFixed(1), cy: (y - 10 - 2 * Math.abs(Math.sin(t * 3 + i)) * (k < 1 ? 1 : 0.3)).toFixed(1) }); op(e, up(t, P[0] + 0.4 + i * 0.3, 0.3)); });
    const ck = up(t, at("promise", 0, 0.6), 0.8); op(cmd, ck); set(cmd, { transform: `translate(0 ${(10 * (1 - ck) + 2 * Math.sin(t * 0.9)).toFixed(1)})` });
    const pk = up(t, P[1] + 0.2, 0.8); op(prm, pk); set(prm, { transform: `translate(0 ${(10 * (1 - pk) + 2 * Math.sin(t * 0.9 + 1)).toFixed(1)})` });
    op(stoneLab, span(t, P[0] + 0.8, at("promise", 1, 0.45), 0.6, 0.5)); op(fleshLab, up(t, at("promise", 1, 0.6), 0.7));
  };

  // ================= the valley of dry bones (Ezekiel 37), shown again in "life" =================
  const gBn = G();
  const valley = line(gBn, "M110 300 C230 300 300 500 420 500 L860 500 C980 500 1050 300 1170 300", { stroke: LINE, "stroke-width": 3 });
  const RB = rng(77);
  const bones = [...Array(18)].map((_, i) => { const c = i % 6, r = Math.floor(i / 6); return { b: mkBone(gBn), lx: 450 + RB() * 380, ly: 476 + RB() * 18, la: RB() * 180, sx: 480 + c * 64 + (r % 2) * 32, sy: 470 - r * 46, d: RB() }; });
  const winds = [...Array(5)].map((_, i) => line(gBn, `M${150 + i * 30} ${330 + i * 24} C400 ${292 + i * 24} 700 ${384 + i * 24} ${1130 - i * 20} ${322 + i * 26}`, { stroke: STONE, "stroke-width": 2.2, "stroke-dasharray": "0.3 2" }));
  const ezLab = T(gBn, "lab", 640, 150, "EZEKIEL 37", 13), ruach = T(gBn, "lab", 640, 178, "RUACH · BREATH, WIND, SPIRIT", 15);
  const bonesAt = (t, a, b, w, st, s, labs) => {
    const v = span(t, a, b, 0.6, 0.6); if (v <= 0) return 0;
    gBn.setAttribute("transform", `translate(640 400) scale(${s}) translate(-640 -400)`);
    draw(valley, up(t, a, 1.0));
    bones.forEach((o) => { const k = up(t, st + o.d * 1.2, 1.1), x = mix(o.lx, o.sx, k), y = mix(o.ly, o.sy, k) - Math.sin(k * Math.PI) * 12, ang = mix(o.la, 90, k);
      move(o.b, x, y + Math.sin(t * 1.3 + o.sx) * 1.2 * k, 1, ang); op(o.b, up(t, a + 0.2 + o.d * 0.6, 0.5)); });
    winds.forEach((wl, i) => { const k = clamp((t - w - i * 0.22) / 1.7); wl.setAttribute("stroke-dashoffset", (0.3 - k * 1.35).toFixed(3)); op(wl, k > 0 && k < 1 ? 1 : 0); });
    op(ezLab, labs ? up(t, a + 0.3, 0.6) : 0); op(ruach, labs ? up(t, w + 0.2, 0.6) : 0);
    return v;
  };

  // ================= 5. by night: Nicodemus; John 3:3; the Greek word =================
  const N = Ls("night");
  const gN = G();
  const ground5 = line(gN, "M150 470 H1130", { "stroke-width": 2.5 });
  const stars = [...Array(24)].map(() => ({ e: el("circle", { cx: (160 + R() * 860).toFixed(1), cy: (120 + R() * 170).toFixed(1), r: (1.6 + R() * 1.8).toFixed(2), fill: STONE }, gN), p: R() * 6.28 }));
  const moon = G(gN); el("circle", { r: 30, fill: STONE }, moon); el("circle", { cx: 12, cy: -8, r: 27, fill: BONE }, moon); move(moon, 1070, 175);
  const house = G(gN); el("path", { d: "M820 470 V385 L900 330 L980 385 V470", fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, house); el("rect", { x: 884, y: 420, width: 32, height: 50, fill: CHAR }, house);
  const win = el("rect", { x: 838, y: 398, width: 30, height: 26, fill: MUSTARD }, house);
  const trail = [...Array(13)].map((_, i) => el("circle", { cx: 210 + i * 50, cy: 482, r: 2.2, fill: LINE }, gN));
