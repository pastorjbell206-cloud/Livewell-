    if (sv) { const rise = up(t, D1 + 2.0, 1.5), ico = up(t, E0 - 0.8, 1.2);
      move(gStone, mix(mix(640, 450, rise), 478, ico), mix(mix(452, 300, rise), 300, ico) + 2.5 * Math.sin(t * 0.9) * rise * (1 - ico), mix(mix(0.42, 1.45, rise), 0.6, ico), mix(-6, 0, rise));
      carve.forEach((c) => op(c.e, up(t, D1 + 3.0 + c.r * 0.16 + (c.x + 56) * 0.004, 0.4))); }
    const cv = span(t, D1 + 3.5, E0 - 0.2, 0.6, 0.6); op(gCall, cv);
    if (cv > 0) { draw(callLine, up(t, D1 + 3.6, 0.7)); op(house, up(t, D1 + 3.9, 0.9)); house.setAttribute("x", (908 + 14 * (1 - up(t, D1 + 3.9, 1.2))).toFixed(1)); op(houseLab, up(t, D1 + 4.7, 0.7)); }
  };
  const drawProof = (t) => {
    const v = span(t, E0 - 0.5, F0 + 0.2, 0.5, 0.7); op(gProof, v);
    if (v > 0) { op(icoCopies, up(t, E0 - 0.3, 0.6)); op(icoScroll, up(t, E0, 0.6));
      const k = up(t, E1 + 0.2, 3.0); draw(proofLine, k); set(walker, { cx: (mix(570, 830, k) + (k >= 1 ? 2.5 * Math.sin(t * 1.6) : 0)).toFixed(1) }); op(walker, up(t, E0 + 0.6, 0.5));
      op(labOld, up(t, E1 + 0.9, 0.6)); op(labReal, up(t, E1 + 2.1, 0.6)); draw(gapLine, up(t, E1 + 3.3, 1.0)); op(labTrust, up(t, E1 + 4.3, 0.6)); }
    // the ring: trust, out of evidence's reach; then it becomes the opening of the book
    const rv = up(t, E1 + 3.6, 0.8) * (1 - up(t, F0 + 0.7, 0.7)); op(ring, rv);
    if (rv > 0) { const g = up(t, F0 - 0.5, 1.2); set(ring, { cx: mix(1064, 640, g).toFixed(1), cy: mix(300, 322, g).toFixed(1), r: (mix(44, 8, up(t, F0 + 0.5, 0.9)) + 3 * Math.sin(t * 1.5) * (1 - g)).toFixed(2) }); }
  };

  // ================= 6 and 7: the book, its own claim, the questions =================
  const gBreath = el("g", {}, world), gBook = el("g", {}, world), gVerse = el("g", {}, world), gQ = el("g", {}, world);
  const pageD = (s) => `M0 -50 C${-40 * s} -70 ${-110 * s} -70 ${-150 * s} -55 L${-150 * s} 55 C${-110 * s} 40 ${-40 * s} 40 0 60 Z`;
  const pgL = el("path", { d: pageD(1), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1 }, gBook);
  const pgR = el("path", { d: pageD(-1), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1 }, gBook);
  const pLines = []; [1, -1].forEach((s) => [-28, -10, 8, 26].forEach((dy) => pLines.push(line(gBook, `M${-22 * s} ${dy - 8} C${-60 * s} ${dy - 20} ${-100 * s} ${dy - 20} ${-132 * s} ${dy - 10}`, { stroke: STONE, "stroke-width": 2.2 }))));
  const flip = el("path", { d: pageD(-1), fill: PAPER, stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, gBook);
  const breaths = [...Array(9)].map((_, i) => ({ x: 420 + i * 55 + (R() - 0.5) * 30, ph: R(), sp: 0.16 + R() * 0.08, e: el("path", { stroke: MUSTARD, "stroke-width": 2.2, "stroke-linecap": "round" }, gBreath) }));
  const vClip = el("clipPath", { id: "verse" }, gVerse), vRect = el("rect", { x: 140, y: 180, height: 110, width: 0 }, vClip);
  const verse = txt(gVerse, "disp", 640, 262, "“All Scripture is God-breathed”", 70, { "clip-path": "url(#verse)" });
  const ref = txt(gVerse, "lab", 640, 316, "2 TIMOTHY 3:16 · BEREAN STANDARD BIBLE");
  const qs = [...Array(9)].map((_, i) => { const left = i % 2 === 0, a = { x0: left ? 70 + R() * 150 : 1060 + R() * 150, y0: 130 + R() * 380, size: 46 + Math.round(R() * 44), at: G0 + 0.3 + i * 0.36 }; a.e = txt(gQ, "disp", 0, 0, "?", a.size, { fill: STONE }); return a; });

  const drawBook = (t) => {
    const bv = up(t, F0 + 0.3, 0.5) * (1 - up(t, END + 0.6, 0.7)); op(gBook, bv);
    if (bv > 0) { const d = up(t, F0 + 0.3, 1.5); draw(pgL, d); draw(pgR, d); pgL.setAttribute("fill-opacity", up(t, F0 + 0.9, 0.8)); pgR.setAttribute("fill-opacity", up(t, F0 + 0.9, 0.8));
      const down = up(t, F1 - 1.0, 1.0) * (1 - up(t, G0 - 0.2, 1.1));
      move(gBook, 640, mix(326, 446, down) + 2 * Math.sin(t * 0.8), mix(1.12, 0.82, down));
      pLines.forEach((l, i) => { draw(l, up(t, F0 + 1.1 + i * 0.08, 0.7)); l.setAttribute("stroke", t > G0 + 1.6 + i * 0.36 ? MUSTARD : STONE); });
      const f1 = up(t, G1 + 0.05, 0.95), f2 = up(t, G1 + 0.85, 0.95), sx = t < G1 + 0.85 ? Math.cos(Math.PI * f1) : Math.cos(Math.PI * f2);
      op(flip, t > G1 && f2 < 1 ? 1 : 0); flip.setAttribute("transform", `scale(${sx.toFixed(3)} ${(1 + 0.05 * Math.sin(Math.PI * (t < G1 + 0.85 ? f1 : f2))).toFixed(3)})`); }
    const vv = span(t, F1 - 0.45, G0 + 0.5, 0.3, 0.7); op(gVerse, vv);
    if (vv > 0) { set(vRect, { width: (1000 * up(t, F1 - 0.35, 1.2)).toFixed(1) }); op(ref, up(t, F1 + 0.6, 0.7)); }
    const brv = span(t, F1 - 0.4, G0 + 0.6, 0.8, 0.8); op(gBreath, brv);
    if (brv > 0) breaths.forEach((b) => { const k = ((t * b.sp + b.ph) % 1), y = mix(400, 110, k), w = 9 * Math.sin(k * 9 + b.ph * 6);
      b.e.setAttribute("d", `M${(b.x + w).toFixed(1)} ${y.toFixed(1)} q${(8).toFixed(1)} -18 0 -36 t0 -36`); b.e.setAttribute("opacity", (0.42 * Math.sin(Math.PI * k)).toFixed(3)); });
    const qv = t > G0 && t < G1 + 1.2; op(gQ, qv ? 1 : 0);
    if (qv) qs.forEach((q) => { const k = up(t, q.at, 2.0), o = Math.min(up(t, q.at, 0.5), 1 - up(t, q.at + 1.45, 0.55)); op(q.e, o * 0.9);
      if (o > 0) move(q.e, mix(q.x0, 640, k), mix(q.y0, 330, k) + 12 * Math.sin(k * Math.PI), mix(1, 0.35, k)); });
  };

  F.title("Can you trust the Bible?");
  F.endCard(window.SCRIPT.chapters.at(-1).titleCard, END + 0.7);
  return (t) => { drawTree(t); drawScrolls(t); drawStone(t); drawProof(t); drawBook(t); };
});
