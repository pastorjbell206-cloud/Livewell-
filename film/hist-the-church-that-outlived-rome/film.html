    const fGhost = Math.max(span(t, S("patrick", 3) - 0.2, AT("patrick", 3, 0.5), 0.6) * 0.75, span(t, AT("close", 0, 0.3), S("close", 1) + 0.6, 0.8) * 0.6);
    front.forEach((fr) => { fr.e.setAttribute("d", frontD(fr, fDraw)); set(fr.e, { "stroke-width": (2.4 / C.s).toFixed(2), "stroke-dasharray": `${(7 / C.s).toFixed(2)} ${(6 / C.s).toFixed(2)}`, transform: `translate(0 ${(fOff < 1 ? 10 * fOff : 0).toFixed(1)})` }); op(fr.e, Math.max((1 - fOff) * (fDraw > 0 ? 1 : 0), fGhost)); });
    // the church's two marks
    [["rome", 0], ["cple", 1]].forEach(([n, i]) => { const [x, y] = V(B[n]), pulse = span(t, AT("fall", 1, 0.72), CE("fall") + 0.6, 0.5) + span(t, AT("close", 0, 0.6), S("close", 1) + 0.4, 0.6);
      move(crosses[i], x, y, 1 + 0.18 * pulse); op(crosses[i], up(t, AT("question", 0, 0.55), 0.8)); crosses[i]._c.setAttribute("stroke", pulse > 0.3 ? MUSTARD : INK); });
    for (const n in MK) { const m = MK[n], [x, y] = V(B[n]); set(m.e, { cx: x.toFixed(1), cy: y.toFixed(1) }); op(m.e, up(t, m.on, 0.6) * (1 - up(t, m.off, 0.6))); }
    ARCS.forEach((a) => { const pa = V(B[a.from]), pb = V(B[a.to]); a.e.setAttribute("d", qd(pa, pb, a.bend)); const k = up(t, a.a, a.dur); draw(a.e, k);
      const lit = a.gift && (t < a.a + a.dur + 1.6 || span(t, AT("close", 1, 0.04) + ARCS.indexOf(a) * 0.35, AT("close", 1, 0.04) + ARCS.indexOf(a) * 0.35 + 1.1, 0.3) > 0.5);
      a.e.setAttribute("stroke", lit ? MUSTARD : STONE); op(a.e, (k > 0 ? 1 : 0) * (1 - up(t, a.off, 0.6))); });
    LBL.forEach((l) => { const [x, y] = V(B[l.name]); set(l.e, { x: (x + l.dx).toFixed(1), y: (y + l.dy).toFixed(1) }); op(l.e, span(t, l.a, l.b, 0.5)); });
    op(worldLab, span(t, AT("question", 0, 0.2), S("fall", 0) + 0.2, 0.6));

    // 410: the Goths come down to Rome; a ring closes on the city
    gothDots.forEach((g, i) => { const u = clamp(up(t, AT("fall", 0, 0.0) + i * 0.12, 1.8)), [x, y] = qpt(V(B.goths), V(B.rome), 0.2, u * 0.94); set(g, { cx: (x + (i - 2) * 3).toFixed(1), cy: (y + ((i % 2) - 0.5) * 5).toFixed(1) }); op(g, span(t, S("fall", 0) - 0.1, AT("fall", 0, 0.6), 0.4)); });
    { const [x, y] = V(B.rome), k = up(t, AT("fall", 0, 0.22), 1.4); set(romeRing, { cx: x.toFixed(1), cy: y.toFixed(1), r: mix(48, 20, k).toFixed(1) }); op(romeRing, span(t, AT("fall", 0, 0.2), S("fall", 1) + 0.4, 0.5) * 0.8); }
    { const [x, y] = V(B.beth); move(page, x + 30, y - 26 + 2 * Math.sin(t)); op(page, span(t, AT("fall", 0, 0.58), CS("patrick"), 0.6)); }
    // 476: the empty throne
    throne.forEach((p, i) => draw(p, up(t, AT("fall", 1, 0.05) + i * 0.3, 1.0))); op(thr, span(t, AT("fall", 1, 0.0), CS("patrick") + 0.4, 0.4));
    op(thrL1, up(t, AT("fall", 1, 0.3), 0.6)); op(thrL2, up(t, AT("fall", 1, 0.36), 0.6));

    // Patrick: carried off, six years, faith, escape, the return with the gospel
    { const pBr = V(B.britain), pIr = V(B.ireland), Pa = [0, 1, 2, 3].map((k) => S("patrick", k));
      let pos = pBr; const take = up(t, AT("patrick", 0, 0.28), 1.6), esc = up(t, Pa[1] + 0.1, 1.4), back = up(t, AT("patrick", 1, 0.35), 2.4);
      if (take > 0) pos = qpt(pBr, pIr, 0.22, take);
      if (esc > 0) pos = qpt(pIr, pBr, 0.25, esc);
      if (back > 0) pos = qpt(pBr, pIr, -0.3, back);
      set(walker, { cx: pos[0].toFixed(1), cy: pos[1].toFixed(1) }); set(walkerCore, { cx: pos[0].toFixed(1), cy: pos[1].toFixed(1), r: (3.6 * up(t, AT("patrick", 0, 0.86), 0.8)).toFixed(2) });
      const wv = span(t, S("patrick", 0) - 0.2, S("patrick", 3) + 0.6, 0.6); op(walker, wv); op(walkerCore, wv);
      years.forEach((y, i) => { const a = -Math.PI / 2 + i * Math.PI / 3; set(y, { x1: (pIr[0] + Math.cos(a) * 14).toFixed(1), y1: (pIr[1] + Math.sin(a) * 14).toFixed(1), x2: (pIr[0] + Math.cos(a) * 22).toFixed(1), y2: (pIr[1] + Math.sin(a) * 22).toFixed(1) });
        op(y, up(t, AT("patrick", 0, 0.48) + i * 0.32, 0.3) * (1 - up(t, Pa[1] + 0.1, 0.6))); });
      const cx = pIr[0] - 150, cy = pIr[1] - 10; move(confess, cx, cy + 2 * Math.sin(t * 0.9)); op(confess, span(t, Pa[2] - 0.2, S("patrick", 3) + 0.2, 0.6));
      confRows.forEach((r, i) => draw(r, up(t, Pa[2] + 0.2 + i * 0.32, 0.5))); op(confRing, up(t, AT("patrick", 2, 0.78), 0.8) * (0.55 + 0.45 * Math.sin(t * 2.4)));
      set(confLab, { x: cx.toFixed(1), y: (cy + 74).toFixed(1) }); op(confLab, span(t, Pa[2] + 0.6, S("patrick", 3) + 0.2, 0.6)); }

    // Gregory: grain into Rome, a ring outward, Augustine's road to Kent with one turn back
    { const [rx, ry] = V(B.rome);
      grain.forEach((g) => { const k = up(t, AT("gregory", 0, 0.42) + g.d, 1.3), rr = mix(g.r0, 4, k); set(g.e, { cx: (rx + Math.cos(g.a) * rr).toFixed(1), cy: (ry + Math.sin(g.a) * rr).toFixed(1) }); op(g.e, span(t, AT("gregory", 0, 0.3), AT("gregory", 0, 0.42) + g.d + 1.2, 0.5)); });
      const ok = up(t, AT("gregory", 0, 0.8), 2.2); set(outRing, { cx: rx.toFixed(1), cy: ry.toFixed(1), r: mix(12, 120, ok).toFixed(1) }); op(outRing, ok > 0 && ok < 1 ? 1 - ok : 0);
      const a0 = AT("gregory", 1, 0.12), u = t < a0 + 1.2 ? 0.5 * up(t, a0, 1.2) : t < a0 + 1.8 ? mix(0.5, 0.42, up(t, a0 + 1.2, 0.6)) : mix(0.42, 1, up(t, a0 + 1.8, 1.2));
      const [mx, my] = qpt(V(B.rome), V(B.kent), -0.16, u); set(monk, { cx: mx.toFixed(1), cy: my.toFixed(1) }); op(monk, span(t, a0 - 0.3, S("gregory", 2), 0.4));
      draw(toKent.e, u); }
    // Boniface's oak
    { const [gx, gy] = V(B.geismar), fall = up(t, AT("gregory", 3, 0.48), 1.6); move(oak, gx, gy - 6, 0.8, -84 * fall); op(oak, span(t, S("gregory", 3) + 0.4, AT("gregory", 3, 0.48) + 2.4, 0.6) * (1 - 0.6 * fall)); }
    // rain on all alike
    { const rv = span(t, AT("slavs", 1, 0.6), AT("slavs", 2, 0.3), 0.9) * 0.55; rain.forEach((d) => { const y = 105 + ((d.y0 + t * d.v) % 480); set(d.e, { x1: d.x.toFixed(1), x2: (d.x - 2).toFixed(1), y1: y.toFixed(1), y2: (y + 12).toFixed(1) }); op(d.e, rv); }); }
    // the Saxon crown on the map, for "rode with power"
    { const [vx, vy] = V(B.verden); move(mapCrown, vx + 2, vy - 22); op(mapCrown, span(t, AT("close", 1, 0.62), S("close", 2) + 0.2, 0.5)); mapCrown.firstChild.setAttribute("fill", t > AT("close", 1, 0.8) ? MUTED : WARM);
      set(verdenRing, { cx: vx.toFixed(1), cy: vy.toFixed(1), r: mix(10, 30, up(t, S("reckoning", 1) + 0.2, 2.4)).toFixed(1) }); op(verdenRing, span(t, S("reckoning", 1) + 0.1, CE("reckoning") - 0.2, 0.6)); }

    // timeline
    const tv = Math.max(span(t, S("question", 0) + 0.8, CS("differ") + 0.1, 0.8), span(t, CS("reckoning") + 0.4, S("close", 2) + 0.4, 0.8));
    op(tlG, tv); draw(tlAxis, up(t, S("question", 0) + 0.8, 1.6)); op(tlA, up(t, S("question", 0) + 1.6, 0.6)); op(tlB, up(t, S("question", 0) + 1.8, 0.6));
    EVENTS.forEach((ev) => { op(ev.tick, up(t, ev.a, 0.5)); op(ev.dot, ev.lab ? span(t, ev.a, ev.b, 0.5) : 0); if (ev.lab) op(ev.lab, span(t, ev.a + 0.1, ev.b, 0.5)); });

    // kings
    { const v = span(t, AT("kings", 0, 0.3), CE("kings") - 0.1, 0.8); op(kG, v);
      if (v > 0) { const K = [0, 1, 2].map((k) => S("kings", k));
        move(king, 790, 214 + 2 * Math.sin(t * 0.8)); op(king, up(t, AT("kings", 0, 0.35), 0.7)); move(queen, 965, 222 + 2 * Math.sin(t * 0.8 + 1)); op(queen, up(t, AT("kings", 0, 0.62), 0.7));
        op(kingL, up(t, AT("kings", 0, 0.45), 0.6)); op(queenL, up(t, AT("kings", 0, 0.7), 0.6));
        draw(urge, up(t, AT("kings", 0, 0.72), 1.0)); op(urge, 0.55 + 0.45 * Math.sin(t * 2.2));
        river.forEach((r, i) => draw(r, up(t, K[1] - 0.4 + i * 0.3, 1.2)));
        crowd.forEach((d) => { const a = AT("kings", 1, 0.08) + (7 - d.c) * 0.32 + d.r * 0.07, k = up(t, a, 1.8), x = d.x + 300 * k, y = d.y + 3 * Math.sin(t * 1.3 + d.c);
          set(d.e, { cx: x.toFixed(1), cy: y.toFixed(1) }); op(d.e, up(t, K[1] - 0.6 + d.r * 0.05, 0.6));
          const crossed = k > 0.6, fillIn = up(t, AT("kings", 2, 0.3) + d.r * 0.55, 0.9);
          d.e.setAttribute("fill", !crossed ? STONE : d.deep || fillIn > 0.5 ? INK : BONE); d.e.setAttribute("stroke", crossed ? INK : STONE); });
        op(crowdL, span(t, K[1] - 0.2, K[2] + 0.4, 0.6)); op(loyalL, span(t, AT("kings", 1, 0.62), K[2] + 1.0, 0.6)); op(deepL, up(t, AT("kings", 2, 0.8), 0.7)); } }

    // gregory's advice
    { const v = span(t, S("gregory", 2) - 0.3, S("gregory", 3) + 0.1, 0.7); op(gG, v);
      if (v > 0) { const g0 = S("gregory", 2); temple.forEach((p, i) => draw(p, up(t, g0 + i * 0.15, 0.8)));
        op(idol, up(t, g0 + 0.6, 0.5) * (1 - up(t, AT("gregory", 2, 0.3), 0.8))); op(altar, up(t, AT("gregory", 2, 0.42), 0.8));
        draw(steps, up(t, AT("gregory", 2, 0.45), 1.2));
        const ck = clamp((t - AT("gregory", 2, 0.58)) / Math.max(1.5, E("gregory", 2) - AT("gregory", 2, 0.58))) * 6, si = Math.min(5, Math.floor(ck)), f = ease(ck - si);
        const sx = 733 + si * 66 + (si < 5 ? f * 66 : 0), sy = 520 - si * 43 - (si < 5 ? Math.sin(f * Math.PI / 2) * 43 : 0);
        set(climber, { cx: sx.toFixed(1), cy: (sy - 2).toFixed(1) }); op(climber, up(t, AT("gregory", 2, 0.55), 0.5)); op(stepsL, up(t, AT("gregory", 2, 0.7), 0.6)); } }

    // slavs: alphabet, three tongues
    { const v = span(t, AT("slavs", 0, 0.5), AT("slavs", 2, 0.0), 0.7); op(sG, v);
      if (v > 0) { move(alpha, 1070, 316 + 2 * Math.sin(t * 0.8)); op(alpha, span(t, AT("slavs", 0, 0.5), S("slavs", 1) + 0.4, 0.6));
        glyphs.forEach((g, i) => draw(g, up(t, AT("slavs", 0, 0.58) + i * 0.065, 0.4))); op(alphaL, span(t, AT("slavs", 0, 0.62), S("slavs", 1) + 0.4, 0.6));
        tongues.forEach((l, i) => op(l, span(t, AT("slavs", 1, 0.1) + i * 0.45, AT("slavs", 1, 0.55), 0.5))); op(alikeL, span(t, AT("slavs", 1, 0.72), S("slavs", 2) + 0.6, 0.6)); } }

    // differ: three churches, equal in every way; each emblem drawn on its own line
    { const v = span(t, CS("differ") + 0.2, CS("reckoning") + 0.5, 0.6, 0.7); op(dG, v);
      if (v > 0) { const D = [0, 1, 2, 3].map((k) => S("differ", k));
        const all = t > E("differ", 3) + 0.3;
        panels.forEach((p, i) => { p.parts.forEach((q, j) => { draw(q, up(t, CS("differ") + 0.3 + j * 0.3, 1.1)); q.setAttribute("stroke", all || span(t, D[i + 1] - 0.2, (D[i + 2] ?? CE("differ") + 5) - 0.3, 0.5) > 0.5 ? INK : STONE); });
          op(p.name, up(t, D[i + 1], 0.6)); move(p.g, 0, 2 * Math.sin(t * 0.7 + i)); });
        emb.forEach((parts, i) => parts.forEach((q, j) => draw(q, up(t, D[i + 1] + 0.4 + j * 0.4, 1.0)))); } }

    // reckoning
    { const v = span(t, CS("reckoning") + 0.1, CE("reckoning") + 0.1, 0.8); op(rG, v);
      if (v > 0) { const Rk = [0, 1, 2, 3].map((k) => S("reckoning", k)), first = 1 - up(t, Rk[1] - 0.2, 0.8), gone = 1 - up(t, Rk[2] - 0.2, 0.7);
        op(cKing, up(t, AT("reckoning", 0, 0.2), 0.7) * first * gone + span(t, Rk[3] - 0.2, CE("reckoning") + 1, 0.6));
        op(cKingL, up(t, AT("reckoning", 0, 0.3), 0.6) * first * gone);
        decade.forEach((d, i) => op(d, up(t, AT("reckoning", 0, 0.3) + i * 0.08, 0.3) * first * gone)); op(decadeL, up(t, AT("reckoning", 0, 0.5), 0.6) * first * gone);
        move(law, 1110, 232); op(law, up(t, AT("reckoning", 0, 0.68), 0.7) * first * gone); op(lawL, up(t, AT("reckoning", 0, 0.75), 0.6) * first * gone);
        const al = span(t, Rk[2] - 0.1, Rk[3] + 0.2, 0.6);
        move(font, 720, 440); op(font, al); op(fontL, al); set(belief, { r: (38 + 2 * Math.sin(t * 1.6)).toFixed(1) }); op(belief, al); op(beliefL, al);
        water.setAttribute("d", `M-52 2 Q-26 ${(2 + 5 * Math.sin(t * 2)).toFixed(1)} 0 2 Q26 ${(2 - 5 * Math.sin(t * 2)).toFixed(1)} 52 2`);
        draw(drag, up(t, AT("reckoning", 2, 0.3), 1.6)); op(drag, al); op(gapMark, al * up(t, AT("reckoning", 2, 0.45), 0.6));
        move(alc, 880, 262 + 2 * Math.sin(t)); op(alc, span(t, Rk[2], Rk[3] + 0.1, 0.6) * (1 - 0.6 * up(t, AT("reckoning", 2, 0.8), 0.8))); op(alcL, span(t, Rk[2] + 0.3, Rk[3] + 0.1, 0.6));
        const dk = up(t, Rk[3] + 0.6, 1.2); set(drop, { transform: `translate(860 ${mix(120, 160, dk).toFixed(1)})` }); op(drop, span(t, Rk[3] + 0.4, Rk[3] + 1.9, 0.3));
        const rk = up(t, Rk[3] + 1.7, 1.4); set(ripple, { cx: 860, cy: 168, rx: (10 + 40 * rk).toFixed(1), ry: (3 + 10 * rk).toFixed(1) }); op(ripple, rk > 0 && rk < 1 ? 1 - rk : 0);
        move(cKing, 860, 222 + 2 * Math.sin(t * 0.8)); } }

    // close: Zechariah 4:6, then the light passed person to person
    { const Z = [0, 1, 2, 3, 4].map((k) => S("close", k)), v = span(t, Z[2] + 0.2, END + 2.0, 0.8); op(zG, v);
      if (v > 0) { const vk = 1 - up(t, Z[4] + 0.1, 0.9);
        vLines.forEach((l, i) => op(l, up(t, Z[3] + i * 2.6, 0.9) * vk)); op(vRef, up(t, AT("close", 2, 0.45), 0.8) * vk);
        const n = people.length, lk = clamp((t - AT("close", 4, 0.05)) / Math.max(2, E("close", 5) - AT("close", 4, 0.05))) * (n - 1), li = Math.floor(lk);
        people.forEach((p, i) => { op(p.e, up(t, Z[2] + 0.6 + i * 0.3, 0.8) * 0.9); const lit = lk >= i && t > AT("close", 4, 0.05); p.e.setAttribute("fill", lit ? INK : BONE); p.e.setAttribute("stroke", lit ? INK : STONE);
          const rr = clamp(lk - i); set(p.ring, { r: (8 + 10 * rr).toFixed(1) }); op(p.ring, lit && rr < 1 ? 1 - rr : 0); });
        const fx = mix(people[Math.min(li, n - 1)].x, people[Math.min(li + 1, n - 1)].x, ease(lk - li)); set(light, { cx: fx.toFixed(1), cy: (500 - 18 - 6 * Math.sin((lk - li) * Math.PI)).toFixed(1) }); op(light, span(t, AT("close", 4, 0.05), END + 0.8, 0.4));
        move(zCrown, 640, 420); op(zCrown, span(t, S("close", 5) - 0.1, AT("close", 5, 0.45), 0.5)); } }
  };
});
