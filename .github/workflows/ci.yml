name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Content gates (life + study-guide + pathways + theology + politics + scripture validators)
        run: |
          node scripts/validate-scripture.mjs
          node scripts/validate-design.mjs
          node scripts/validate-life.mjs
          node scripts/validate-studyguides.mjs
          node scripts/validate-pathways.mjs
          node scripts/validate-theology.mjs
          node scripts/validate-politics.mjs
          node scripts/validate-no-emdash.mjs
          node scripts/validate-content-integrity.mjs
          node scripts/validate-skeptic-track.mjs
          node scripts/validate-answers.mjs
          node scripts/validate-argument-cases.mjs
          node scripts/validate-links.mjs
          node scripts/validate-needs.mjs
          node scripts/validate-needs.mjs --drafts
          node scripts/validate-grow-links.mjs
          node scripts/validate-plans.mjs
          node scripts/validate-workbooks.mjs
          node scripts/validate-family.mjs
          node scripts/validate-grow-voice.mjs
          node scripts/validate-verse-guides.mjs
          pnpm exec tsx scripts/validate-catalogue.mjs
          node scripts/validate-bible.mjs
          node scripts/validate-bible-notes.mjs

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Every URL the sitemap advertises must be prerendered and must
      # canonicalise to itself. A page that points its canonical elsewhere asks
      # Google not to index it; across 1,700+ URLs a single wrong default would
      # be invisible until traffic disappeared.
      - name: Canonical audit (sitemap → prerendered head)
        run: |
          pnpm run sitemap
          pnpm run prerender
          pnpm run audit:canonicals

  quality:
    # Lighthouse + axe against the built site, in a runner where Chrome exists.
    # Informational on PRs (does not block) until baselines stabilize.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prerender too, so Lighthouse measures the HTML Vercel actually ships
      # (build:vercel runs prerender; the static home hero lives there).
      - run: pnpm run sitemap && pnpm run build && pnpm run prerender
      - name: Serve built site
        id: serve
        run: npx serve -s dist/public -l 4173 &
      - name: Lighthouse (home)
        # One run on a shared runner swings by 20+ points (87, then 63, on the
        # same build), so take three and keep the run with the median
        # performance score, as Lighthouse CI does with numberOfRuns. A run
        # that errors out (NO_FCP, PAGE_HUNG) is left out rather than failing
        # the step; the step fails only if no run produced a report.
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse http://localhost:4173/ \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path=./lh-$i.json --quiet \
              || echo "::warning::Lighthouse run $i failed"
          done
          node -e "
            const fs = require('fs');
            const runs = [];
            for (const i of [1, 2, 3]) {
              try {
                const r = JSON.parse(fs.readFileSync('./lh-' + i + '.json', 'utf8'));
                if (r.runtimeError) throw new Error(r.runtimeError.code);
                const score = r.categories.performance.score ?? 0;
                runs.push({ i, score });
                console.log('run ' + i + ': performance ' + Math.round(score * 100));
              } catch (e) {
                console.log('run ' + i + ': no usable report (' + e.message + ')');
              }
            }
            if (runs.length === 0) { console.error('No Lighthouse run produced a usable report'); process.exit(1); }
            runs.sort((a, b) => a.score - b.score);
            const mid = runs[Math.floor((runs.length - 1) / 2)];
            fs.copyFileSync('./lh-' + mid.i + '.json', './lh.json');
            console.log('using run ' + mid.i + ' (the median of ' + runs.length + ')');
          "
          node -e "const r=require('./lh.json').categories; for (const k in r) console.log(k, Math.round(r[k].score*100))"
      - name: Lighthouse thresholds (docs/WORLD-CLASS-SITE-PROMPT.md — asserted, not printed)
        run: |
          node -e "
            const r = require('./lh.json').categories;
            const min = { performance: 90, accessibility: 90, 'best-practices': 95, seo: 95 };
            let bad = 0;
            for (const k in min) {
              const s = Math.round((r[k]?.score ?? 0) * 100);
              const ok = s >= min[k];
              console.log((ok ? 'ok  ' : 'FAIL') + ' ' + k.padEnd(15) + s + ' (min ' + min[k] + ')');
              if (!ok) bad++;
            }
            if (bad) { console.error(bad + ' Lighthouse category(ies) below threshold'); process.exit(1); }
          "
      - name: Axe (home)
        # Runs whenever the site is being served, even when a Lighthouse step
        # fails, so a slow score never hides an accessibility violation.
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: |
          # axe exits 1 on real accessibility violations and 2 on environment
          # errors (e.g. ChromeDriver/Chrome major-version skew when upstream
          # ships a new ChromeDriver before the runner image updates Chrome).
          # Surface genuine violations; treat a driver-version mismatch as noise.
          #
          # Only "/" is audited here. Every other route is a lazy-loaded chunk
          # (React.lazy in App.tsx); the crawler evaluates the served static HTML
          # before the route's JS loads and mounts, so it saw an empty SPA shell
          # (no main landmark, no h1) and reported false positives — even for
          # fully static pages. Home is a direct (non-lazy) import, so it is
          # rendered in time. It exercises the shared Layout, nav, footer, and a
          # hero h1 — the design system's a11y. Full-route a11y is covered by
          # axe/Lighthouse against live Vercel previews, per docs/ARCHITECTURE.
          sleep 3
          set +e
          npx --yes @axe-core/cli http://localhost:4173/ --exit
          code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::axe skipped — Chrome/ChromeDriver version mismatch (environment, not a content failure)"
            exit 0
          fi
          exit $code
