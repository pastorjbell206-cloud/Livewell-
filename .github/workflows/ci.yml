name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Content gates (life + study-guide + pathways + theology + politics + scripture validators)
        run: |
          node scripts/validate-scripture.mjs
          node scripts/validate-life.mjs
          node scripts/validate-studyguides.mjs
          node scripts/validate-pathways.mjs
          node scripts/validate-theology.mjs
          node scripts/validate-politics.mjs
          node scripts/validate-no-emdash.mjs
          node scripts/validate-content-integrity.mjs
          node scripts/validate-skeptic-track.mjs
          node scripts/validate-answers.mjs
          node scripts/validate-argument-cases.mjs
          node scripts/validate-links.mjs
          node scripts/validate-seo-layer.mjs
          node scripts/validate-notes.mjs

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Every URL the sitemap advertises must be prerendered and must
      # canonicalise to itself. A page that points its canonical elsewhere asks
      # Google not to index it; across 1,700+ URLs a single wrong default would
      # be invisible until traffic disappeared.
      - name: Canonical audit (sitemap → prerendered head)
        run: |
          pnpm run sitemap
          pnpm run prerender
          pnpm run audit:canonicals

  quality:
    # Lighthouse + axe against the built site, in a runner where Chrome exists.
    # Informational on PRs (does not block) until baselines stabilize.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prerender too, so Lighthouse measures the HTML Vercel actually ships
      # (build:vercel runs prerender; the static home hero lives there), and
      # the static essays so the front page and search have their files.
      - run: pnpm run sitemap && pnpm run essays:public && pnpm run build && pnpm run prerender
      - name: Serve built site
        run: npx serve -s dist/public -l 4173 &
      - name: Lighthouse (home, median of three)
        # A single Lighthouse run on a shared runner swings by twenty points
        # (79, 75 and 50 on three consecutive commits that changed little on
        # the front page). Three runs, the median by performance, and the
        # metrics behind the score so a drop can be read, not guessed at.
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse http://localhost:4173/ \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path=./lh-$i.json --quiet
          done
          node -e "
            const runs = [1,2,3].map(i => require('./lh-' + i + '.json'));
            runs.sort((a, b) => a.categories.performance.score - b.categories.performance.score);
            const r = runs[1];
            require('fs').writeFileSync('./lh.json', JSON.stringify(r));
            console.log('performance runs:', runs.map(x => Math.round(x.categories.performance.score * 100)).join(' / '), '(median kept)');
            for (const k in r.categories) console.log(k, Math.round(r.categories[k].score * 100));
            const a = r.audits;
            for (const k of ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','interactive']) console.log('  ' + k, a[k] && a[k].displayValue);
            // Lighthouse 13: the LCP element and its render delay live in the
            // lcp-breakdown-insight audit (a table of subparts, then the node).
            const lcp = a['lcp-breakdown-insight'];
            const items = (lcp && lcp.details && lcp.details.items) || [];
            const node = items.find(x => x.type === 'node');
            const table = items.find(x => x.type === 'table');
            if (node) console.log('  lcp element:', node.selector, '|', String(node.nodeLabel || '').slice(0, 90));
            if (table) for (const row of table.items) console.log('    ' + row.label + ': ' + Math.round(row.duration) + ' ms');
          "
      - name: Lighthouse thresholds (docs/WORLD-CLASS-SITE-PROMPT.md — asserted, not printed)
        run: |
          node -e "
            const r = require('./lh.json').categories;
            const min = { performance: 90, accessibility: 90, 'best-practices': 95, seo: 95 };
            let bad = 0;
            for (const k in min) {
              const s = Math.round((r[k]?.score ?? 0) * 100);
              const ok = s >= min[k];
              console.log((ok ? 'ok  ' : 'FAIL') + ' ' + k.padEnd(15) + s + ' (min ' + min[k] + ')');
              if (!ok) bad++;
            }
            if (bad) { console.error(bad + ' Lighthouse category(ies) below threshold'); process.exit(1); }
          "
      - name: Axe (home)
        run: |
          # axe exits 1 on real accessibility violations and 2 on environment
          # errors (e.g. ChromeDriver/Chrome major-version skew when upstream
          # ships a new ChromeDriver before the runner image updates Chrome).
          # Surface genuine violations; treat a driver-version mismatch as noise.
          #
          # Only "/" is audited here. Every other route is a lazy-loaded chunk
          # (React.lazy in App.tsx); the crawler evaluates the served static HTML
          # before the route's JS loads and mounts, so it saw an empty SPA shell
          # (no main landmark, no h1) and reported false positives — even for
          # fully static pages. Home is a direct (non-lazy) import, so it is
          # rendered in time. It exercises the shared Layout, nav, footer, and a
          # hero h1 — the design system's a11y. Full-route a11y is covered by
          # axe/Lighthouse against live Vercel previews, per docs/ARCHITECTURE.
          #
          # September 2026: the driver mismatch had silently skipped this step
          # for months, and only "/" was ever checked. browser-driver-manager
          # installs a Chrome and a ChromeDriver that match each other, and the
          # prerender step above gives every route real HTML, so ten routes are
          # audited, not one. --load-delay holds the scan four seconds after
          # the load event: the app's JavaScript starts after the first paint
          # (vite-paint-first.ts) and every route but home is a lazy chunk, so
          # a scan at load sees the static shell (no main landmark, no h1 on
          # hub pages) instead of the page the reader gets.
          sleep 3
          set +e
          npx --yes browser-driver-manager install chrome >/dev/null 2>&1
          if [ -f "$HOME/.browser-driver-manager/.env" ]; then
            # shellcheck disable=SC1090
            . "$HOME/.browser-driver-manager/.env"
          fi
          AXE_ARGS=""
          [ -n "$CHROME_TEST_PATH" ] && AXE_ARGS="$AXE_ARGS --chrome-path $CHROME_TEST_PATH"
          [ -n "$CHROMEDRIVER_TEST_PATH" ] && AXE_ARGS="$AXE_ARGS --chromedriver-path $CHROMEDRIVER_TEST_PATH"
          worst=0
          for route in / /writing /writing/is-jesus-really-the-only-way /books /books/believe /tools /start /about /notes /canon; do
            npx --yes @axe-core/cli "http://localhost:4173$route" $AXE_ARGS --load-delay 4000 --exit
            code=$?
            if [ "$code" = "2" ]; then
              echo "::warning::axe could not start a browser for $route (environment, not a content failure)"
            elif [ "$code" != "0" ]; then
              echo "::error::axe found accessibility violations on $route"
              worst=1
            fi
          done
          exit $worst
