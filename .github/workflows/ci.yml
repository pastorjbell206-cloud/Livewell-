name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Content gates (formation + life + table validators)
        run: |
          node scripts/validate-formation.mjs
          node scripts/validate-life.mjs
          node scripts/validate-table.mjs

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build      

  quality:
    # Lighthouse + axe against the built site, in a runner where Chrome exists.
    # Informational on PRs (does not block) until baselines stabilize.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sitemap && pnpm run build
      - name: Serve built site
        run: npx serve -s dist/public -l 4173 &
      - name: Lighthouse (home)
        run: |
          npx --yes lighthouse http://localhost:4173/ \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=./lh.json --quiet
          node -e "const r=require('./lh.json').categories; for (const k in r) console.log(k, Math.round(r[k].score*100))"
      - name: Axe (home, writing, resources)
        run: |
          # axe exits 1 on real accessibility violations and 2 on environment
          # errors (e.g. ChromeDriver/Chrome major-version skew when upstream
          # ships a new ChromeDriver before the runner image updates Chrome).
          # Surface genuine violations; treat a driver-version mismatch as noise.
          set +e
          npx --yes @axe-core/cli http://localhost:4173/ http://localhost:4173/writing http://localhost:4173/resources --exit
          code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::axe skipped — Chrome/ChromeDriver version mismatch (environment, not a content failure)"
            exit 0
          fi
          exit $code
