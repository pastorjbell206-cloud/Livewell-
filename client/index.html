<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <title>LiveWell by James Bell — Theology That Carries the Weight of Everyday Life</title>
    <meta name="description" content="Essays on theology, justice, marriage, parenting, and pastoral ministry. By James Bell, Lead Pastor and founder of the Pastors Connection Network." />
    <meta name="author" content="James Bell" />
  

    <!-- Fonts are self-hosted (client/public/fonts/, @font-face in index.css):
         no third-party connection before first paint, no Google Fonts IP
         disclosure. Preload only the two above-the-fold latin files; the rest
         load on demand via unicode-range. Font preloads require crossorigin
         even same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400-latin.woff2" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.livewellbyjamesbell.co/" />
    <meta property="og:title" content="LiveWell by James Bell" />
    <meta property="og:description" content="Theology that carries the weight of everyday life. Essays on faith, justice, marriage, parenting, and pastoral ministry." />
    <meta property="og:image" content="https://www.livewellbyjamesbell.co/api/og?title=LiveWell%20by%20James%20Bell&pillar=Theology%20for%20everyday%20life" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="LiveWell by James Bell" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LiveWell by James Bell" />
    <meta name="twitter:description" content="Theology that carries the weight of everyday life." />
    <meta name="twitter:image" content="https://www.livewellbyjamesbell.co/api/og?title=LiveWell%20by%20James%20Bell&pillar=Theology%20for%20everyday%20life" />

    <!-- Sitemap + RSS -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="alternate" type="application/rss+xml" title="LiveWell by James Bell" href="/rss.xml" />

    <!-- Organization + WebSite JSON-LD render on the home page through SEOMeta
         (getOrganizationSchema / getWebSiteSchema in components/SEOMeta.tsx).
         Kept out of the static HTML to avoid duplicate schema blocks. -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root">
      <!-- Static brand shell: paints as soon as the (render-blocking, local)
           CSS arrives and long before the JS bundle runs, so a deep link on a
           slow phone shows the masthead instead of blank cream. React replaces
           it on mount. Tokens come from :root in the built CSS. -->
      <div style="min-height:100vh;background:var(--bone,#F5F0E6)">
        <div style="height:58px;display:flex;align-items:center;padding:0 20px;background:rgba(245,240,230,.97);border-bottom:1px solid var(--border,#D9D3C4)">
          <span style="font-family:var(--F,Georgia,serif);font-size:20px;color:var(--ink,#14110C)">LiveWell</span>
          <span style="font-family:var(--U,sans-serif);font-size:9px;letter-spacing:.18em;color:var(--ink-muted,#5A5448);margin-left:10px">BY JAMES BELL</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
